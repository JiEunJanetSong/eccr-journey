54bb9f01cb3f820486b14f8e66b839ad09197a0e430fc8a4a6\",\n    \"/Users/janetmath/Ibjanetsong Dropbox/Song Janet/mina-janet/________아프리카-가나/가나교사와2026/야우/book/output/pdf/최종/ECCR_Book_3.pdf\": \"2dd23f1106fa8c371fbecc46cd0154f9b9f538b2e3bb46edc1604dc634e109aa\",\n    \"/Users/janetmath/Ibjanetsong Dropbox/Song Janet/mina-janet/________아프리카-가나/가나교사와2026/야우/book/output/pdf/최종/ECCR_Book_1.pdf\": \"83dedd392fde406d9ba456f8a97086d75d56ea7693f601e509a2a350861e7b43\",\n    \"/Users/janetmath/Ibjanetsong Dropbox/Song Janet/mina-janet/________아프리카-가나/가나교사와2026/야우/book/output/pdf/최종/ECCR_Book_0.pdf\": \"7853fc53df85045b579e409432cda6a0f72ce2713be29e40be9127fc010454d9\",\n    \"/Users/janetmath/Ibjanetsong Dropbox/Song Janet/mina-janet/________아프리카-가나/가나교사와2026/야우/book/output/pdf/최종/ECCR_Book_4.pdf\": \"5d75a8df034be605fcd8ebf33eac19ca9c840b901ad57f9c9f39e000124ba831\",\n    \"/Users/janetmath/Ibjanetsong Dropbox/Song Janet/mina-janet/________아프리카-가나/가나교사와2026/야우/book/output/pdf/최종/ECCR_Book_5.pdf\": \"8eb312b395fcfa4612301853908afb7115ac8d4404cd1799b5480d47aa86170c\",\n    \"/Users/janetmath/Ibjanetsong Dropbox/Song Janet/mina-janet/________아프리카-가나/가나교사와2026/야우/book/output/pdf/최종/ECCR_Book_7.pdf\": \"c034a3699368b9ce276590ede12a87f7279d6012edfc65588c6376e27dc07050\",\n    \"/Users/janetmath/Ibjanetsong Dropbox/Song Janet/mina-janet/________아프리카-가나/가나교사와2026/야우/book/output/pdf/최종/ECCR_Book_6.pdf\": \"3e333e7f85600fdebd55df381ad69ca371127a9613c270c52a8f7a283a1e5edd\"\n  }\n}", "url": ""}, "book/output/pdf/a4/book0_combined_20260919/COMBINED_REVIEW.md": {"text": "# Book 0 - Combined Learner Book\n\n90 A4 pages. Combines the original Book 0 teaching/practice material with the eight I Can Read picture passages. The existing 80-page PDF is preserved byte-for-byte as ECCR_Book_0-pre.pdf; its original cover still says Book 0 because its contents have not been edited. Its original review notes are preserved as ECCR_Book_0-pre_Yaw_Review.md.\n\n## Page map\n\n| PDF pages | Printed pages | Content |\n| --- | --- | --- |\n| 1-2 | Unnumbered | Combined Book 0 cover and inside title |\n| 3-73 | 1-71 | Original routine, teacher guidance, Twi vowels, core consonants, blending, reviews and optional digraph extension |\n| 74-79 | 72-77 | Original English Bridge; final navigation now points to I Can Read |\n| 80 | 78 | New English reading-readiness page |\n| 81-88 | 79-86 | Eight I Can Read picture passages |\n| 89 | 87 | Reader teacher guidance, with updated page references |\n| 90 | Unnumbered | Single combined-series colophon |\n\n## Important teaching gates\n\nThis remains a teacher-review draft, not a validated standardized programme or a research baseline test. Yaw must confirm the Twi sound inventory, sound values, word-picture prompts, formation and meanings described in the original review notes. The selected core consonants m, f, s, b, k, n remain provisional.\n\nThe English reader is not automatically accessible after short-a practice alone. Before assigning it, teach/confirm the English short vowels a, e, i, o, u, the consonants used, final consonant groups such as milk and fits, doubled letters such as egg and off, and word-ending s. Explicitly teach a, the, is, has, to, by, he and puts as needed. Select stories according to each learner's actual taught correspondences and readiness, not page order alone.\n\nEvery word in the eight reader story titles and passages is at most four letters. Short word length alone does not prove decodability. Each reader page has one illustration and five or six connected sentences; Yaw's Kim example is unchanged. No worksheets were added to the reader section.\n\n## Preservation and production\n\n- The earlier Book 0 is renamed, not deleted or rewritten. It can be restored from the -pre file at any time.\n- The two standalone I Can Read PDFs and Books 1-9 remain unchanged.\n- Duplicate reader cover, inside title and closing page are omitted from the combined edition; the original Book 0 closing page is replaced by one combined colophon.\n- Original teaching pages PDF 3-78 are pixel-identical to the previous Book 0. PDF 79 only has its onward navigation updated.\n- Printed folios run continuously from 1 to 87; odd on the right, even on the left. Covers and colophon are unnumbered.\n- PDF bookmarks provide navigation between learning sections and all eight stories.\n- 90 pages are suitable for an even-page A4 duplex sequence. Printer-specific imposition, spine width and bleed are not included.\n- Source and QA files: ../a4/book0_combined_20260919/.\n\nYaw review / changes required: __________________________________\n\nDate: ____________________\n", "url": ""}, "book/output/pdf/a4/build_entry_baseline.py": {"text": "from pathlib import Path\nfrom reportlab.pdfgen import canvas\nfrom reportlab.lib.pagesizes import A4\nfrom reportlab.lib.colors import HexColor\nfrom reportlab.pdfbase import pdfmetrics\nfrom reportlab.pdfbase.ttfonts import TTFont\nfrom reportlab.platypus import Paragraph\nfrom reportlab.lib.styles import ParagraphStyle\n\nROOT = Path(__file__).resolve().parent\nFONTS = Path('/Users/janetmath/Library/Python/3.11/lib/python/site-packages/open_webui/static/fonts')\nfor name, file in [('Regular', 'NotoSans-Regular.ttf'), ('Bold', 'NotoSans-Bold.ttf')]:\n    pdfmetrics.registerFont(TTFont(name, str(FONTS / file)))\nOUT = ROOT / 'ECCR_Foundational_Entry_Baseline_Asante_Twi.pdf'\nLETTERS = ['n', 'ɔ', 'a', 's', 'ɛ', 'w', 'o', 'm', 'e', 'd']\nW, H = A4\nc = canvas.Canvas(str(OUT), pagesize=A4)\nc.setTitle('ECCR Foundational Entry Baseline - Asante Twi Letter-Sound Assessment')\nINK = HexColor('#202827')\nGREEN = HexColor('#176B50')\n\ndef text(s, x, y, size=10, bold=False, color=INK):\n    c.setFillColor(color)\n    c.setFont('Bold' if bold else 'Regular', size)\n    c.drawString(x, y, s)\n\ndef para(s, x, top, width, size=9, leading=13):\n    p = Paragraph(s, ParagraphStyle('p', fontName='Regular', fontSize=size, leading=leading, textColor=INK))\n    _, height = p.wrap(width, 1000)\n    p.drawOn(c, x, top-height)\n\ndef line(x, y, right):\n    c.setStrokeColor(HexColor('#AAB3AF'))\n    c.setLineWidth(.5)\n    c.line(x, y, right, y)\n\ndef box(x, y):\n    c.setStrokeColor(INK)\n    c.setLineWidth(.6)\n    c.rect(x, y, 9, 9, stroke=1, fill=0)\n\ndef header(label):\n    text('ECCR Foundational Entry Baseline', 40, 797, 20, True, GREEN)\n    text('Asante Twi Letter-Sound Assessment', 40, 772, 14, True)\n    text(label, 40, 750, 10, False, GREEN)\n    line(40, 738, W-40)\n\ndef identity(y):\n    text('Learner Name:', 40, y)\n    line(117, y-3, 355)\n    text('Class:', 375, y)\n    line(412, y-3, W-40)\n    text('Date:', 40, y-27)\n    line(73, y-30, 260)\n    text('Assessor:', 280, y-27)\n    line(338, y-30, W-40)\n\ndef footer(n):\n    text('Draft pilot baseline tool - not a validated standardized test.', 40, 30, 8)\n    text(str(n), W-46, 30, 8)\n\nheader('PAGE 1 - Learner Assessment Card | Basic 1 | Before instruction')\nidentity(714)\npara('Point to each letter one at a time and ask the learner to say its sound. Do not provide the sound or correct the learner during the assessment.', 40, 659, W-80, 10, 15)\ntext('Ask: “What sound does this make?”', 40, 608, 11, True)\npara('Assess one learner at a time. Cover the other letters with a blank sheet; reveal only the current letter. Follow the numbered order. Do not give hints or rehearse sounds.', 40, 593, W-80, 9, 13)\nfor i, letter in enumerate(LETTERS):\n    col, row = i % 2, i // 2\n    x = 40 + col * 265\n    top = 540 - row * 94\n    text(str(i+1), x+8, top-14, 8, color=HexColor('#77817C'))\n    c.setFillColor(INK)\n    c.setFont('Regular', 48)\n    c.drawCentredString(x+118, top-62, letter)\nfooter(1)\nc.showPage()\n\nheader('PAGE 2 - Teacher Scoring Record | Same item order as learner card')\nidentity(714)\npara('\u003cb>Before classroom use:\u003c/b> Yaw must validate the locally accepted Asante Twi sounds and acceptable variants for all 10 symbols. This draft supplies no pronunciation key.', 40, 657, W-80, 9, 12)\npara('Mark one outcome per item. Correct = independently correct on the first attempt. Self-corrected = an initially incorrect response corrected without help before moving on; record separately. Incorrect includes a letter name without the target sound. No Response = no sound offered. Do not teach, correct, hint, or rehearse; allow a brief, consistent opportunity to respond.', 40, 617, W-80, 8.5, 12)\nxs = [40, 71, 112, 165, 223, 294, 378, W-40]\ntop = 549\nheaders = ['Item', 'Letter', 'Correct', 'Incorrect', 'No Response', 'Self-Corrected', 'Notes']\nfor j, h in enumerate(headers):\n    para(h, xs[j]+3, top-8, xs[j+1]-xs[j]-6, 7.3, 10)\nbottom = top-32-10*26\nfor x in xs:\n    line(x, bottom, x)  # vertical rules drawn explicitly below\n    c.line(x, bottom, x, top)\nfor y in [top, top-32] + [top-32-(i+1)*26 for i in range(10)]:\n    line(40, y, W-40)\nfor i, letter in enumerate(LETTERS):\n    y = top-32-i*26-18\n    text(str(i+1), 50, y, 9)\n    text(letter, 85, y-1, 15)\n    for j in range(2, 6):\n        box((xs[j]+xs[j+1])/2-4.5, y-1)\n\ntext('Total independently correct: ___ / 10', 40, 239, 12, True)\ntext('Number of letter sounds known: ___ / 10 (first-attempt Correct items)', 40, 223, 8)\ntext('Self-corrected: ___ / 10. Record separately; do not add to the total above.', 40, 208, 8)\ntext('Sounds the learner already knows:', 40, 188, 9, True)\nline(40, 173, W-40)\ntext('Sounds requiring instruction:', 40, 156, 9, True)\nline(40, 141, W-40)\ntext('Teacher observations:', 40, 125, 9, True)\nline(160, 123, W-40)\nline(40, 108, W-40)\ntext('Learner profile - descriptive teacher judgment; no score cut-offs', 40, 91, 8, True)\nprofiles = ['No letter sounds independently demonstrated yet', 'Knows a few letter sounds', 'Knows several letter sounds', 'Knows most/all assessed letter sounds']\nfor i, s in enumerate(profiles):\n    x = 40 if i \u003c 2 else 316\n    y = 73 - (i % 2)*16\n    box(x, y-2)\n    text(s, x+14, y, 7.2)\nfooter(2)\nc.save()\nprint(OUT)\n", "url": ""}, "eccr-picture-audio-site/shared/config.js": {"text": "window.ECCR_STATIC_AUDIO_ONLY = window.location.hostname.endsWith(\"github.io\");\nwindow.ECCR_TTS_API_BASE = window.ECCR_STATIC_AUDIO_ONLY ? \"\" : window.location.origin;\n", "url": "https://github.com/JiEunJanetSong/eccr-picture-audio-site/blob/3b87245/shared/config.js"}, "eccr-picture-audio-site/picturebook/a4_books.js": {"text": "(() => {\n  const COVER_BOX = { x: 12, y: 11, w: 76, h: 24 };\n  const BODY_BOX = { x: 8, y: 67, w: 84, h: 24 };\n  const TWI_BOX = { x: 10, y: 71, w: 80, h: 11 };\n  const ENGLISH_BOX = { x: 10, y: 82, w: 80, h: 10 };\n\n  function image(pageNumber) {\n    return `page-${String(pageNumber).padStart(2, \"0\")}.jpg`;\n  }\n\n  function hotspot(boxOrBoxes) {\n    if (Array.isArray(boxOrBoxes)) {\n      return { boxes: boxOrBoxes.map((box) => ({ ...box })) };\n    }\n    return { box: { ...boxOrBoxes } };\n  }\n\n  function recording(text, audioSrc, box = BODY_BOX, lang = \"twi\") {\n    return { text, speechText: text, audioSrc, ...hotspot(box), lang };\n  }\n\n  function missing(text, box, lang = \"twi\") {\n    return { text, speechText: text, ...hotspot(box), lang, recordingMissing: true };\n  }\n\n  function page(pageNumber, title, audio = []) {\n    return { title, image: image(pageNumber), audio };\n  }\n\n  function recordedPage(bookNumber, pageNumber, title, text = title, box = BODY_BOX, lang = \"twi\") {\n    return page(pageNumber, title, [\n      recording(text, `audio/book${bookNumber}/page-${String(pageNumber).padStart(2, \"0\")}.mp3`, box, lang),\n    ]);\n  }\n\n  function bilingualPage(bookNumber, pageNumber, twi, english) {\n    const base = `audio/book${bookNumber}/page-${String(pageNumber).padStart(2, \"0\")}`;\n    return page(pageNumber, twi, [\n      recording(twi, `${base}-twi.mp3`, TWI_BOX, \"twi\"),\n      recording(english, bel: \"MMS Akan/Twi\" },\n];\n\nconst books = Array.isArray(globalThis.ECCR_A4_BOOKS)\n  ? [...globalThis.ECCR_A4_BOOKS]\n  : [];\n\nbooks.sort(compareBooks);\n\nconst state = {\n  bookId: books[0].id,\n  pageIndex: 0,\n  audio: null,\n  playbackToken: 0,\n  englishVoice: DEFAULT_ENGLISH_TTS.voice,\n  twiVoice: DEFAULT_TWI_TTS.voice,\n};\n\nfunction compareBooks(a, b) {\n  return getBookNumber(a) - getBookNumber(b);\n}\n\nfunction getBookNumber(book) {\n  const match = String(book?.id || book?.title || \"\").match(/(\\d+)/);\n  return match ? Number(match[1]) : Number.MAX_SAFE_INTEGER;\n}\n\nconst els = {};\n\ndocument.addEventListener(\"DOMContentLoaded\", init);\n\nfunction init() {\n  Object.assign(els, {\n    bookSelect: document.getElementById(\"bookSelect\"),\n    englishVoiceSelect: document.getElementById(\"englishVoiceSelect\"),\n    twiVoiceSelect: document.getElementById(\"twiVoiceSelect\"),\n    statusPill: document.getElementById(\"statusPill\"),\n    pageImage: document.getElementById(\"pageImage\"),\n    hotspotLayer: document.getElementById(\"hotspotLayer\"),\n    pageTitle: document.getElementById(\"pageTitle\"),\n    pageCounter: document.getElementById(\"pageCounter\"),\n    pageDots: document.getElementById(\"pageDots\"),\n    prevBtn: document.getElementById(\"prevBtn\"),\n    nextBtn: document.getElementById(\"nextBtn\"),\n    ttsAudio: document.getElementById(\"ttsAudio\"),\n  });\n\n  state.audio = els.ttsAudio || new Audio();\n  renderBookOptions();\n  renderVoiceOptions();\n  bindEvents();\n  render();\n}\n\nfunction bindEvents() {\n  els.bookSelect.addEventListener(\"change\", () => {\n    state.bookId = els.bookSelect.value;\n    state.pageIndex = 0;\n    stopAudio();\n    render();\n  });\n  els.englishVoiceSelect?.addEventListener(\"change\", () => {\n    state.englishVoice = els.englishVoiceSelect.value;\n    stopAudio();\n  });\n  els.twiVoiceSelect?.addEventListener(\"change\", () => {\n    state.twiVoice = els.twiVoiceSelect.value;\n    stopAudio();\n  });\n  els.prevBtn.addEventListener(\"click\", previousPage);\n  els.nextBtn.addEventListener(\"click\", nextPage);\n  window.addEventListener(\"keydown\", (event) => {\n    if (event.key === \"ArrowLeft\") {\n      previousPage();\n    }\n    if (event.key === \"ArrowRight\" || event.key === \" \") {\n      event.preventDefault();\n      nextPage();\n    }\n  });\n}\n\nfunction renderBookOptions() {\n  els.bookSelect.innerHTML = books\n    .map((book) => `\u003coption value=\"${escapeHtml(book.id)}\">${escapeHtml(book.title)}\u003c/option>`)\n    .join(\"\");\n  els.bookSelect.value = state.bookId;\n}\n\nfunction renderVoiceOptions() {\n  if (els.englishVoiceSelect) {\n    els.englishVoiceSelect.innerHTML = ENGLISH_VOICES\n      .map((voice) => `\u003coption value=\"${escapeHtml(voice.value)}\">${escapeHtml(voice.label)}\u003c/option>`)\n      .join(\"\");\n    els.englishVoiceSelect.value = state.englishVoice;\n  }\n\n  if (els.twiVoiceSelect) {\n    els.twiVoiceSelect.innerHTML = TWI_VOICES\n      .map((voice) => `\u003coption value=\"${escapeHtml(voice.value)}\">${escapeHtml(voice.label)}\u003c/option>`)\n      .join(\"\");\n    els.twiVoiceSelect.value = state.twiVoice;\n  }\n}\n\nfunction render() {\n  const book = getBook();\n  const page = getPage();\n  els.pageImage.src = getPageImageSrc(book, page);\n  els.pageImage.alt = `${book.title}, ${page.title}`;\n  els.pageTitle.textContent = page.title;\n  els.pageCounter.textContent = `${state.pageIndex + 1} / ${book.pages.length}`;\n  els.prevBtn.disabled = state.pageIndex \u003c= 0;\n  els.nextBtn.disabled = state.pageIndex >= book.pages.length - 1;\n  renderHotspots(getPageAudioItems(page));\n  renderPageDots(book);\n}\n\nfunction getPageImageSrc(book, page) {\n  return `${book.assetDir}/${page.image || `page-${state.pageIndex + 1}.png`}`;\n}\n\nfunction getPageAudioItems(page) {\n  const items = page.titleBox ? [{ text: page.title, box: page.titleBox }] : [];\n  return items.concat(page.audio || []);\n}\n\nfunction renderHotspots(items) {\n  els.hotspotLayer.innerHTML = items\n    .flatMap((item, index) =>\n      getHotspotBoxes(item).map(\n        (box) => `\n        \u003cbutton\n          class=\"text-hotspot\"\n          type=\"button\"\n          data-audio-index=\"${index}\"\n          style=\"${getHotspotStyle(box)}\"\n          title=\"${escapeHtml(item.text)}\"\n          aria-label=\"Listen: ${escapeHtml(item.text)}\"\n        >\u003c/button>\n      `\n      )\n    )\n    .join(\"\");\n\n  els.hotspotLayer.querySelectorAll(\"[data-audio-index]\").forEach((button) => {\n    button.addEventListener(\"click\", () => {\n      const item = items[Number(button.dataset.audioIndex)];\n      playText(getSpeechText(item), button);\n    });\n  });\n\n}\n\nfunction getSpeechText(item) {\n  return item.speechText || item.text;\n}\n\nfunction getHotspotBoxes(item) {\n  return item.boxes || [item.box || estimateHotspotBox(item)];\n}\n\nfunction getHotspotStyle(box) {\n  return `left: ${box.x}%; top: ${box.y}%; width: ${box.w}%; height: ${box.h}%`;\n}\n\nfunction estimateHotspotBox(item) {\n  const width = Math.min(72, Math.max(10, item.text.length * 1.15));\n  const x = Math.max(4, (Number(item.x) || 50) - width);\n  const y = Math.max(4, (Number(item.y) || 50) - 2.3);\n  return {\n    x,\n    y,\n    w: Math.min(width + 4, 96 - x),\n    h: 5.4,\n  };\n}\n\nfunction renderPageDots(book) {\n  els.pageDots.innerHTML = book.pages\n    .map(\n      (_, index) => `\n        \u003cbutton class=\"page-dot${index === state.pageIndex ? \" active\" : \"\"}\" type=\"button\" data-page-index=\"${index}\">\n          ${index + 1}\n        \u003c/button>\n      `\n    )\n    .join(\"\");\n  els.pageDots.querySelectorAll(\"[data-page-index]\").forEach((button) => {\n    button.addEventListener(\"click\", () => {\n      state.pageIndex = Number(button.dataset.pageIndex);\n      stopAudio();\n      render();\n    });\n  });\n}\n\nfunction previousPage() {\n  if (state.pageIndex \u003c= 0) {\n    return;\n  }\n  state.pageIndex -= 1;\n  stopAudio();\n  render();\n}\n\nfunction nextPage() {\n  const book = getBook();\n  if (state.pageIndex >= book.pages.length - 1) {\n    return;\n  }\n  state.pageIndex += 1;\n  stopAudio();\n  render();\n}\n\nfunction playText(text, button) {\n  const token = ++state.playbackToken;\n  const item = getPageAudioItems(getPage())[Number(button.dataset.audioIndex)];\n  const url = buildTtsUrl(text, item);\n  if (!url) {\n    stopAudio();\n    els.statusPill.textContent = \"Audio coming soon\";\n    return;\n  }\n  clearPlaying();\n  stopAudio(false);\n  button.classList.add(\"playing\");\n  els.statusPill.textContent = \"Playing\";\n\n  state.audio.pause();\n  state.audio.src = url;\n  state.audio.defaultPlaybackRate = 1;\n  state.audio.playbackRate = 1;\n  state.audio.currentTime = 0;\n  state.audio.onended = () => finishPlayback(token, button);\n  state.audio.onerror = () => {\n    finishPlayback(token, button);\n    els.statusPill.textContent = \"Audio error\";\n  };\n  state.audio.play().catch((error) => {\n    finishPlayback(token, button);\n    els.statusPill.textContent = error?.name === \"NotAllowedError\" ? \"Tap again\" : \"Audio error\";\n  });\n}\n\nfunction finishPlayback(token, button) {\n  if (token !== state.playbackToken) {\n    return;\n  }\n  button?.classList.remove(\"playing\");\n  els.statusPill.textContent = getIdleStatusText();\n}\n\nfunction stopAudio(invalidate = true) {\n  if (invalidate) {\n    state.playbackToken += 1;\n  }\n  clearPlaying();\n  if (state.audio) {\n    state.audio.pause();\n    state.audio.removeAttribute(\"src\");\n    state.audio.load();\n  }\n  els.statusPill.textContent = getIdleStatusText();\n}\n\nfunction clearPlaying() {\n  els.hotspotLayer?.querySelectorAll(\".text-hotspot.playing\").forEach((item) => item.classList.remove(\"playing\"));\n}\n\nfunction getItemTtsConfig(item = {}) {\n  if (item.lang === \"twi\") {\n    return {\n      ...DEFAULT_TWI_TTS,\n      voice: state.twiVoice,\n    };\n  }\n\n  return {\n    ...DEFAULT_ENGLISH_TTS,\n    voice: state.englishVoice,\n  };\n}\n\nfunction getIdleStatusText() {\n  return \"English + Twi TTS\";\n}\n\nfunction buildTtsUrl(text, item = {}) {\n  if (item.recordingMissing) {\n    return \"\";\n  }\n  if (item.audioSrc) {\n    return item.audioSrc;\n  }\n  const config = getItemTtsConfig(item);\n  const apiBase = String(globalThis.ECCR_TTS_API_BASE || \"\").replace(/\\/$/, \"\");\n  if (!apiBase) {\n    return \"\";\n  }\n  const params = new URLSearchParams({\n    text,\n    engine: config.engine,\n    voice: config.voice,\n    speed: String(config.speed),\n  });\n  return `${apiBase}/api/tts/audio?${params.toString()}`;\n}\n\nfunction getBook() {\n  return books.find((book) => book.id === state.bookId) || books[0];\n}\n\nfunction getPage() {\n  return getBook().pages[state.pageIndex];\n}\n\nfunction escapeHtml(value) {\n  return String(value)\n    .replace(/&/g, \"&amp;\")\n    .replace(/\u003c/g, \"&lt;\")\n    .replace(/>/g, \"&gt;\")\n    .replace(/\"/g, \"&quot;\")\n    .replace(/'/g, \"&#039;\");\n}\n", "url": "https://github.com/JiEunJanetSong/eccr-picture-audio-site/blob/3b87245/picturebook/app.js"}, "eccr-picture-audio-site/audio/app.js": {"text": "const DEFAULT_ENGLISH_TTS = {\n  engine: \"kokoro\",\n  voice: \"bm_fable\",\n  speed: 0.9,\n};\n\nconst DEFAULT_TWI_TTS = {\n  engine: \"mms-aka\",\n  voice: \"mms-aka\",\n  speed: 0.9,\n};\n\nconst ENGLISH_VOICES = [\n  { value: \"bm_fable\", label: \"Fable (UK)\" },\n  { value: \"bm_daniel\", label: \"Daniel (UK)\" },\n  { value: \"bf_emma\", label: \"Emma (UK)\" },\n  { value: \"af_heart\", label: \"Heart (US)\" },\n];\n\nconst TWI_VOICES = [{ value: \"mms-aka\", label: \"MMS Akan/Twi\" }];\n\nconst sourceBooks = Array.isArray(globalThis.ECCR_A4_BOOKS)\n  ? globalThis.ECCR_A4_BOOKS\n  : (Array.isArray(globalThis.YAW_PICTURE_BOOKS) ? globalThis.YAW_PICTURE_BOOKS : []);\nconst books = sourceBooks.slice().sort(compareBooks);\n\nconst state = {\n  bookId: books[0]?.id || \"\",\n  pageIndex: 0,\n  englishVoice: DEFAULT_ENGLISH_TTS.voice,\n  twiVoice: DEFAULT_TWI_TTS.voice,\n  audio: null,\n  playbackToken: 0,\n  sequenceToken: 0,\n};\n\nconst els = {};\n\ndocument.addEventListener(\"DOMContentLoaded\", init);\n\nfunction compareBooks(a, b) {\n  return getBookNumber(a) - getBookNumber(b);\n}\n\nfunction getBookNumber(book) {\n  const match = String(book?.id || book?.title || \"\").match(/(\\d+)/);\n  return match ? Number(match[1]) : Number.MAX_SAFE_INTEGER;\n}\n\nfunction init() {\n  Object.assign(els, {\n    bookSelect: document.getElementById(\"bookSelect\"),\n    englishVoiceSelect: document.getElementById(\"englishVoiceSelect\"),\n    twiVoiceSelect: document.getElementById(\"twiVoiceSelect\"),\n    statusPill: document.getElementById(\"statusPill\"),\n    pageList: document.getElementById(\"pageList\"),\n    pageTitle: document.getElementById(\"pageTitle\"),\n    pageMeta: document.getElementById(\"pageMeta\"),\n    audioList: document.getElementById(\"audioList\"),\n    playPageBtn: document.getElementById(\"playPageBtn\"),\n    ttsAudio: document.getElementById(\"ttsAudio\"),\n  });\n\n  state.audio = els.ttsAudio || new Audio();\n  renderBookOptions();\n  renderVoiceOptions();\n  bindEvents();\n  render();\n}\n\nfunction bindEvents() {\n  els.bookSelect.addEventListener(\"change\", () => {\n    state.bookId = els.bookSelect.value;\n    state.pageIndex = 0;\n    stopAudio();\n    render();\n  });\n\n  els.englishVoiceSelect.addEventListener(\"change\", () => {\n    state.englishVoice = els.englishVoiceSelect.value;\n    stopAudio();\n  });\n\n  els.twiVoiceSelect.addEventListener(\"change\", () => {\n    state.twiVoice = els.twiVoiceSelect.value;\n    stopAudio();\n  });\n\n  els.playPageBtn.addEventListener(\"click\", playCurrentPage);\n}\n\nfunction renderBookOptions() {\n  els.bookSelect.innerHTML = books\n    .map((book) => `\u003coption value=\"${escapeHtml(book.id)}\">${escapeHtml(book.title)}\u003c/option>`)\n    .join(\"\");\n  els.bookSelect.value = state.bookId;\n}\n\nfunction renderVoiceOptions() {\n  els.englishVoiceSelect.innerHTML = ENGLISH_VOICES\n    .map((voice) => `\u003coption value=\"${escapeHtml(voice.value)}\">${escapeHtml(voice.label)}\u003c/option>`)\n    .join(\"\");\n  els.englishVoiceSelect.value = state.englishVoice;\n\n  els.twiVoiceSelect.innerHTML = TWI_VOICES\n    .map((voice) => `\u003coption value=\"${escapeHtml(voice.value)}\">${escapeHtml(voice.label)}\u003c/option>`)\n    .join(\"\");\n  els.twiVoiceSelect.value = state.twiVoice;\n}\n\nfunction render() {\n  const book = getBook();\n  const page = getPage();\n  if (!book || !page) {\n    els.pageTitle.textContent = \"No books loaded\";\n    els.pageMeta.textContent = \"\";\n    els.audioList.innerHTML = \"\";\n    return;\n  }\n\n  els.pageTitle.textContent = page.title || `Page ${state.pageIndex + 1}`;\n  els.pageMeta.textContent = `${book.title} · ${state.pageIndex + 1} / ${book.pages.length}`;\n  renderPages(book);\n  renderAudioItems(page.audio || []);\n}\n\nfunction renderPages(book) {\n  els.pageList.innerHTML = book.pages\n    .map(\n      (page, index) => `\n        \u003cbutton class=\"page-btn${index === state.pageIndex ? \" active\" : \"\"}\" type=\"button\" data-page-index=\"${index}\">\n          ${index + 1}. ${escapeHtml(page.title || `Page ${index + 1}`)}\n        \u003c/button>\n      `\n    )\n    .join(\"\");\n\n  els.pageList.querySelectorAll(\"[data-page-index]\").forEach((button) => {\n    button.addEventListener(\"click\", () => {\n      state.pageIndex = Number(button.dataset.pageIndex);\n      stopAudio();\n      render();\n    });\n  });\n}\n\nfunction renderAudioItems(items) {\n  els.audioList.innerHTML = items\n    .map(\n      (item, index) => `\n        \u003carticle class=\"audio-item\">\n          \u003cspan class=\"lang\">${escapeHtml(item.lang || \"en\")}\u003c/span>\n          \u003cdiv>\n            \u003cdiv class=\"text\">${escapeHtml(cleanDisplayText(item.text || item.speechText || \"\"))}\u003c/div>\n            \u003cdiv class=\"speech\">${escapeHtml(item.speechText || item.text || \"\")}\u003c/div>\n          \u003c/div>\n          \u003cbutton class=\"play-btn\" type=\"button\" data-audio-index=\"${index}\">Listen\u003c/button>\n        \u003c/article>\n      `\n    )\n    .join(\"\");\n\n  els.audioList.querySelectorAll(\"[data-audio-index]\").forEach((button) => {\n    button.addEventListener(\"click\", () => {\n      const item = items[Number(button.dataset.audioIndex)];\n      playItem(item, button);\n    });\n  });\n}\n\nfunction cleanDisplayText(text) {\n  return String(text).replace(/^\\((.*)\\)$/, \"$1\");\n}\n\nfunction playCurrentPage() {\n  const items = (getPage()?.audio || []).filter((item) => item.speechText || item.text);\n  const token = ++state.sequenceToken;\n  playSequence(items, token);\n}\n\nasync function playSequence(items, token) {\n  for (const item of items) {\n    if (token !== state.sequenceToken) {\n      return;\n    }\n    await playItem(item);\n  }\n}\n\nfunction playItem(item, button) {\n  const token = ++state.playbackToken;\n  const text = item.speechText || item.text;\n  const url = buildTtsUrl(text, item);\n  if (!url) {\n    stopAudio();\n    els.statusPill.textContent = \"Audio coming soon\";\n    return Promise.resolve();\n  }\n  clearPlaying();\n  stopAudio(false);\n  button?.classList.add(\"playing\");\n  els.statusPill.textContent = item.audioSrc\n    ? \"Playing recording\"\n    : (item.lang === \"twi\" ? \"Playing Twi\" : \"Playing English\");\n\n  return new Promise((resolve) => {\n    state.audio.pause();\n    state.audio.src = url;\n    state.audio.defaultPlaybackRate = 1;\n    state.audio.playbackRate = 1;\n    state.audio.currentTime = 0;\n    state.audio.onended = () => {\n      finishPlayback(token, button);\n      resolve();\n    };\n    state.audio.onerror = () => {\n      finishPlayback(token, button);\n      els.statusPill.textContent = \"Audio error\";\n      resolve();\n    };\n    state.audio.play().catch(() => {\n      finishPlayback(token, button);\n      els.statusPill.textContent = \"Tap again\";\n      resolve();\n    });\n  });\n}\n\nfunction finishPlayback(token, button) {\n  if (token !== state.playbackToken) {\n    return;\n  }\n  button?.classList.remove(\"playing\");\n  els.statusPill.textContent = \"Ready\";\n}\n\nfunction stopAudio(invalidate = true) {\n  if (invalidate) {\n    state.playbackToken += 1;\n    state.sequenceToken += 1;\n  }\n  clearPlaying();\n  if (state.audio) {\n    state.audio.pause();\n    state.audio.removeAttribute(\"src\");\n    state.audio.load();\n  }\n  els.statusPill.textContent = \"Ready\";\n}\n\nfunction clearPlaying() {\n  els.audioList?.querySelectorAll(\".play-btn.playing\").forEach((button) => button.classList.remove(\"playing\"));\n}\n\nfunction getItemTtsConfig(item = {}) {\n  if (item.lang === \"twi\") {\n    return {\n      ...DEFAULT_TWI_TTS,\n      voice: state.twiVoice,\n    };\n  }\n\n  return {\n    ...DEFAULT_ENGLISH_TTS,\n    voice: state.englishVoice,\n  };\n}\n\nfunction buildTtsUrl(text, item = {}) {\n  if (item.recordingMissing) {\n    return \"\";\n  }\n  if (item.audioSrc) {\n    return `../picturebook/${item.audioSrc}`;\n  }\n  const config = getItemTtsConfig(item);\n  const apiBase = String(globalThis.ECCR_TTS_API_BASE || \"\").replace(/\\/$/, \"\");\n  if (!apiBase) {\n    return \"\";\n  }\n  const params = new URLSearchParams({\n    text,\n    engine: config.engine,\n    voice: config.voice,\n    speed: String(config.speed),\n  });\n  return `${apiBase}/api/tts/audio?${params.toString()}`;\n}\n\nfunction getBook() {\n  return books.find((book) => book.id === state.bookId) || books[0];\n}\n\nfunction getPage() {\n  return getBook()?.pages[state.pageIndex];\n}\n\nfunction escapeHtml(value) {\n  return String(value)\n    .replace(/&/g, \"&amp;\")\n    .replace(/\u003c/g, \"&lt;\")\n    .replace(/>/g, \"&gt;\")\n    .replace(/\"/g, \"&quot;\")\n    .replace(/'/g, \"&#039;\");\n}\n", "url": "https://github.com/JiEunJanetSong/eccr-picture-audio-site/blob/3b87245/audio/app.js"}, "eccr-picture-audio-site/scripts/generate-offline-assets.mjs": {"text": "import { readdir, writeFile } from \"node:fs/promises\";\nimport path from \"node:path\";\nimport { fileURLToPath } from \"node:url\";\n\nconst root = path.resolve(path.dirname(fileURLToPath(import.meta.url)), \"..\");\nconst assets = [\n  \"./\",\n  \"./audio/\",\n  \"./audio/app.js\",\n  \"./audio/index.html\",\n  \"./audio/style.css\",\n  \"./icons/icon.svg\",\n  \"./index.html\",\n  \"./manifest.webmanifest\",\n  \"./offline-assets.js\",\n  \"./picturebook/\",\n  \"./picturebook/a4_books.js\",\n  \"./picturebook/app.js\",\n  \"./picturebook/index.html\",\n  \"./picturebook/style.css\",\n  \"./pwa.js\",\n  \"./shared/config.js\",\n  \"./sw.js\",\n];\n\nasync function collectFiles(relativeDirectory) {\n  const absoluteDirectory = path.join(root, relativeDirectory);\n  const entries = await readdir(absoluteDirectory, { withFileTypes: true });\n  for (const entry of entries) {\n    const relativePath = path.join(relativeDirectory, entry.name);\n    if (entry.isDirectory()) {\n      await collectFiles(relativePath);\n    } else if (!entry.name.startsWith(\".\")) {\n      assets.push(`./${relativePath.split(path.sep).join(\"/\")}`);\n    }\n  }\n}\n\nawait collectFiles(\"picturebook/assets\");\nawait collectFiles(\"picturebook/audio\");\n\nconst contents = `self.ECCR_OFFLINE_ASSETS = ${JSON.stringify([...new Set(assets)].sort(), null, 2)};\\n`;\nawait writeFile(path.join(root, \"offline-assets.js\"), contents);\n", "url": "https://github.com/JiEunJanetSong/eccr-picture-audio-site/blob/3b87245/scripts/generate-offline-assets.mjs"}, "eccr-picture-audio-site/sw.js": {"text": "importScripts(\"./offline-assets.js\");\n\nconst CACHE_NAME = \"eccr-book45-audio-20260907-1\";\nconst CACHE_PREFIX = \"eccr-\";\nconst OFFLINE_ASSETS = self.ECCR_OFFLINE_ASSETS || [];\nconst CORE_ASSETS = OFFLINE_ASSETS.filter(\n  (asset) => !asset.includes(\"/assets/book\") && !asset.includes(\"/audio/book\")\n);\nconst CACHE_BATCH_SIZE = 4;\nlet offlineCacheJob = null;\n\nfunction toAbsoluteUrl(asset) {\n  return new URL(asset, self.registration.scope).href;\n}\n\nasync function cacheAsset(cache, asset) {\n  const request = new Request(toAbsoluteUrl(asset), {\n    cache: \"reload\",\n    credentials: \"same-origin\",\n  });\n  const response = await fetch(request);\n  if (!response.ok) {\n    throw new Error(`Could not cache ${asset}: ${response.status}`);\n  }\n  await cache.put(request, response);\n}\n\nasync function cacheCoreAssets() {\n  const cache = await caches.open(CACHE_NAME);\n  await Promise.allSettled(CORE_ASSETS.map((asset) => cacheAsset(cache, asset)));\n}\n\nasync function getOfflineStatus() {\n  const cache = await caches.open(CACHE_NAME);\n  const matches = await Promise.all(\n    OFFLINE_ASSETS.map((asset) => cache.match(toAbsoluteUrl(asset), { ignoreSearch: true }))\n  );\n  return {\n    complete: matches.filter(Boolean).length,\n    total: OFFLINE_ASSETS.length,\n  };\n}\n\nasync function broadcast(message) {\n  const clients = await self.clients.matchAll({ type: \"window\", includeUncontrolled: true });\n  clients.forEach((client) => client.postMessage(message));\n}\n\nasync function cacheAllOfflineAssets() {\n  const cache = await caches.open(CACHE_NAME);\n  const missingAssets = [];\n\n  for (const asset of OFFLINE_ASSETS) {\n    const cached = await cache.match(toAbsoluteUrl(asset), { ignoreSearch: true });\n    if (!cached) {\n      missingAssets.push(asset);\n    }\n  }\n\n  let complete = OFFLINE_ASSETS.length - missingAssets.length;\n  let failed = 0;\n  await broadcast({ type: \"OFFLINE_PROGRESS\", complete, total: OFFLINE_ASSETS.length });\n\n  for (let index = 0; index \u003c missingAssets.length; index += CACHE_BATCH_SIZE) {\n    const batch = missingAssets.slice(index, index + CACHE_BATCH_SIZE);\n    const results = await Promise.allSettled(batch.map((asset) => cacheAsset(cache, asset)));\n    complete += results.filter((result) => result.status === \"fulfilled\").length;\n    failed += results.filter((result) => result.status === \"rejected\").length;\n    await broadcast({ type: \"OFFLINE_PROGRESS\", complete, total: OFFLINE_ASSETS.length });\n  }\n\n  if (failed === 0 && complete === OFFLINE_ASSETS.length) {\n    await broadcast({ type: \"OFFLINE_READY\", complete, total: OFFLINE_ASSETS.length });\n  } else {\n    await broadcast({ type: \"OFFLINE_ERROR\", complete, total: OFFLINE_ASSETS.length, failed });\n  }\n}\n\nself.addEventListener(\"install\", (event) => {\n  event.waitUntil(\n    cacheCoreAssets()\n      .then(() => cacheAllOfflineAssets())\n      .then(() => self.skipWaiting())\n  );\n});\n\nself.addEventListener(\"activate\", (event) => {\n  event.waitUntil(\n    caches\n      .keys()\n      .then((keys) =>\n        Promise.all(\n          keys.filter((key) => key.startsWith(CACHE_PREFIX) && key !== CACHE_NAME).map((key) => caches.delete(key))\n        )\n      )\n      .then(() => self.clients.claim())\n  );\n});\n\nself.addEventListener(\"message\", (event) => {\n  if (event.data?.type === \"CHECK_OFFLINE_STATUS\") {\n    event.waitUntil(\n      getOfflineStatus().then((status) => broadcast({ type: \"OFFLINE_STATUS\", ...status }))\n    );\n  }\n\n  if (event.data?.type === \"CACHE_ALL_OFFLINE_ASSETS\") {\n    if (!offlineCacheJob) {\n      offlineCacheJob = cacheAllOfflineAssets().finally(() => {\n        offlineCacheJob = null;\n      });\n    }\n    event.waitUntil(offlineCacheJob);\n  }\n});\n\nasync function createRangeResponse(request, cachedResponse) {\n  const range = request.headers.get(\"range\");\n  if (!range) {\n    return cachedResponse;\n  }\n\n  const blob = await cachedResponse.blob();\n  const match = /^bytes=(\\d*)-(\\d*)$/i.exec(range.trim());\n  if (!match) {\n    return cachedResponse;\n  }\n\n  const startText = match[1];\n  const endText = match[2];\n  let start;\n  let end;\n\n  if (!startText && endText) {\n    const suffixLength = Number(endText);\n    start = Math.max(0, blob.size - suffixLength);\n    end = blob.size - 1;\n  } else {\n    start = Number(startText || 0);\n    end = endText ? Math.min(Number(endText), blob.size - 1) : blob.size - 1;\n  }\n\n  if (!Number.isFinite(start) || !Number.isFinite(end) || start > end || start >= blob.size) {\n    return new Response(null, {\n      status: 416,\n      headers: { \"Content-Range\": `bytes */${blob.size}` },\n    });\n  }\n\n  const body = blob.slice(start, end + 1);\n  return new Response(body, {\n    status: 206,\n    statusText: \"Partial Content\",\n    headers: {\n      \"Accept-Ranges\": \"bytes\",\n      \"Content-Length\": String(body.size),\n      \"Content-Range\": `bytes ${start}-${end}/${blob.size}`,\n      \"Content-Type\": cachedResponse.headers.get(\"Content-Type\") || blob.type || \"application/octet-stream\",\n    },\n  });\n}\n\nself.addEventListener(\"fetch\", (event) => {\n  if (event.request.method !== \"GET\") {\n    return;\n  }\n\n  const requestUrl = new URL(event.request.url);\n  if (requestUrl.origin !== self.location.origin) {\n    return;\n  }\n\n  event.respondWith(\n    (async () => {\n      const cache = await caches.open(CACHE_NAME);\n      const cached = await cache.match(event.request, { ignoreSearch: true });\n      if (cached) {\n        return createRangeResponse(event.request, cached);\n      }\n\n      try {\n        const response = await fetch(event.request);\n        if (response.status === 200 && !event.request.headers.has(\"range\")) {\n          await cache.put(event.request, response.clone());\n        }\n        return response;\n      } catch (error) {\n        if (event.request.mode === \"navigate\") {\n          const fallback =\n            (await cache.match(toAbsoluteUrl(\"./picturebook/index.html\"), { ignoreSearch: true })) ||\n            (await cache.match(toAbsoluteUrl(\"./index.html\"), { ignoreSearch: true }));\n          if (fallback) {\n            return fallback;\n          }\n        }\n        throw error;\n      }\n    })()\n  );\n});\n", "url": "https://github.com/JiEunJanetSong/eccr-picture-audio-site/blob/3b87245/sw.js"}, "eccr-picture-audio-site/package.json": {"text": "{\n  \"name\": \"eccr-picture-audio-site\",\n  \"version\": \"1.0.0\",\n  \"private\": true,\n  \"scripts\": {\n    \"build:offline\": \"node scripts/generate-offline-assets.mjs\",\n    \"check\": \"node --check picturebook/a4_books.js && node --check picturebook/app.js && node --check audio/app.js && node --check pwa.js && node --check sw.js && node --check offline-assets.js\",\n    \"serve\": \"python3 -m http.server 4173\"\n  }\n}\n", "url": "https://github.com/JiEunJanetSong/eccr-picture-audio-site/blob/3b87245/package.json"}, "eccr-picture-audio-site/.github/workflows/pages.yml": {"text": "name: Deploy static ECCR app to GitHub Pages\n\non:\n  push:\n    branches:\n      - main\n  workflow_dispatch:\n\npermissions:\n  contents: read\n  pages: write\n  id-token: write\n\nconcurrency:\n  group: pages\n  cancel-in-progress: false\n\njobs:\n  deploy:\n    environment:\n      name: github-pages\n      url: ${{ steps.deployment.outputs.page_url }}\n    runs-on: ubuntu-latest\n    steps:\n      - name: Checkout\n        uses: actions/checkout@v4\n      - name: Setup Pages\n        uses: actions/configure-pages@v5\n      - name: Upload artifact\n        uses: actions/upload-pages-artifact@v3\n        with:\n          path: .\n      - name: Deploy to GitHub Pages\n        id: deployment\n        uses: actions/deploy-pages@v4\n", "url": "https://github.com/JiEunJanetSong/eccr-picture-audio-site/blob/3b87245/.github/workflows/pages.yml"}}, "history": {"messages": [{"id": "w28", "stage": "origin", "kind": "human", "role": "yaw", "date": "5/11/26", "time": "18:42:38", "summary": {"en": "Yaw had already written a teacher guide and workbook in 2022, but lacked support to publish them.", "ko": "야우는 이미 2022년에 교사용 지도서와 워크북을 썼지만 출판 지원이 부족했습니다."}, "original": "Yes. I can prepare a lot by hand myself. I even prepared a teacher guide with its accompanying workbook in 2022, but I couldn’t publish or go further with it. It’s in one of my boxes. The assistance has been the major challenge.\n\nI have taught since 2007. I have been part of various interventions to see our learners read. I have trained some teachers even outside my district.", "source": "_chat.txt · L32 · message 28", "sourceType": "WhatsApp", "label": {"en": "Original conversation", "ko": "실제 대화"}}, {"id": "w113", "stage": "origin", "kind": "human", "role": "yaw", "date": "5/12/26", "time": "19:15:22", "summary": {"en": "Mother-tongue reading needs age-appropriate, levelled materials. Yaw proposes refining his existing manuscript together.", "ko": "모국어로 읽기를 시작할 수 있는 수준별 자료가 필요했습니다. 야우는 기존 원고를 함께 다듬자고 제안했습니다."}, "original": "Thank you, Janet. I truly appreciate your thoughtful message.\n\nI believe this collaboration brings together two important strengths — your research and publishing experience, and my field experience in foundational literacy.\n\nAbout the manuscript:The work I have developed focuses on how children learn to read effectively in our context. A key part of this is the role of mother tongue instruction, especially at the early stages.\n\nFrom my experience, one major challenge is the lack of age-appropriate and levelled reading materials in local languages such as Twi. Most available books are either too advanced, too bulky, or not designed for beginners. As a result, many learners do not get the gradual reading progression they need.\n\nI have already developed substantial handwritten content, including a teacher guide and supporting materials. However, the work is not yet in its final form, and I would prefer that we refine and structure it together so that it meets both classroom needs and wider publication standards.\n\nAbout teacher study groups:Yes, it is possible to organize teacher study groups, and this is something I am very interested in.\n\nThese sessions can focus on practical areas such as:\n\nhow children move from sounds to reading\n\nhow to use mother tongue effectively in early reading\n\nhow to support learners who struggle to read\n\nImportantly, these study groups can also serve as a way to test ideas from the manuscript in real classrooms, allowing us to build something that is both practical and evidence-based.\n\nI believe this gives us a strong starting point for our collaboration.\n\nI am happy to begin with whichever area you think is most practical to start.\n\nLooking forward to your thoughts.\n\n\n\nThese images are really complimenting the foundational work. It’s beautiful. When instructions in books are colourful, children love them. Thank you for sharing.", "source": "_chat.txt · L158 · message 113", "sourceType": "WhatsApp", "label": {"en": "Original conversation", "ko": "실제 대화"}}, {"id": "w118", "stage": "origin", "kind": "human", "role": "janet", "date": "5/12/26", "time": "21:14:14", "summary": {"en": "Janet proposes using AI with Ghanaian teachers to develop and translate reading materials.", "ko": "Janet은 가나 교사들이 번역의 의미와 뉘앙스를 검토하며 AI를 활용하자고 제안했습니다."}, "original": "If we need to translate English reading books into Twi, we can leverage AI to streamline the process. I believe that if teachers are directly involved in the translation and capturing the right nuances, it will provide a strong justification for training Ghanaian teachers and expanding this project in the future.\nI suggest that we jointly lead a study with the teachers on the process of using AI for Twi translation, while also collaborating on the process of compiling and publishing the books.\nI would love to hear your thoughts and any additional ideas you might have.", "source": "_chat.txt · L201 · message 118", "sourceType": "WhatsApp", "label": {"en": "Original conversation", "ko": "실제 대화"}}, {"id": "w134", "stage": "origin", "kind": "human", "role": "yaw", "date": "5/12/26", "time": "23:26:32", "summary": {"en": "Yaw points out that imported stories often feel foreign; the setting should connect with local life.", "ko": "야우는 외국 책의 배경이 아이들의 삶과 동떨어져 있어 지역 맥락이 중요하다고 짚었습니다."}, "original": "Thank you. Ghana Book Trust was once distributing books to some selected schools in some districts. What we saw as a challenge was that, the setting of the stories were foreign. If only we could relate to our locality, it’s great. What do you think?", "source": "_chat.txt · L223 · message 134", "sourceType": "WhatsApp", "label": {"en": "Original conversation", "ko": "실제 대화"}}, {"id": "w153", "stage": "origin", "kind": "human", "role": "yaw", "date": "5/13/26", "time": "01:17:15", "summary": {"en": "Begin with short Twi combinations such as “Fa bi na kɔ.” and “Yi bi di.”", "ko": "“Fa bi na kɔ.”, “Yi bi di.”처럼 짧은 Twi 낱말을 연결하며 읽기를 시작합니다."}, "original": "When learners learn sounds in the Asante Twi, we begin blending with two letter words sentences, for example:\n\n1. Fa bi na kɔ.\n2. ⁠Yi bi di.\n3. ⁠Sa bi we.\n4. ⁠Tu bi gu.\n5. ⁠Ma me bi.", "source": "_chat.txt · L360 · message 153", "sourceType": "WhatsApp", "label": {"en": "Original conversation", "ko": "실제 대화"}}, {"id": "w159", "stage": "origin", "kind": "human", "role": "janet", "date": "5/13/26", "time": "01:39:33", "summary": {"en": "Janet shares an actual image prompt: put two Twi sentences on each page with a matching image.", "ko": "Janet이 실제 이미지 프롬프트를 공유했습니다. 페이지마다 Twi 두 문장과 대응 그림을 넣는 요청입니다."}, "original": "The following text is written in Asante Twi from Ghana. Please put two sentences on each page and generate a corresponding image for them.", "source": "_chat.txt · L429 · message 159", "sourceType": "WhatsApp", "label": {"en": "Original conversation", "ko": "실제 대화"}}, {"id": "w161", "stage": "origin", "kind": "human", "role": "janet", "date": "5/13/26", "time": "01:42:40", "summary": {"en": "Janet explains that she used Gemini 3 Flash with the image setting. This is her report in the chat.", "ko": "Janet은 Gemini 3 Flash의 이미지 설정으로 응답을 받았다고 대화에서 설명했습니다."}, "original": "I put that into Gemini 3 Flash and got a response. I also changed the tool settings to 'image.' By the way, weren't all the images on your Facebook generated with Gemini?", "source": "_chat.txt · L431 · message 161", "sourceType": "WhatsApp", "label": {"en": "Original conversation", "ko": "실제 대화"}}, {"id": "w165", "stage": "origin", "kind": "human", "role": "yaw", "date": "5/13/26", "time": "01:49:15", "summary": {"en": "Yaw identifies a concrete failure: generated images did not render ɔ and ɛ correctly.", "ko": "야우가 AI 이미지에서 ɔ, ɛ 문자가 제대로 표현되지 않는 문제를 발견했습니다."}, "original": "I once tried ChatGPT on Twi sentence. It couldn’t render the ɔ and ɛ characters.", "source": "_chat.txt · L437 · message 165", "sourceType": "WhatsApp", "label": {"en": "Original conversation", "ko": "실제 대화"}}, {"id": "w242", "stage": "origin", "kind": "human", "role": "yaw", "date": "5/16/26", "time": "19:21:40", "summary": {"en": "They narrow the pilot to one Basic 1 classroom in Yaw’s school, to monitor and refine the materials closely.", "ko": "면밀한 관찰과 개선을 위해 야우 학교의 Basic 1 한 학급으로 파일럿 범위를 좁혔습니다."}, "original": "Janet, thank you once again for your thoughtful message. I truly appreciate the direction you are proposing.\n\nI fully agree with starting on a much smaller scale, and I believe the most practical approach will be to run the pilot in a Basic 1 classroom within my school. This will allow for close monitoring, consistency, and meaningful refinement of both the materials and the teaching approach.\n\nSince the focus is on a BS1 class, I also think it will be important for us to develop a simple but clear teacher’s guide alongside the reading materials. This will provide structured guidance on how each lesson should be delivered, ensuring that the materials are used effectively and consistently during the pilot.\n\nOn material development, I will proceed with preparing a small set of leveled reading materials (2–3 sets) built around similar themes but with varying levels of difficulty. These can then be refined together with your input before implementation.\n\nI also strongly agree that even for a small pilot, teacher orientation will be necessary. The effectiveness of the materials will depend largely on how they are used in the classroom, so this will be an important part of our preparation.\n\nI appreciate your willingness to support with editing and AI-driven material development, as well as your intention to transfer that knowledge. This aligns very well with my long-term goal of building teacher capacity and creating a system where teachers can independently develop and adapt their own materials.\n\nAdditionally, I recognize your strong background in mathematics education at the JHS and higher levels, and I believe this creates an excellent opportunity for future collaboration within our district. Many of our JHS teachers would greatly benefit from such support, and this could become a valuable extension of our work after the literacy pilot is well established.\n\nIn terms of next steps, I will share the materials we have developed so far so we can begin refining them together and prepare for the pilot.\n\nThank you once again for your support and vision. I look forward to working closely with you on this.", "source": "_chat.txt · L1012 · message 272", "sourceType": "WhatsApp", "label": {"en": "Original conversation", "ko": "실제 대화"}}, {"id": "w246", "stage": "origin", "kind": "human", "role": "yaw", "date": "5/19/26", "time": "04:09:48", "summary": {"en": "Yaw develops the Teacher’s Guide and ECCR 3-Day Model: read and write in every lesson, with an L1-to-English direction.", "ko": "야우는 매 수업 읽기·쓰기와 모국어에서 영어로의 연결을 담은 지도서 및 ECCR 3일 모형을 개발했습니다."}, "original": "Hello Janet,\n\nI hope you are doing well.\n\nI wanted to give you a brief update on the literacy project. Over the past two days, I have been working deeply on the structure of the ECCR Teacher’s Guide before moving into full content production. I felt it was important to first build a strong instructional framework so that the storybooks and teaching materials will align properly later.\n\nSo far, I have developed:\n- the overall guide structure,\n- the ECCR instructional philosophy,\n- the 3-day literacy model,\n- the “read and write in every lesson” approach,\n- L1-to-English transition direction,\n- and the core literacy components for the guide.\n\nI have also started drafting the opening sections of the Teacher’s Guide.\n\nI now clearly see the Teacher’s Guide and the “Read and Rise” storybooks as two connected but separate components. I believe your support later with the storybook page design, font structure, layout, and overall readability will be extremely valuable.\n\nThe direction is becoming very exciting and much more structured.\n\nI will continue working on the draft and share more progress with you soon.", "source": "_chat.txt · L1036 · message 276", "sourceType": "WhatsApp", "label": {"en": "Original conversation", "ko": "실제 대화"}}, {"id": "full-189", "stage": "coauthor", "kind": "human", "role": "janet", "date": "5/13/26", "time": "02:32:11", "summary": {"en": "Janet says she used ChatGPT and offers to share the process, with teacher training or a study group as a possible next step.", "ko": "Janet은 ChatGPT로 제작했다고 설명하고, 제작 방법 공유와 향후 교사 연수·연구 모임을 제안합니다."}, "original": "I actually made this using ChatGPT. I'm sure you’ll be able to create stories and add illustrations yourself, too. If it feels like too much to handle alone, we can always turn this into a teacher training program or a study group with other teachers, so just let me know anytime. You are an amazing teacher who will change the future of Ghana.", "source": "_chat.txt · L464 · message 189", "sourceType": "WhatsApp", "label": {"en": "WhatsApp conversation", "ko": "WhatsApp 대화"}}, {"id": "full-191", "stage": "coauthor", "kind": "human", "role": "yaw", "date": "5/13/26", "time": "02:40:49", "summary": {"en": "Yaw asks to learn the process: he has ideas, but the tools do not always produce what he intends.", "ko": "야우는 아이디어가 있어도 도구가 의도대로 구현하지 못한다며 제작 과정을 가르쳐 달라고 요청합니다."}, "original": "You will have to educate me on the process. I am ready to learn. Sometimes I get the idea but the tools don’t seem to get it as I want. \nTeach me the way, please.", "source": "_chat.txt · L466 · message 191", "sourceType": "WhatsApp", "label": {"en": "WhatsApp conversation", "ko": "WhatsApp 대화"}}, {"id": "full-192", "stage": "coauthor", "kind": "human", "role": "janet", "date": "5/13/26", "time": "02:45:45", "summary": {"en": "Janet shares the actual prompt: supply the precise Asante Twi text, generate corresponding images, and export a PDF. The full message includes the manuscript and corrections.", "ko": "Janet이 실제 프롬프트를 공유합니다. 정확한 Asante Twi 원문을 제공하고, 내용에 맞는 그림 생성과 PDF 출력을 요청합니다. 원문에는 원고와 수정 문구도 담겨 있습니다."}, "original": "I will provide the precise Asante Twi text. Please generate a corresponding image based on this content and then export the final result as a PDF file.\n\n```Da Pa Wɔ Yɛn Kurom\n\n    Basic 1 Asante Twi Akenkan Nwoma\n\n    Anɔpa aba.\n    Owia apue.\n\n    Ama ne Kofi asɔre.\n    Wɔka sɛ, “Maakye, Maame.”\n\n    Maame ka sɛ,\n    “Yaa, me mma.”\n\n    Wɔpra fie anim.\n    Fie ho tew. (Fie no ho ayɛ fɛ)\n\n    Wɔhohoro wɔn nsa.\n    Wɔnom nsuo.\n\n    Wɔdi banku\n  ne nkruma frɔe. (frɔeɛ)\n\n    Wɔfa wɔn nwoma.\n    Wɔkɔ sukuu.\n\n    Kwan so, wɔkyea Nana.\n    Wɔka sɛ, “Maakye, Nana.”\n\n    a e ɛ i o ɔ u\n\n    Sukuu mu,\n    wɔkenkan nnyegyeɛ.\n\n    Ama\n\n    Ama twerɛ ne din.\n    Ne din de Ama.\n\n    Ahomegye berɛ mu,\n    wɔkyɛ borɔde. (borɔdeɛ)\n\n    Akyiri yi,\n    wɔboa wɔ dwa so.\n\n    Anwummerɛ, abusua no\n    te ase. (…, abusua no hyia)\n    Nana ka anansesɛm. (Nana to anansesɛm)\n\n    Ama ne Kofi sere.\n    Wɔka sɛ, “Yɛda ase.” (“Yɛda wo ase.”)\n\n    Nsɛmmisa\n\n    1. Hwan na ɔkɔɔ sukuu?\n    2. Dɛn na Ama kenkan? (Deɛn na…)\n    3. Hwan na ɔkaa anansesɛm? (Hwan na ɔtoo anansesɛm no?)\n\n    Kenkan bio.```", "source": "_chat.txt · L468 · message 192", "sourceType": "WhatsApp", "label": {"en": "WhatsApp conversation", "ko": "WhatsApp 대화"}}, {"id": "full-195", "stage": "coauthor", "kind": "human", "role": "yaw", "date": "5/13/26", "time": "02:51:45", "summary": {"en": "Yaw responds that he will try the shared prompt himself.", "ko": "야우가 공유받은 프롬프트를 직접 시도해 보겠다고 답합니다."}, "original": "Ok. Let me try that.", "source": "_chat.txt · L530 · message 195", "sourceType": "WhatsApp", "label": {"en": "WhatsApp conversation", "ko": "WhatsApp 대화"}}, {"id": "full-197", "stage": "coauthor", "kind": "human", "role": "janet", "date": "5/13/26", "time": "03:14:59", "summary": {"en": "Janet shares “Yaw_Janet_16pages_times_new_roman.pdf” as a 16-page PDF. This export records the attachment name, but omits the file.", "ko": "Janet이 16쪽 PDF “Yaw_Janet_16pages_times_new_roman.pdf”를 공유합니다. 내보낸 대화에는 첨부 이름과 쪽수만 남아 있습니다."}, "original": "Yaw_Janet_16pages_times_new_roman.pdf • ‎16 페이지 ‎문서 생략됨", "source": "_chat.txt · L532 · message 197", "sourceType": "WhatsApp", "label": {"en": "WhatsApp conversation", "ko": "WhatsApp 대화"}}, {"id": "full-198", "stage": "coauthor", "kind": "human", "role": "janet", "date": "5/13/26", "time": "03:20:53", "summary": {"en": "Janet proposes making stories for Basic 1 together: Yaw can write the stories and she can handle the illustrations.", "ko": "Janet은 Basic 1용 이야기를 함께 만들자며 야우가 이야기를 쓰고 자신이 삽화를 맡는 협업 방식을 제안합니다."}, "original": "Why don't we create a few stories right away and apply them to the BS1 students? If preparing them alongside phonics feels like too much work, let's do it together. You could write the stories, and I can handle the illustrations—or whichever way works best. Either way, let’s try our best to get the materials you’ve made into the students' hands as soon as possible.", "source": "_chat.txt · L533 · message 198", "sourceType": "WhatsApp", "label": {"en": "WhatsApp conversation", "ko": "WhatsApp 대화"}}, {"id": "full-203", "stage": "coauthor", "kind": "human", "role": "yaw", "date": "5/13/26", "time": "03:31:31", "summary": {"en": "Yaw agrees to write the stories.", "ko": "야우가 이야기를 쓰겠다고 답합니다."}, "original": "It’s a beautiful idea. I will write the stories.", "source": "_chat.txt · L538 · message 203", "sourceType": "WhatsApp", "label": {"en": "WhatsApp conversation", "ko": "WhatsApp 대화"}}, {"id": "full-206", "stage": "coauthor", "kind": "human", "role": "yaw", "date": "5/13/26", "time": "10:16:12", "summary": {"en": "Yaw supplies a detailed production brief for “Ma Yɛnsua Akenkan”: one sentence per portrait page, picture above text, Ghanaian settings, consistent characters, two- to five-word sentences, a Papa Musa story, and three levels of comprehension questions.", "ko": "야우가 “Ma Yɛnsua Akenkan” 제작 지침을 보냅니다. 세로 페이지마다 한 문장, 그림 위·글 아래, 가나 배경과 일관된 인물, 2–5단어 문장, Papa Musa 이야기, 세 수준의 이해 질문을 명시합니다."}, "original": "PROJECT: MA YƐNSUA AKENKAN (Basic 1 Twi Reader)\n\nHi Janet,\n\nThank you for your continued support. Below is the final structure and instructions for the Twi reader. Please follow this for image generation and layout.\n\n--------------------------------------------------\n\nGENERAL INSTRUCTIONS\n\n• One sentence per page  \n• Portrait layout  \n• Image at the top, text at the bottom  \n• Use large, bold, clear Twi text  \n• Keep images simple and uncluttered  \n• Focus on one clear action per page  \n• Use Ghanaian settings (home, village, school, market)  \n• Maintain character consistency throughout the story section: Papa Musa, Ali, and Alima  \n\n--------------------------------------------------\n\nSET 1 — 2-WORD SENTENCES (BEGINNER)\n\nPage 1: Fa bi  \nImage: Child taking some food from a bowl  \n\nPage 2: Ka bi  \nImage: Child biting food  \n\nPage 3: Di bi  \nImage: Child eating  \n\nPage 4: Sa fa  \nImage: Child scooping gari/milo and taking  \n\nPage 5: Tu kɔ  \nImage: Child uprooting something and moving away  \n\nPage 6: Kɔ da  \nImage: Child going to bed  \n\n--------------------------------------------------\n\nSET 2 — 3-WORD SENTENCES\n\nPage 7: Yi bi di  \nImage: Child taking food and eating  \n\nPage 8: Sa bi we  \nImage: Child scooping gari/milo/nido and chewing  \n\nPage 9: Ka bi fa  \nImage: Child biting food and holding it  \n\nPage 10: Ma me bi  \nImage: Child asking for something (hand extended)  \n\nPage 11: Te me so  \nImage: Market scene — child asking seller to reduce price  \n\nPage 12: Ka bi we  \nImage: Child chewing food  \n\n--------------------------------------------------\n\nSET 3 — 4–5 WORD SENTENCES\n\nPage 13: Fa bi si me so  \nImage: Cooking scene (pot on fire)  \n\nPage 14: Sa bi gu me ho  \nImage: Washing hands (water being poured)  \n\nPage 15: To bi gu me ho  \nImage: Bathing (pouring water from bucket onto body)  \n\nPage 16: Yi bi ma me  \nImage: Giving something  \n\nPage 17: To bi ma yɛn  \nImage: Child on mango tree throwing mangoes to others  \n\nPage 18: Ka bi na fa  \nImage: Child biting food and walking away  \n\n--------------------------------------------------\n\nSTORY SECTION\n\nPage 19 (Title): Papa Musa  \nImage: Father in a village compound with animals  \n\nPage 20: Papa Musa wɔ nkokɔ mmienu, mpɔnkye mmienu ne mma baanu.  \nImage: Clearly show:\n- 2 chickens  \n- 2 goats  \n- 2 children  \n(This is important for teaching counting: mmienu for animals, baanu for people)\n\nPage 21: Ne ba barima ne Ali.  \nImage: Boy (Ali)  \n\nPage 22: Ne ba baa ne Alima.  \nImage: Girl (Alima)  \n\nPage 23: Anɔpa biara, Ali pra mmoa no buo no mu.  \nImage: Cleaning animal pen  \n\nPage 24: Ɔma mmoa no aduane di.  \nImage: Feeding animals  \n\nPage 25: Anɔpa biara, Alima pra adihɔ.  \nImage: Sweeping compound  \n\nPage 26: Ɔma mmoa no nsuo nom.  \nImage: Giving water to animals  \n\nPage 27: Wɔyɛ ntɛm kɔ sukuu.  \nImage: Children going to school  \n\n--------------------------------------------------\n\nCOMPREHENSION PAGE\n\nLEVEL 1 — Recall  \n1. Hwan ne Ali?  \n2. Nkokɔ sɛn na Papa Musa wɔ?  \n\nLEVEL 2 — Understanding  \n3. Adwuma bɛn na Ali yɛ no anɔpa?  \n4. Adwuma bɛn na Alima yɛ no anɔpa?  \n\nLEVEL 3 — Thinking  \n5. Adɛn nti na wɔboa mmoa no?  \n6. Wo nso, deɛn na woyɛ ansa na wakɔ sukuu?  \n\nFinal line: Kenkan bio.\n\n--------------------------------------------------\n\nPlease feel free to suggest layout improvements, but kindly keep the instructional clarity and simplicity as the priority.\n\nThank you, and I look forward to seeing the first draft.\n\nYaw", "source": "_chat.txt · L541 · message 206", "sourceType": "WhatsApp", "label": {"en": "WhatsApp conversation", "ko": "WhatsApp 대화"}}, {"id": "full-208", "stage": "coauthor", "kind": "human", "role": "janet", "date": "5/13/26", "time": "11:40:01", "summary": {"en": "Janet shares “book2.pdf” as a 28-page PDF after Yaw’s production brief. The attachment itself is omitted from the chat export.", "ko": "야우의 제작 지침 이후 Janet이 28쪽 “book2.pdf”를 공유합니다. 대화 내보내기에는 첨부 파일 자체가 포함되어 있지 않습니다."}, "original": "book2.pdf • ‎28 페이지 ‎문서 생략됨", "source": "_chat.txt · L687 · message 208", "sourceType": "WhatsApp", "label": {"en": "WhatsApp conversation", "ko": "WhatsApp 대화"}}, {"id": "full-211", "stage": "coauthor", "kind": "human", "role": "yaw", "date": "5/13/26", "time": "14:50:49", "summary": {"en": "Yaw proposes a phased classroom pilot: observe learners and teachers, refine the materials, then expand, supported by teacher orientation.", "ko": "야우는 학습자 반응과 교사 사용을 관찰하고 자료를 개선한 뒤 확대하는 단계적 시범 운영과 교사 오리엔테이션을 제안합니다."}, "original": "That’s a very important question, Janet. I’m really excited about where this is going. 🙏🏾\n\nIn our context, I would recommend we introduce it in phases rather than all at once.\n\nWe can begin with a small pilot in a few Basic 1 classrooms, possibly within one circuit. This will allow us to observe how learners respond, how teachers use the material, and identify any areas for improvement.\n\nAfter that, we can refine the book based on real classroom experience before expanding to more schools.\n\nIn terms of timing, the best entry point would be at the beginning of a term, when teachers are introducing reading foundations. However, we can also start a pilot immediately with willing teachers to gather early feedback.\n\nI also think it would be powerful to introduce it through a short teacher orientation or study group, so teachers understand how to use it effectively.\n\nWhat do you think about starting with a pilot phase first? 🙂\nHow could we make it accessible to the schools? I am thinking of printing them for the pilot if you recommend that.", "source": "_chat.txt · L690 · message 211", "sourceType": "WhatsApp", "label": {"en": "WhatsApp conversation", "ko": "WhatsApp 대화"}}, {"id": "full-212", "stage": "coauthor", "kind": "human", "role": "janet", "date": "5/13/26", "time": "15:16:05", "summary": {"en": "Janet agrees to small-scale iterative development and proposes 12 May 2026 as the formal start date of their joint courseware development.", "ko": "Janet은 작은 규모에서 수정·보완하는 방식에 동의하고, 2026년 5월 12일을 공동 교재 개발의 공식 시작일로 정하자고 제안합니다."}, "original": "I completely agree with the phased approach. Starting small and refining our joint literacy courseware into a complete resource through adjustments and improvements is exactly the method I prefer to follow.\nRegarding the timing, please let me know when you think the most appropriate entry point would be, and I will take that into account.\nAs for the collaboration, let’s consider that you and I officially began the joint development of this literacy courseware as of May 12, 2026. While we continue building this AI-powered courseware together, please share your thoughts on when you feel it is the right time to invite other teachers to join the process.", "source": "_chat.txt · L704 · message 212", "sourceType": "WhatsApp", "label": {"en": "WhatsApp conversation", "ko": "WhatsApp 대화"}}, {"id": "full-215", "stage": "coauthor", "kind": "human", "role": "yaw", "date": "5/13/26", "time": "16:25:38", "summary": {"en": "Yaw identifies September as a suitable new-term entry point, suggests earlier small trials, and plans to check local printing options.", "ko": "야우는 새 학기가 시작되는 9월을 도입 시점으로 제안하고, 그 전 소규모 시험 적용과 현지 인쇄 방법 확인을 계획합니다."}, "original": "Thank you, Janet. I’m really encouraged by how aligned we are on this approach.\n\nFor the timing, I believe the best entry point would be at the beginning of a new term, when teachers are introducing reading foundations. Mostly, it is September. That will allow the material to be used intentionally from the start.\n\nHowever, we can begin a small pilot immediately with a few selected teachers to gather early feedback while we prepare for a wider rollout. I will discuss with my teachers this afternoon at the PLC.\n\nRegarding when to invite other teachers, I suggest we do that after the pilot phase, once we have refined the materials based on real classroom use. That way, what we share will be practical and proven.\n\nOn the printing, I will check with local printers here and get you an estimate for producing the pilot materials. I will consider options for cost, durability, and child-friendly quality, since these are early grade readers.\n\nI will share the details with you once I have them so we can plan the next steps together.\n\nThank you.", "source": "_chat.txt · L709 · message 215", "sourceType": "WhatsApp", "label": {"en": "WhatsApp conversation", "ko": "WhatsApp 대화"}}, {"id": "w188", "stage": "readers", "kind": "human", "role": "yaw", "date": "5/14/26", "time": "00:44:14", "summary": {"en": "Yaw supplies the Twi story “Aku ne Ɔkra” with English meanings and comprehension questions.", "ko": "야우가 “Aku ne Ɔkra”의 Twi 이야기, 영어 의미, 이해 질문을 제공합니다."}, "original": "📘 Aku ne Ɔkra — STORY (Twi & English)\n\nAku yɛ ɔbaa.\n(Aku is a girl.)\n\nAku te mpa so.\n(Aku is sitting on a bed.)\n\nƆwɔ ɔkra tuntum bi.\n(She has a black cat.)\n\nAku pɛ ɔkra no asɛm.\n(Aku likes the cat’s story / wants to talk to the cat.)\n\nƆkra no nso pɛ Aku asɛm.\n(The cat also likes Aku’s story / wants to listen to Aku.)\n\nƆkra ho hia.\n(The cat is important – general statement.)\n\n⸻\n\n📘 COMPREHENSION QUESTIONS — Aku ne Ɔkra (Twi & English)\n\n🟢 LEVEL 1 — Recall\n\nHwan ne Aku?\n(Who is Aku?)\n\nAboa bɛn na Aku wɔ?\n(Which animal does Aku have?)\n\n⸻\n\n🟡 LEVEL 2 — Understanding\n\nAku pɛ aboa bɛn asɛm?\n(Which animal does Aku like?)\n\n⸻\n\n🔵 LEVEL 3 — Thinking\n\nAboa bɛn na wopɛ n’asɛm? Adɛn nti a?\n(Which animal do you like? Why?)\n\nAdɛn nti na ɔkra ho hia?\n(Why is a cat important?)\n\n⸻\n\n🔥 FINAL LINE\n\nKenkan bio.\n(Read again.)", "source": "_chat.txt · L724 · message 218", "sourceType": "WhatsApp", "label": {"en": "Original conversation", "ko": "실제 대화"}}, {"id": "a1-8", "stage": "readers", "kind": "prompt", "role": "janet", "date": "5/14/26", "time": "00:49 KST", "summary": {"en": "Turn the supplied “Aku ne Ɔkra” story and questions into the next book.", "ko": "“Aku ne Ɔkra” 이야기와 질문을 다음 책으로 제작합니다."}, "original": "📘 Aku ne Ɔkra — STORY (Twi & English)\n\nAku yɛ ɔbaa.\n(Aku is a girl.)\n\nAku te mpa so.\n(Aku is sitting on a bed.)\n\nƆwɔ ɔkra tuntum bi.\n(She has a black cat.)\n\nAku pɛ ɔkra no asɛm.\n(Aku likes the cat’s story / wants to talk to the cat.)\n\nƆkra no nso pɛ Aku asɛm.\n(The cat also likes Aku’s story / wants to listen to Aku.)\n\nƆkra ho hia.\n(The cat is important – general statement.)\n\n⸻\n\n📘 COMPREHENSION QUESTIONS — Aku ne Ɔkra (Twi & English)\n\n🟢 LEVEL 1 — Recall\n\nHwan ne Aku?\n(Who is Aku?)\n\nAboa bɛn na Aku wɔ?\n(Which animal does Aku have?)\n\n⸻\n\n🟡 LEVEL 2 — Understanding\n\nAku pɛ aboa bɛn asɛm?\n(Which animal does Aku like?)\n\n⸻\n\n🔵 LEVEL 3 — Thinking\n\nAboa bɛn na wopɛ n’asɛm? Adɛn nti a?\n(Which animal do you like? Why?)\n\nAdɛn nti na ɔkra ho hia?\n(Why is a cat important?)\n\n⸻\n\n🔥 FINAL LINE\n\nKenkan bio.\n(Read again.) -->이 내용으로 book 4.pdf를 만들어줘.", "source": "Codex · 019e21b1 · L85", "sourceType": "Codex", "label": {"en": "Original prompt", "ko": "제작 프롬프트"}}, {"id": "a1-8r", "stage": "readers", "kind": "response", "role": "ai", "date": "5/14/26", "time": "", "summary": {"en": "The response sets out a plan to reuse the existing book layout. The finished illustrated book follows the next imagegen request.", "ko": "응답은 기존 책의 조판 구조를 활용하겠다는 작업 계획입니다. 다음 imagegen 요청에서 삽화가 들어간 완성본이 이어집니다."}, "original": "새 책을 기존 `book2` 구조에 맞춰 만들겠습니다. 먼저 현재 파일 구성과 기존 LaTeX 스타일을 확인해서 `book4.tex`/`book4.pdf`를 같은 품질로 생성하겠습니다.", "source": "Codex · 019e21b1 · L90", "sourceType": "Codex", "label": {"en": "Response · editorial summary", "ko": "응답 · 편집 요약"}}, {"id": "a1-10", "stage": "readers", "kind": "prompt", "role": "janet", "date": "5/14/26", "time": "00:49 KST", "summary": {"en": "Use imagegen for the illustrations.", "ko": "삽화에 imagegen을 사용합니다."}, "original": "$imagegen", "source": "Codex · 019e21b1 · L98", "sourceType": "Codex", "label": {"en": "Original prompt", "ko": "제작 프롬프트"}}, {"id": "a1-10r", "stage": "readers", "kind": "response", "role": "ai", "date": "5/14/26", "time": "", "summary": {"en": "A nine-page book was produced. Twi and English were typeset separately from the images; the response reports checking Twi characters and embedded fonts.", "ko": "9쪽 그림책을 제작했습니다. Twi·영어를 이미지와 별도로 조판하고 특수문자 및 폰트 임베딩을 점검했다고 보고했습니다."}, "original": "완료했습니다.\n\n만든 파일:\n- [book 4.pdf](/Users/janetmath/Dropbox/mina-janet/________아프리카-가나/가나교사와2026/야우/book%204.pdf)\n- [book4.pdf](/Users/janetmath/Dropbox/mina-janet/________아프리카-가나/가나교사와2026/야우/book4.pdf)\n- [book4.tex](/Users/janetmath/Dropbox/mina-janet/________아프리카-가나/가나교사와2026/야우/book4.tex)\n- 이미지 자산: [book4_assets](/Users/janetmath/Dropbox/mina-janet/________아프리카-가나/가나교사와2026/야우/book4_assets)\n\n구성은 총 9쪽입니다: 제목 1쪽, 이야기 6쪽, 질문 1쪽, `Kenkan bio.` 마지막 1쪽. `$imagegen`으로 그림 시트를 생성한 뒤 페이지별 그림으로 잘라 넣었고, Twi/English 글자는 PDF 텍스트로 따로 넣었습니다.\n\n검증:\n- PDF 9 pages 정상\n- Times New Roman Bold embe s. \n\nOne sound, a week. Sometimes, it happens to be 2 in a week. \n\nI therefore propose we design a set of letter cards. Let me draft the Twi letters for you. ‎\u003cThis message was edited>", "source": "_chat.txt · L833 · message 221", "sourceType": "WhatsApp", "label": {"en": "Original conversation", "ko": "실제 대화"}}, {"id": "a1-58", "stage": "readers", "kind": "prompt", "role": "janet", "date": "5/14/26", "time": "02:22 KST", "summary": {"en": "Make Book 6 as digraph letter cards, using the supplied Twi examples.", "ko": "Twi 예시를 사용해 Book 6를 digraph 카드로 제작합니다."}, "original": "이번엔 book 6.pdf를 만들거야. 지금까지랑은 다르게 letter cards야. Digraph     Example (Twi)     Meaning (English)\n\nky          kyɛ               share\n\ngy          gya               fire\n\nhy          hyɛ               wear\n\nny          nyɛ               not / do not\n\ntw          twa               cut\n\ndw          dwa               peel (cassava)\n\nkw          kwaeɛ             forest\n\nhw          hwɛ               look\n\nnw          nwom              song / music", "source": "Codex · 019e21b1 · L729", "sourceType": "Codex", "label": {"en": "Original prompt", "ko": "제작 프롬프트"}}, {"id": "a1-58r", "stage": "readers", "kind": "response", "role": "ai", "date": "5/14/26", "time": "", "summary": {"en": "The response plans nine cards, one digraph per page. The next imagegen request produces the illustrated set.", "ko": "페이지마다 digraph 하나씩, 총 9장 카드 제작을 계획했습니다. 이어지는 imagegen 요청으로 삽화 카드를 제작합니다."}, "original": "`book 6.pdf`는 이미지 없이 텍스트 중심 letter card PDF로 만들겠습니다. 각 digraph를 한 페이지 카드로 잡아서 총 9쪽으로 구성하고, 기존 책들과 같은 A5/Times New Roman Bold 기반으로 맞추겠습니다.", "source": "Codex · 019e21b1 · L735", "sourceType": "Codex", "label": {"en": "Response · editorial summary", "ko": "응답 · 편집 요약"}}, {"id": "a1-60", "stage": "readers", "kind": "prompt", "role": "janet", "date": "5/14/26", "time": "02:22 KST", "summary": {"en": "Generate the illustrations for the letter cards.", "ko": "letter cards에 들어갈 삽화를 생성합니다."}, "original": "  간격, 그림 배치를 조정했습니다."}, "original": "수정 완료했습니다.\n\n적용 내용:\n- 전체 페이지의 테두리 박스를 안쪽으로 줄여서 페이지 번호 원과 겹치지 않게 수정\n- `Example (Twi)` / `Meaning (English)` 라벨과 아래 텍스트 사이 간격 축소\n- 하단 이미지를 조금 위로 올리고 크기를 조정해서 테두리 밖으로 나가지 않게 수정\n- 9페이지 전체에 동일하게 적용\n\n업데이트된 파일:\n- [book 6.pdf](/Users/janetmath/Dropbox/mina-janet/________아프리카-가나/가나교사와2026/야우/book%206.pdf)\n- [book6.pdf](/Users/janetmath/Dropbox/mina-janet/________아프리카-가나/가나교사와2026/야우/book6.pdf)\n- [book6.tex](/Users/janetmath/Dropbox/mina-janet/________아프리카-가나/가나교사와2026/야우/book6.tex)\n\n검증:\n- 9쪽 유지\n- 폰트 임베딩 정상\n- 텍스트 추출 정상\n- 1, 5, 9쪽 렌더링 확인했고 겹침/테두리 이탈 문제 해결됐습니다.", "source": "Codex · 019e21b1 · L967", "sourceType": "Codex", "label": {"en": "Response · editorial summary", "ko": "응답 · 편집 요약"}}, {"id": "w268", "stage": "readers", "kind": "human", "role": "yaw", "date": "5/30/26", "time": "05:32:10", "summary": {"en": "Yaw proposes short-vowel readers with a complete eight-page example, “Sam and the Cat.”", "ko": "야우가 “Sam and the Cat” 8쪽 예시와 함께 단모음별 reader 시리즈를 제안했습니다."}, "original": "Janet,\n\nAs I continue thinking about the learner materials, I am beginning to envision a series of short decodable readers rather than isolated worksheets.\n\nMy idea is that each short vowel sound (/a/, /e/, /i/, /o/, /u/) would have its own small reader of about 8–10 pages, with a unique cover page, illustrations, comprehension activities, and writing activities.\n\nFor example, the /a/ reader could gradually progress as follows:\n\nPage 1 – Cover Page\nTitle: Sam and the Cat\n\nPage 2 – Target Sound\n/a/\ncat, mat, cap, bag, jam\n\nPage 3 – Simple Sentences\nSam has a cap.\nThe cat sat.\nA man has a bag.\n\nPage 4 – More Reading Practice\nSam can pat the cat.\nThe cat sat on a mat.\nSam and the cat sat.\n\nPage 5 – Short Paragraph\n\nSam has a cat.\n\nThe cat sat on a mat.\n\nSam can pat the cat.\n\nThe cat ran at a rat.\n\nSam and the cat sat.\n\nPage 6 – Story Continues\n\nSam had a bag.\n\nThe cat ran to the bag.\n\nSam ran after the cat.\n\nThe cat sat by the bag.\n\nSam was glad.\n\nPage 7 – Think and Talk\nWho has a cat?\nWhere did the cat sit?\nWhy was Sam glad?\n\nPage 8 – Writing Activity\nWrite:\ncat\nmat\nbag\nSam\n\nComplete:\nThe cat sat on a ______.\n\nMy intention is for each vowel reader to follow a similar structure while gradually increasing reading demands. The stories would remain highly decodable and closely aligned with the sounds already taught through the ECCR 3-Day Model.\n\nI believe this could become the foundation of a structured ECCR reader series for beginning readers.", "source": "_chat.txt · L1178 · message 298", "sourceType": "WhatsApp", "label": {"en": "Original conversation", "ko": "실제 대화"}}, {"id": "a0-0", "stage": "readers", "kind": "prompt", "role": "janet", "date": "5/30/26", "time": "05:53 KST", "summary": {"en": "Make the eight-page /a/ reader as an illustrated book, following Yaw’s detailed outline.", "ko": "야우의 구성안에 따라 8쪽 /a/ reader를 그림책으로 편집합니다."}, "original": "1에서8페이지까지 오더대로 이미지를 그려서 pdf로 보여줘. 이거, 책이거든. 책처럼 편집해줘.As I continue thinking about the learner materials, I am beginning to envision a series of short decodable readers rather than isolated worksheets.\n\nMy idea is that each short vowel sound (/a/, /e/, /i/, /o/, /u/) would have its own small reader of about 8–10 pages, with a unique cover page, illustrations, comprehension activities, and writing activities.\n\nFor example, the /a/ reader could gradually progress. My intention is for each vowel reader to follow a similar structure while gradually increasing reading demands. The stories would remain highly decodable and closely aligned with the sounds already taught through the ECCR 3-Day Model.\n\n\nPage 1 – Cover Page\nTitle: Sam and the Cat\n\nPage 2 – Target Sound\n/a/\ncat, mat, cap, bag, jam\n\nPage 3 – Simple Sentences\nSam has a cap.\nThe cat sat.\nA man has a bag.\n\nPage 4 – More Reading Practice\nSam can pat the cat.\nThe cat sat on a mat.\nSam and the cat sat.\n\nPage 5 – Short Paragraph\n\nSam ach is that it maintains a strong decodable foundation while introducing learners to the high-frequency words they will repeatedly encounter in authentic reading.\n\nI see these books as an important bridge between the short vowel readers and the more advanced readers we may develop later.", "source": "_chat.txt · L1245 · message 299", "sourceType": "WhatsApp", "label": {"en": "Original conversation", "ko": "실제 대화"}}, {"id": "a0-21", "stage": "readers", "kind": "prompt", "role": "janet", "date": "5/30/26", "time": "06:48 KST", "summary": {"en": "Create Book 8 from the proposed high-frequency-word bridge and sample text.", "ko": "고빈도 단어 연결 교재와 예시 문장으로 Book 8을 만듭니다."}, "original": "이번엔 book 8.pdf를 만들어줘. Another thought occurred to me as I reflected on the reader series.\n\nAfter learners successfully complete the short vowel readers, I believe they will need an intermediate set of books before moving into more advanced readers.\n\nWhat I like about this approach is that it maintains a strong decodable foundation while introducing learners to the high-frequency words they will repeatedly encounter in authentic reading.\n\nI see these books as an important bridge between the short vowel readers and the more advanced readers we may develop later.\n\nThese books would still contain highly decodable text, but would gradually introduce carefully selected high-frequency words such as:\n\nthe, was, are, one, you, he, she, we, boy, girl, they\n\nThe purpose would be to help learners transition from controlled decoding to more fluent and natural reading.\n\nFor example:\n\nWord Bank\n\nthe\nwas\nare\nwe\nhe\nshe\nboy\ngirl\none\nyou\n\nSample Text\n\nWe are on the mat.\n\nThe boy was on the mat.\n\nThe girl was by it.\n\nHe saw the cat.\n\nShe saw the cat too.\n\nOne day, the boy and the girl sat by a pond.\n\nThey saw a duck in the pond.\n\nThe duck was glad.\n\nThe boy was glad.\n\nThe girl was glad.\n\n $imagegen", "source": "Codex · 019e7581 · L366", "sourceType": "Codex",

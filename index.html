 "label": {"en": "Revision prompt", "ko": "개선 요구 프롬프트"}}, {"id": "a0-81r", "stage": "readers", "kind": "response", "role": "ai", "date": "6/1/26", "time": "", "summary": {"en": "Text boxes were separated from the pictures so the lower parts of the scenes stayed visible.", "ko": "텍스트 박스를 그림과 분리해 장면 아래쪽이 보이도록 했습니다."}, "original": "수정했습니다. 하단 텍스트 박스를 그림 위에 겹치지 않게 분리해서, 아래쪽에 있던 여우/돌/꽃/바닥 장면이 보이도록 다시 편집했습니다. 제목 박스도 작게 올려서 장면을 덜 가리게 조정했습니다.\n\n업데이트된 PDF: [The Little Fox_imagegen_picture_book.pdf](\u003c/Users/janetmath/Dropbox/mina-janet/________아프리카-가나/가나교사와2026/야우/The Little Fox_imagegen_picture_book.pdf>)\n\n8페이지 PDF로 다시 생성했고, 미리보기 `little_fox_imagegen_preview/page-5.png`, `page-6.png`, `page-8.png` 기준으로 하단 그림이 텍스트에 가려지지 않는 것 확인했습니다.", "source": "Codex · 019e7581 · L1186", "sourceType": "Codex", "label": {"en": "Response · editorial summary", "ko": "응답 · 편집 요약"}}, {"id": "a0-88", "stage": "readers", "kind": "prompt", "role": "janet", "date": "6/1/26", "time": "21:04 KST", "summary": {"en": "The mother’s head is still cropped on pages 6 and 8. Fix those pages.", "ko": "6·8쪽에서 엄마 머리가 잘리는 문제를 수정합니다."}, "original": "6페이지랑 8페이지에서 엄마 머리 부분이 짤리거든. 이 부분을 수정해줘", "source": "Codex · 019e7581 · L1191", "sourceType": "Codex", "label": {"en": "Revision prompt", "ko": "개선 요구 프롬프트"}}, {"id": "a0-88r", "stage": "readers", "kind": "response", "role": "ai", "date": "6/1/26", "time": "", "summary": {"en": "Those illustrations were fitted in full, while the separate text boxes were retained.", "ko": "해당 그림을 전체가 보이도록 배치하고 분리한 텍스트 박스는 유지했습니다."}, "original": "수정했습니다. 6페이지와 8페이지는 이미지를 `full fit` 방식으로 따로 배치해서 엄마 머리 부분이 잘리지 않게 했습니다. 하단 텍스트 박스도 그대로 분리되어 있어서 아래쪽 그림은 가리지 않습니다.\n\n업데이트된 PDF: [The Little Fox_imagegen_picture_book.pdf](\u003c/Users/janetmath/Dropbox/mina-janet/________아프리카-가나/가나교사와2026/야우/The Little Fox_imagegen_picture_book.pdf>)\n\n확인: `little_fox_imagegen_preview/page-6.png`, `page-8.png`에서 엄마 머리가 모두 보입니다.", "source": "Codex · 019e7581 · L1241", "sourceType": "Codex", "label": {"en": "Response · editorial summary", "ko": "응답 · 편집 요약"}}, {"id": "a4-476", "stage": "audio", "kind": "prompt", "role": "janet", "date": "6/16/26", "time": "05:20 KST", "summary": {"en": "Can the listening tool be connected to the book, so tapping a word or sentence plays audio?", "ko": "책의 단어나 문장을 터치하면 들을 수 있도록 소리 연습 도구를 연결할 수 있는지 묻습니다."}, "original": "혹시, 지금 만든 소리 연습 도구를 책이랑 연동시킬 수 있어? 책에서 단어나 문장 옆에 스피커 아이콘을 만들어서 터치하면 들을 수 있게.", "source": "Codex · 019e8ead · L3707", "sourceType": "Codex", "label": {"en": "Original prompt", "ko": "제작 프롬프트"}}, {"id": "a4-476r", "stage": "audio", "kind": "response", "role": "ai", "date": "6/16/26", "time": "", "summary": {"en": "The response proposes an HTML book view with audio controls using the existing TTS service. This was a design proposal.", "ko": "기존 TTS를 활용하는 HTML 책 화면과 음성 버튼을 제안했습니다. 이 단계는 설계 제안입니다."}, "original": "가능합니다. 크게 3가지 방식이 있습니다.\n\n**추천 방식: HTML 책 뷰어 안에 스피커 아이콘 삽입**\n지금 ECCR 앱 안에서 `book 7/8/9.md`를 “책처럼 보이는 페이지”로 렌더링하고, 단어/문장 옆에 스피커 아이콘을 붙입니다. 아이콘을 누르면 기존 Kokoro/Fable TTS 서버로 바로 읽어줍니다.  \n가장 안정적이고, 지금 만든 TTS/모바일 URL 구조를 그대로 재사용할 수 있습니다.\n\n**방식 2: Markdown에 태그를 넣기**\n예를 들면 책 원문에 이렇게 표시합니다.\n\n```md\nThis is a [🔊 difficult word: courseware].\nThis sentence can be practiced. {{tts:This sentence can be practiced.}}\n```\n\n앱이 이 태그를 읽어서 스피커 버튼으로 바꿔줍니다. 정확히 어떤 단어/문장을 들려줄지 제어하기 좋지만, 책 파일에 표시를 넣어야 합니다.\n\n**방식 3: 자동으로 모든 문장/단어에 스피커 붙이기**\n책 텍스트를 문장 단위로 자동 분리해서 각 문장 오른쪽에 스피커를 붙입니다. 단어도 클릭하면 들을 수 있게 만들 수 있습니다. 편하지만 화면이 복잡해질 수 있어서, 모바일에서는 문장 단위 스피커만 기본으로 두는 게 낫습니다.\n\n제가 보기엔 ECCR에는 이렇게 가는 게 좋습니다:\n\n- `Book` 탭 추가\n- 책 본문을 읽기 좋은 레이아웃으로 표시\n- 각 문장 옆에 작은 스피커 아이콘\n- 단어를 터치하면 선택 팝업 또는 미니 스피커 표시\n- 스피커를 누르면 현재 기본 TTS인 `Kokoro Fable UK`로 재생\n- “Practice에 추가” 버튼도 같이 제공해서 책에서 바로 연습 목록으로 보낼 수 있게 함\n\n책이 지금처럼 `.md` 파일이면 바로 가능합니다. 다음 단계로는 ECCR에 `Book` 탭을 만들고 `book 7/8/9.md`를 책 화면에서 선택해서 볼 수 있게 붙이면 됩니다.", "source": "Codex · 019e8ead · L3713", "sourceType": "Codex", "label": {"en": "Response · editorial summary", "ko": "응답 · 편집 요약"}}, {"id": "a4-479", "stage": "audio", "kind": "prompt", "role": "janet", "date": "6/16/26", "time": "05:36 KST", "summary": {"en": "Build that book view using the prepared Book 7–9 materials.", "ko": "준비된 Book 7–9 재료로 책 화면을 구현합니다."}, "original": "추천방식이 내가 추구하는 방향이야. /Users/janetmath/Dropbox/mina-janet/________아프리카-가나/가나교사와2026/야우/결과물Yaw_Janet/book_7_8_9_materials 이 재료로 만들어줘. 책을 보면서 문장 옆 스피커 아이콘을 누르면 음성이 나오게 해줘.", "source": "Codex · 019e8ead · L3718", "sourceType": "Codex", "label": {"en": "Original prompt", "ko": "제작 프롬프트"}}, {"id": "a4-479r", "stage": "audio", "kind": "response", "role": "ai", "date": "6/16/26", "time": "", "summary": {"en": "A Book tab was implemented with selectable Books 7–9 and word/sentence playback using server-based TTS.", "ko": "Book 7–9 선택과 단어·문장 재생을 제공하는 Book 탭을 구현했습니다. 당시에는 서버 TTS 방식이었습니다."}, "original": "구현했습니다. ECCR에 `Book` 탭을 추가했고, `/book_7_8_9_materials/02_audio_text_md`의 Book 7, 8, 9 텍스트를 앱 안에 넣었습니다.\n\n링크:\nhttps://ray-venues-quad-each.trycloudflare.com/teacher/index.html\n\n사용 흐름:\n- 들어가면 기본으로 `Book` 탭이 열립니다.\n- 오른쪽 위 `Book` 선택에서 Book 7/8/9를 바꿀 수 있습니다.\n- 각 단어/문장 왼쪽 스피커 아이콘을 누르면 Kokoro Fable UK 음성으로 바로 재생됩니다.\n- 기존 TTS 설정의 속도/voice/engine을 그대로 사용합니다.\n\n검증 완료:\n- `teacher/app.js` 문법 검사 통과\n- `tts_server.py` 문법 검사 통과\n- 공개 URL에서 Book UI 새 버전 확인\n- 공개 URL에서 `book-9.md` 로딩 확인\n- 공개 URL에서 “Sam has a cap.” TTS WAV 생성 확인\n- `npm test` 전체 통과\n\n폰에서 이미 열어둔 상태면 새로고침 한 번 해주세요.", "source": "Codex · 019e8ead · L3846", "sourceType": "Codex", "label": {"en": "Response · editorial summary", "ko": "응답 · 편집 요약"}}, {"id": "a4-538", "stage": "audio", "kind": "prompt", "role": "janet", "date": "6/16/26", "time": "06:18 KST", "summary": {"en": "Remove the speaker icons. Let learners tap the sentence or word itself to hear it.", "ko": "스피커 아이콘을 없애고 문장·단어 자체를 눌러 재생되도록 바꿉니다."}, "original": "버튼이 지금도 이상하게 붙어있거든. 문장 어디를 누르더라도 음성이 재생되게, 단어를 누르면 단어가 재생되게 할 수 있어? 스피커 버튼은 모두 삭제하고. 가능해?", "source": "Codex · 019e8ead · L4136", n{path=\"/Users/janetmath/Ibjanetsong Dropbox/Song Janet/mina-janet/________아프리카-가나/가나교사와2026/야우/_Assessment book/ECCR_Book5_Assessment.pdf\" purpose=\"output\"}\n- Book 6: :codex-file-citation{path=\"/Users/janetmath/Ibjanetsong Dropbox/Song Janet/mina-janet/________아프리카-가나/가나교사와2026/야우/_Assessment book/ECCR_Book6_Assessment.pdf\" purpose=\"output\"}\n- Book 7: :codex-file-citation{path=\"/Users/janetmath/Ibjanetsong Dropbox/Song Janet/mina-janet/________아프리카-가나/가나교사와2026/야우/_Assessment book/ECCR_Book7_Assessment.pdf\" purpose=\"output\"}\n\n전체 21페이지의 그림 배치, Twi 특수문자, A4 규격과 저장본 일치 여부를 검수했습니다.", "source": "Codex · 01a05ec0 · L7159", "sourceType": "Codex", "label": {"en": "Response · editorial summary", "ko": "응답 · 편집 요약"}}, {"id": "a2-217", "stage": "kit", "kind": "prompt", "role": "janet", "date": "9/5/26", "time": "08:12 KST", "summary": {"en": "Prevent cropped heads in assessment pictures and add breathing room around teacher instructions.", "ko": "평가책 그림의 머리 잘림을 해결하고 교사 안내문에 여백을 확보합니다."}, "original": "achievement check 첫번째 페이지에 있는 그림이 머리 부분이 짤리는게 많은데 비율을 세로를 더 길게해서 본 책에서 축소한 느낌으로 넣어줄 수 있어? 아래 공간이 충분히 있는 것 같아. 그리고, A. Read the words aloud. 박스 아래 Teacher: 이 글씨위 아래에 여백을 만들어줘. 모든 책에 동일하게 편집해줘.", "source": "Codex · 01a05ec0 · L7165", "sourceType": "Codex", "label": {"en": "Revision prompt", "ko": "개선 요구 프롬프트"}}, {"id": "a2-217r", "stage": "kit", "kind": "response", "role": "ai", "date": "9/5/26", "time": "", "summary": {"en": "All seven assessments were revised to preserve image proportions and improve spacing.", "ko": "평가책 7권의 그림 비율과 안내문 여백을 함께 수정했습니다."}, "original": "Book 1–7 Achievement Check를 모두 동일하게 수정했습니다.\n\n- 첫 페이지 그림을 세로로 늘리고 원본 비율을 유지해 머리가 잘리지 않도록 배치\n- `Teacher: tick each item read correctly` 문구 위아래 여백 확대\n- Book 1의 오른손을 든 학생 이미지 유지\n- 모든 파일 A4 3페이지 구성과 최종 폴더 반영 확인 완료\n\n- Book 1: :codex-file-citation{path=\"/Users/janetmath/Ibjanetsong Dropbox/Song Janet/mina-janet/________아프리카-가나/가나교사와2026/야우/_Assessment book/ECCR_Book1_Assessment.pdf\" purpose=\"output\"}\n- Book 2: :codex-file-citation{path=\"/Users/janetmath/Ibjanetsong Dropbox/Song Janet/mina-janet/________아프리카-가나/가나교사와2026/야우/_Assessment book/ECCR_Book2_Assessment.pdf\" purpose=\"output\"}\n- Book 3: :codex-file-citation{path=\"/Users/janetmath/Ibjanetsong Dropbox/Song Janet/mina-janet/________아프리카-가나/가나교사와2026/야우/_Assessment book/ECCR_Book3_Assessment.pdf\" purpose=\"output\"}\n- Book 4: :codex-file-citation{path=\"/Users/janetmath/Ibjanetsong Dropbox/Song Janet/mina-janet/________아프리카-가나/가나교사와2026/야우/_Assessment book/ECCR_Book4_Assessment.pdf\" purpose=\"output\"}\n- Book 5: :codex-file-citation{path=\"/Users/janetmath/Ibjanetsong Dropbox/Song Janet/mina-janet/________아프리카-가나/가나교사와2026/야우/_Assessment book/ECCR_Book5_Assessment.pdf\" purpose=\"output\"}\n- Book 6: :codex-file-citation{path=\"/Users/janetmath/Ibjanetsong Dropbox/Song Janet/mina-janet/________아프리카-가나/가나교사와2026/야우/_Assessment book/ECCR_Book6_Assessment.pdf\" purpose=\"output\"}\n- Book 7: :codex-file-citation{path=\"/Users/janetmath/Ibjanetsong Dropbox/Song Janet/mina-janet/________아프리카-가나/가나교사와2026/야우/_Assessment book/ECCR_Book7_Assessment.pdf\" purpose=\"output\"}", "source": "Codex · 01a05ec0 · L7323", "sourceType": "Codex", "label": {"en": "Response · editorial summary", "ko": "응답 · 편집 요약"}}, {"id": "a2-223", "stage": "kit", "kind": "prompt", "role": "janet", "date": "9/7/26", "time": "22:36 KST", "summary": {"en": "Make a four-line writing notebook for elementary learners.", "ko": "초등 학습자용 4선 쓰기 노트를 만듭니다."}, "original": "쓰기 노트를 만들어줘. Writing Book 1 이라는 표지에 내부에는 일반 초등학생이쓰는 빨간 줄이 있는 네줄짜리 영어노트를 만들어줘.", "source": "Codex · 01a05ec0 · L7331", "sourceType": "Codex", "label": {"en": "Original prompt", "ko": "제작 프롬프트"}}, {"id": "a2-223r", "stage": "kit", "kind": "response", "role": "ai", "date": "9/7/26", "time": "", "summary": {"en": "An initial A4 Writing Book 1 was produced with a cover and 20 practice pages. This was an intermediate version.", "ko": "표지와 연습지 20쪽으로 된 A4 Writing Book 1을 제작했습니다. 중간 판본입니다."}, "original": "A4 인쇄용 Writing Book 1을 제작했습니다.\n\n- 표지 1쪽: 기존 Book 1 색상과 Kofi 그림 활용\n- 쓰기 연습지 20쪽\n- 페이지마다 빨간 네 줄 세트 7개\n- 이름·날짜 칸과 내부 페이지 번호 포함\n- 표지에는 페이지 번호 없음\n\n완성본: :codex-file-citation{path=\"/Users/janetmath/Ibjanetsong Dropbox/Song Janet/mina-janet/________아프리카-가나/가나교사와2026/야우/book/output/pdf/a4/Writing_Book_1.pdf\" purpose=\"output\"}", "source": "Codex · 01a05ec0 · L7439", "sourceType": "Codex", "label": {"en": "Response · editorial summary", "ko": "응답 · 편집 요약"}}, {"id": "a2-271", "stage": "kit", "kind": "prompt", "role": "janet", "date": "9/8/26", "time": "01:18 KST", "summary": {"en": "Make it 40 pages.", "ko": "총 40쪽으로 제작합니다."}, "original": "페이지는 40장짜리로 만들어줘.", "source": "Codex · 01a05ec0 · L8128", "sourceType": "Codex", "label": {"en": "Revision prompt", "ko": "개선 요구 프롬프트"}}, {"id": "a2-271r", "stage": "kit", "kind": "response", "role": "ai", "date": "9/8/26", "time": "", "summary": {"en": "The notebook became 40 pages including two cover pages and 38 inside pages, using red–black–black–red lines.", "ko": "표지 2쪽과 내지 38쪽, 빨강–검정–검정–빨강 선으로 된 총 40쪽 노트가 되었습니다."}, "original": "총 40쪽(표지 2쪽 + 내지 38쪽)으로 완성했습니다.\n\n- 내지 오른쪽 상단에 이름용 네 줄 추가\n- 이미지처럼 빨강–검정–검정–빨강 실선으로 구성\n- 최근 별도 양식은 복구 가능한 보관 폴더로 이동\n\n수정본: :codex-file-citation{path=\"/Users/janetmath/Ibjanetsong Dropbox/Song Janet/mina-janet/________아프리카-가나/가나교사와2026/야우/book/output/pdf/a4/Writing_Book_1.pdf\" purpose=\"output\"}", "source": "Codex · 01a05ec0 · L8154", "sourceType": "Codex", "label": {"en": "Response · editorial summary", "ko": "응답 · 편집 요약"}}, {"id": "a2-274", "stage": "kit", "kind": "prompt", "role": "janet", "date": "9/8/26", "time": "04:35 KST", "summary": {"en": "Create an entry baseline to identify which Asante Twi letter sounds learners know before instruction.", "ko": "수업 전 학습자가 아는 Asante Twi 음가를 파악하는 기초 평가를 제작합니다."}, "original": "Create a simple, classroom-ready **Foundational Entry Baseline Assessment for Basic 1 learners in Ghana**.\n\nThe main purpose of this assessment is to determine, **before instruction begins**, which **Asante Twi letter sounds** each learner already knows and how many sounds the learner can independently produce.\n\nThis is NOT a Book 1 achievement test and should NOT assume that learners can already read words or sentences. It must be suitable for children entering Basic 1 who may have very limited literacy skills.\n\n### Assessment principles\n\n1. The assessment should be administered **individually**, one learner at a time.\n2. The teacher shows one letter/symbol at a time and asks:\n   **“What sound does this make?”**\n3. The learner should produce the sound independently.\n4. The teacher should not teach, correct, give hints, or rehearse the sound during the assessment.\n5. Record whether each sound is:\n\n   * Correct\n   * Incorrect\n   * No response\n   * Self-corrected\n6. Include a simple total:\n   **Number of letter sounds known: ___ / ___**\n7. Include space for brief teacher observations.\n8. The assessment should be quick, visually simple, and appropriate for a Basic 1 child.\n\n### Important linguistic requirement\n\nThis assessment is for **Asante Twi**, not English.\n\nDo NOT invent or guess the pronunciation of Twi letters. The correct locally accepted sounds must be validated by the Ghanaian teacher, Yaw, who is the Asante Twi and classroom expert.\n\nFor the current draft, include the following letters/symbols that have already been considered in our pilot baseline:\n\n**ɔ, m, ɛ, d, n, s, a, w, e, o**\n\nPresent them in a **randomized order rather than alphabetical order** so that the assessment measures sound knowledge rather than memorized sequence.\n\n### Produce TWO separate pages\n\n#### PAGE 1 — Learner Assessment Card\n\nTitle:\n\n**ECCR Foundational Entry Baseline**\n**Asante Twi Letter-Sound Assessment**\n\nInclude:\n\nLearner Name: ____________________\nClass: ____________________\nDate: ____________________\nAssessor: ____________________\n\nInstruction for the teacher:\n\n**Point to each letter one at a time and ask the learner to say its sound. Do not provide the sound or correct the learner during the assessment.**\n\nDisplay the letters clearly in large print with plenty of spacing.\n\nDo NOT show answers or pronunciation guidance on the learner-facing page.\n\n---\n\n#### PAGE 2 — Teacher Scoring Record\n\nCreate a table with the following columns:\n\n| Item | Letter | Correct | Incorrect | No Response | Self-Corrected | Notes |\n\nInclude all 10 letters.\n\nAt the bottom include:\n\n**Total independently correct: ___ / 10**\n\n**Sounds the learner already knows:**\n\n---\n\n**Sounds requiring instruction:**\n\n---\n\n**Teacher observations:**\n\n---\n\n---\n\nAlso provide a simple learner profile:\n\n* ☐ No letter sounds independently demonstrated yet\n* ☐ Knows a few letter sounds\n* ☐ Knows several letter sounds\n* ☐ Knows most/all assessed letter sounds\n\nDo NOT create arbitrary proficiency cut-off scores. This is a **draft pilot baseline tool, not a validated standardized test**.\n\n### Optional future development\n\nAfter this basic letter-sound assessment is finalized with the Ghanaian teacher, we may later add separate sections for:\n\n* initial-sound awareness\n* oral blending\n* simple decodable Twi word reading\n* short decodable sentence reading\n\nHowever, these should NOT replace the primary purpose of the present assessment: identifying **which Twi letter sounds each learner knows before teaching begins**.\n\nDesign the final output so it can easily be converted into a clean A4 printable PDF for use in a Ghanaian Basic 1 classroom.", "source": "Codex · 01a05ec0 · L8161", "sourceType": "Codex", "label": {"en": "Original prompt", "ko": "제작 프롬프트"}}, {"id": "a2-274r", "stage": "kit", "kind": "response", "role": "ai", "date": "9/8/26", "time": "", "summary": {"en": "A two-page baseline draft included shuffled letters, aligned scoring and descriptive profiles. The response explicitly left sound validation to Yaw.", "ko": "뒤섞은 글자, 대응 채점표, 기술적 학습자 프로필을 담은 2쪽 초안을 제작했습니다. 음가 검증은 야우가 해야 한다고 명시했습니다."}, "original": "Created the two-page A4 assessment: :codex-file-citation{path=\"/Users/janetmath/Ibjanetsong Dropbox/Song Janet/mina-janet/________아프리카-가나/가나교사와2026/야우/book/output/pdf/a4/ECCR_Foundational_Entry_Baseline_Asante_Twi.pdf\" purpose=\"output\"}.\n\nIt includes large shuffled letters, matching scoring rows, observations, and descriptive learner profiles without cut-offs. Self-corrections are recorded separately from first-attempt correct responses.\n\nBoth pages were visually checked. Yaw’s validation of accepted Asante Twi sounds is explicitly required before classroom use.", "source": "Codex · 01a05ec0 · L8186", "sourceType": "Codex", "label": {"en": "Response · editorial summary", "ko": "응답 · 편집 요약"}}, {"id": "w622", "stage": "kit", "kind": "human", "role": "yaw", "date": "9/1/26", "time": "00:18:07", "summary": {"en": "Yaw asks to select books according to learner progress, rather than finish all nine within a fixed period.", "ko": "야우는 정해진 기간 안에 9권을 끝내기보다 학습 진도에 따라 교재를 선택하자고 했습니다."}, "original": "Janet, for the pilot, I don’t want us to decide that learners must necessarily complete all Books 1–9 within a fixed period. I would prefer the number of books we use to follow the learners’ progress and the sequence of skills we are building.\n\nSince Term 1 is mainly for establishing the foundation—letter sounds, phonemic awareness, blending and the beginning of decodable reading—I think we should first identify which of Books 1–9 genuinely correspond to that Term 1 progression.\n\nOnce learners have securely developed the skills required for the next book, we move forward. I don’t want the books themselves to determine the pace of instruction; the learners’ readiness should determine when we move to the next level.\n\nSo for the printing quotation, perhaps we should first look at Books 1–9 together and identify the ones we realistically expect to use during Term 1. We can then print the appropriate set for the initial pilot rather than printing all nine immediately if some belong to a later stage.\n\nMy main concern is to give the learners a strong start rather than rush through the materials.", "source": "_chat.txt · L2023 · message 654", "sourceType": "WhatsApp", "label": {"en": "Original conversation", "ko": "실제 대화"}}, {"id": "w605", "stage": "offline", "kind": "human", "role": "yaw", "date": "8/30/26", "time": "10:49:12", "summary": {"en": "Yaw has recorded Book 3 sentence by sentence and asks how to send the recordings.", "ko": "야우가 Book 3를 문장별로 녹음하고 전달 방법을 묻습니다."}, "original": "This is from book 3. Please, I recorded each sentence. Can I upload them here one by one?", "source": "_chat.txt · L1963 · message 637", "sourceType": "WhatsApp", "label": {"en": "Original conversation", "ko": "실제 대화"}}, {"id": "a4-1521", "stage": "offline", "kind": "prompt", "role": "janet", "date": "9/4/26", "time": "04:43 KST", "summary": {"en": "Make downloaded books and tap-to-listen audio work without Wi-Fi.", "ko": "책과 음성을 내려받은 뒤 Wi-Fi 없이도 터치 재생되도록 합니다."}, "original": "폰에 내려 받아서 와이파이 없는 환경에서도 터치하면 음성 듣는 기능이 작동 되도록 해줘.", "source": "Codex · 019e8ead · L10975", "sourceType": "Codex", "label": {"en": "Original prompt", "ko": "제작 프롬프트"}}, {"id": "a4-1521r", "stage": "offline", "kind": "response", "role": "ai", "date": "9/4/26", "time": "", "summary": {"en": "The response reports a static PWA with Books 1–3 images and 28 recorded Book 3 clips. Books 1 and 2 were view-only at this stage.", "ko": "Book 1–3 이미지와 Book 3 교사 녹음 28개를 포함한 정적 PWA를 배포했다고 보고했습니다. 이때 Book 1·2는 보기 전용이었습니다."}, "original": "완료했습니다. 노트북/로컬서버 없이도 열리는 GitHub Pages 앱에 반영했습니다.\n\nPicture Book 앱:\n`https://jieunjanetsong.github.io/eccr-picture-audio-site/picturebook/`\n\n반영 내용:\n- 최종 PDF `Book1`, `Book2`, `Book3`를 새로 앱에 넣음\n- `Book1`, `Book2`는 보기 전용\n- `Book3`는 현지인 녹음 mp3 28개 연결\n- Book3의 글자 부분을 터치하면 해당 녹음 음성이 재생됨\n- PWA 오프라인 캐시 추가\n- Book1-3 이미지와 Book3 오디오가 폰에 캐시되도록 설정\n\n오프라인 사용 방법:\n1. 인터넷 되는 곳에서 위 링크를 폰으로 엽니다.\n2. Android Chrome: 메뉴에서 `Add to Home screen`\n3. iPhone Safari: 공유 버튼에서 `Add to Home Screen`\n4. 처음 열 때 Book1-3 이미지와 Book3 오디오를 캐시해야 하니 Wi-Fi에서 1-2분 정도 열어두세요.\n5. 이후 인터넷이 없어도 홈 화면 아이콘으로 열면 책과 Book3 음성이 작동합니다.\n\n검증 완료:\n- GitHub Pages 배포 성공\n- 앱/데이터/이미지/mp3/service worker 모두 `200` 응답 확인\n- 오프라인 캐시 목록에 Book1-3 이미지와 Book3 오디오 포함 확인", "source": "Codex · 019e8ead · L11229", "sourceType": "Codex", "label": {"en": "Response · editorial summary", "ko": "응답 · 편집 요약"}}, {"id": "a4-1567", "stage": "offline", "kind": "prompt", "role": "janet", "date": "9/4/26", "time": "05:50 KST", "summary": {"en": "It runs after downloading, but fails in airplane mode. Make a fresh offline launch work.", "ko": "내려받아 실행되지만 비행기 모드에서는 안 됩니다. 오프라인 재실행을 수정합니다."}, "original": "내려받았고, 잘 실행돼. 그런데 비행기모드로 하고 실행하면 안돼는데 비행기모드에서 사용가능하게 할 수 있어?", "source": "Codex · 019e8ead · L11379", "sourceType": "Codex", "label": {"en": "Revision prompt", "ko": "개선 요구 프롬프트"}}, {"id": "a4-1567r", "stage": "offline", "kind": "response", "role": "ai", "date": "9/4/26", "time": "", "summary": {"en": "The response reports explicit save progress and “Offline ready,” a smaller package, and offline MP3 support for Safari. A device check was still required.", "ko": "저장 진행률과 Offline ready 표시, 용량 축소, Safari 오프라인 MP3 지원을 반영했다고 보고했습니다. 실제 기기 확인은 별도로 필요했습니다."}, "original": "비행기 모드 지원 버전으로 수정하고 배포했습니다.\n\n[ECCR Picture Book 열기](https://jieunjanetsong.github.io/eccr-picture-audio-site/picturebook/)\n\n기존에 설치한 앱은 다음 순서로 업데이트하세요.\n\n1. 인터넷에 연결한 상태로 앱을 엽니다.\n2. 한 번 닫았다가 다시 엽니다.\n3. 하단의 `Saving …%`가 `Offline ready`로 바뀔 때까지 기다립니다.\n4. 앱을 완전히 닫고 비행기 모드에서 다시 실행합니다.\n\n오프라인 파일 용량은 약 70MB에서 21MB로 줄였습니다. Book 1~3 화면과 Book 3 녹음 음성이 저장되며, Safari의 오프라인 MP3 재생 방식도 지원합니다. 실제 iPhone 비행기 모드 최종 확인은 위 순서로 폰에서 진행해야 합니다.", "source": "Codex · 019e8ead · L11543", "sourceType": "Codex", "label": {"en": "Response · editorial summary", "ko": "응답 · 편집 요약"}}, {"id": "w733", "stage": "offline", "kind": "human", "role": "yaw", "date": "9/4/26", "time": "09:05:29", "summary": {"en": "Yaw confirms that it works on his phone with and without internet, while desktop offline playback still needs attention.", "ko": "야우는 폰에서 온라인·오프라인 모두 작동한다고 확인했습니다. 데스크탑 오프라인 소리는 추가 확인이 필요했습니다."}, "original": "It’s working perfectly on my phone, with or without internet connection. 😀 \n\nI am trying to find out how to get it done on my desktop. I now have it saved on my taskbar. With internet connection, it plays but without it, no sound.", "source": "_chat.txt · L2278 · message 765", "sourceType": "WhatsApp", "label": {"en": "Original conversation", "ko": "실제 대화"}}, {"id": "a4-1637", "stage": "offline", "kind": "prompt", "role": "janet", "date": "9/7/26", "time": "22:29 KST", "summary": {"en": "Book 4 and 5 audio sounds far too fast. Investigate and fix it.", "ko": "Book 4·5 음성이 너무 빠르게 들리는 문제를 확인하고 수정합니다."}, "original": "book 4, 5는 음성이 엄청 빠르게 재생되거든. 확인하고 수정해줘.", "source": "Codex · 019e8ead · L12860", "sourceType": "Codex", "label": {"en": "Revision prompt", "ko": "개선 요구 프롬프트"}}, {"id": "a4-1637r", "stage": "offline", "kind": "response", "role": "ai", "date": "9/7/26", "time": "", "summary": {"en": "The response identifies missing pauses between repeated readings. It restores 1.25-second gaps and resets playback rate to 1.0.", "ko": "반복 읽기 사이 쉼이 사라진 것이 원인이라고 설명했습니다. 1.25초 간격을 복원하고 재생속도를 1.0으로 초기화했습니다."}, "original": "Book 4·5 음성 속도 문제를 수정하고 배포했습니다.\n\n원인은 반복 녹음 사이의 쉼이 제거되어 문장들이 바로 붙어서 재생되던 것이었습니다. 반복 사이에 **1.25초 간격**을 복원했고, 브라우저 재생속도도 항상 `1.0`으로 초기화했습니다.\n\n앱 주소:\n\nhttps://jieunjanetsong.github.io/eccr-picture-audio-site/picturebook/\n\n기존에 오프라인 저장했다면 온라인 상태에서 앱을 다시 열고 **Save offline → Offline ready**가 될 때까지 기다려야 수정된 음성이 저장됩니다.", "source": "Codex · 019e8ead · L13097", "sourceType": "Codex", "label": {"en": "Response · editorial summary", "ko": "응답 · 편집 요약"}}, {"id": "a4-16 ype": "WhatsApp", "label": {"en": "Original conversation", "ko": "실제 대화"}}, {"id": "a2-70", "stage": "review", "kind": "prompt", "role": "janet", "date": "9/3/26", "time": "01:33 KST", "summary": {"en": "Update Book 2 with Yaw’s after-school sentence.", "ko": "Book 2에 방과 후 문장을 반영합니다."}, "original": "ECCR_Book_2.pdf에서는 /Users/janetmath/Ibjanetsong\\ Dropbox/Song\\ Janet/mina-janet/________아프리카-가나/가나교사와2026/야우/book/output/pdf/최종/ECCR_Book_2.pdf --->20페이지에서 wɔboa wɔ dwa so.를 Wɔpɔn a, wɔboa wɔ dwa so.로 수정해줘.", "source": "Codex · 01a05ec0 · L3059", "sourceType": "Codex", "label": {"en": "Original prompt", "ko": "제작 프롬프트"}}, {"id": "a2-70r", "stage": "review", "kind": "response", "role": "ai", "date": "9/3/26", "time": "", "summary": {"en": "The response locates the sentence on printed page 13 / PDF page 14, corrects it and preserves the source.", "ko": "인쇄 쪽 번호 13 / PDF 14쪽에서 해당 문장을 찾아 수정하고 원본을 보존했습니다."}, "original": "수정 완료했습니다. 원본의 20쪽은 표지여서, 해당 문구가 있는 PDF 14쪽(하단 표기 13)의 문장을 수정했습니다.\n\n`Wɔpɔn a, wɔboa wɔ dwa so.`로 변경했고, 문장이 페이지 안에 들어오도록 조정했습니다. 원본은 보존했습니다.\n\n:codex-file-citation{path=\"/Users/janetmath/Ibjanetsong Dropbox/Song Janet/mina-janet/________아프리카-가나/가나교사와2026/야우/book/output/pdf/a4/ECCR_Book_2_revised_v1.pdf\" purpose=\"output\"}", "source": "Codex · 01a05ec0 · L3304", "sourceType": "Codex", "label": {"en": "Response · editorial summary", "ko": "응답 · 편집 요약"}}, {"id": "w848", "stage": "review", "kind": "human", "role": "janet", "date": "9/10/26", "time": "02:41:25", "summary": {"en": "Janet forwards Gertrude’s review of wording, meanings and picture–text alignment.", "ko": "Janet이 Gertrude의 문구·의미·그림과 글 일치 검토 의견을 전달했습니다."}, "original": "ECCR Book 4\n\nWhy is the English version in parenthesis? Since it's a Twi-English book, the English version should be seen as important.\n\nBook 4 page 5\n\nThe English version should be specific. I suggest you stick with \n\" Aku likes the cat\"\n\nNot \"Aku likes the cat's story\" ×\n\nPage 6\n\nThe cat also likes Aku\n\nPage 7\nThe sentence in Twi means \nA cat is important \n\nBut \n\nThe cat is important \nShould have 'ne' introduced into the sentence.\n\n\nBook 5 Page 5\nAko nom nsuo \nMeans\nA parrot drinks water \nBut\nAko no nom nsuo \nMean \nThe parrot drinks water.\n\n(Please note that the use of 'a' and 'the' changes the meaning of a sentence.\n\nPage 6\nPecks is a huge word for Basic one.\n'eats' is fine.\n\nComprehension questions \nItem 2: the use of 'a' and 'the' affects the meaning of the sentence.\n\n\nBook 7 Page 3\nThe construction \" the cat sat\" is incomplete.\nYou could state \"the cat sat on the mat. The picture should reflect this.\n\nPage 4\nSam and the cat sat on the mat.\n\nPage 5\nThe cat ran after the rat.\n\nSam and the cat sat on the mat", "source": "_chat.txt · L2421 · message 880", "sourceType": "WhatsApp", "label": {"en": "Original conversation", "ko": "실제 대화"}}, {"id": "w857", "stage": "review", "kind": "human", "role": "yaw", "date": "9/11/26", "time": "10:49:24", "summary": {"en": "Yaw clarifies that the English was supplied to help Janet understand Twi, and should be removed from the learner book.", "ko": "야우는 영어가 Janet의 이해를 위한 뜻풀이였으며 학습자용 책에서는 빼야 한다고 명확히 했습니다."}, "original": "The English version I included was mainly to help you understand the meaning of the Twi sentence. I didn’t intend for it to appear beneath the Twi sentence in the learner’s book. At this stage, I would prefer the English to be left off completely. I want learners to focus on the phonics process: the sounds, blending, decoding and reading of the Twi text. Having the English sentence on the same page may tempt them to try decoding it too, which could create unnecessary difficulty or confusion before we deliberately introduce the English transition.\n\nSo keeping the English version in parenthesis was deliberately for understanding between us, but not for the learners.", "source": "_chat.txt · L2516 · message 889", "sourceType": "WhatsApp", "label": {"en": "Original conversation", "ko": "실제 대화"}}, {"id": "a2-277", "stage": "review", "kind": "prompt", "role": "janet", "date": "9/14/26", "time": "07:03 KST", "summary": {"en": "Read both review conversations and revise the main books.", "ko": "두 검토 대화를 읽고 본 교재를 수정합니다."}, "original": "/Users/janetmath/Downloads/_chat\\ 15.txt /Users/janetmath/Downloads/_chat\\ 14.txt 이 대화를 읽고, 본 교재를 수정해줘. /Users/janetmath/Ibjanetsong\\ Dropbox/Song\\ Janet/mina-janet/________아프리카-가나/가나교사와2026/야우/book/output/pdf/최종", "source": "Codex · 01a05ec0 · L8195", "sourceType": "Codex", "label": {"en": "Revision prompt", "ko": "개선 요구 프롬프트"}}, {"id": "a2-277r", "stage": "review", "kind": "response", "role": "ai", "date": "9/14/26", "time": "", "summary": {"en": "The continued response reports applying Yaw’s final language decision and revising Books 4–9. The saved revision note below records the exact changes.", "ko": "이어진 응답에서 야우의 최종 언어 결정과 Book 4–9 수정을 보고했습니다. 아래 저장된 수정 내역에서 구체적인 변경을 확인할 수 있습니다."}, "original": "수정 완료했습니다. Book 4–7은 원본을 백업한 뒤 최종 폴더에 반영했습니다.\n\n- Book 4·5: 영어 번역 삭제와 Twi 문장 교정.\n- Book 6: 영어 뜻풀이 삭제, Digraphs 용어 수정, 그림 확대.\n- Book 7: 문장 교정과 매트 위에 앉은 그림 반영.\n- Book 8·9: 대화의 교정을 적용한 별도 검토본 저장.\n\n전체 72페이지의 렌더링을 확인했습니다. 자세한 내용은 [수정 내역](\u003c/Users/janetmath/Ibjanetsong Dropbox/Song Janet/mina-janet/________아프리카-가나/가나교사와2026/야우/book/output/pdf/최종/REVISION_NOTES_20260914.md>)에 정리했습니다.\n\n수정된 교재는 :codex-file-citation{path=\"/Users/janetmath/Ibjanetsong Dropbox/Song Janet/mina-janet/________아프리카-가나/가나교사와2026/야우/book/output/pdf/최종/ECCR_Book_4.pdf\" purpose=\"output\"}, :codex-file-citation{path=\"/Users/janetmath/Ibjanetsong Dropbox/Song Janet/mina-janet/________아프리카-가나/가나교사와2026/야우/book/output/pdf/최종/ECCR_Book_5.pdf\" purpose=\"output\"}, :codex-file-citation{path=\"/Users/janetmath/Ibjanetsong Dropbox/Song Janet/mina-janet/________아프리카-가나/가나교사와2026/야우/book/output/pdf/최종/ECCR_Book_6.pdf\" purpose=\"output\"}, :codex-file-citation{path=\"/Users/janetmath/Ibjanetsong Dropbox/Song Janet/mina-janet/________아프리카-가나/가나교사와2026/야우/book/output/pdf/최종/ECCR_Book_7.pdf\" purpose=\"output\"}입니다.\n\n별도 검토본은 :codex-file-citation{path=\"/Users/janetmath/Ibjanetsong Dropbox/Song Janet/mina-janet/________아프리카-가나/가나교사와2026/야우/book/output/pdf/최종/Book8_9_review_20260914/ECCR_Book_8_revised_20260914.pdf\" purpose=\"output\"}, :codex-file-citation{path=\"/Users/janetmath/Ibjanetsong Dropbox/Song Janet/mina-janet/________아프리카-가나/가나교사와2026/야우/book/output/pdf/최종/Book8_9_review_20260914/ECCR_Book_9_revised_20260914.pdf\" purpose=\"output\"}입니다.\n\n- :codex-followup[평가책 반영]{prompt=\"이번 본 교재 수정에 맞춰 해당 Assessment도 수정해줘.\"}\n- :codex-followup[앱·음성 대조]{prompt=\"수정 교재와 앱·음성을 대조해서 동기화가 필요한 부분을 정리해줘.\"}\n- :codex-followup[Book 8·9 디자인 통일]{prompt=\"Book 8·9의 표지, 속지, 마지막 페이지를 Book 1–7과 같은 규칙으로 통일해줘.\"}", "source": "Codex · 01a05ec0 · L8460", "sourceType": "Codex", "label": {"en": "Response · editorial summary", "ko": "응답 · 편집 요약"}}, {"id": "revision-note", "stage": "review", "kind": "document", "role": "record", "date": "9/14/26", "time": "", "summary": {"en": "The saved revision record confirms Twi-only learner editions for Books 4–6, “Digraphs,” corrected sentences, and Book 7 illustrations aligned with the mat text.", "ko": "저장된 수정 기록은 Book 4–6 영어 제거, Digraphs 명칭, 문장 교정, 매트 문장에 맞춘 Book 7 그림 수정을 확인합니다."}, "original": "# ECCR textbook revisions — 14 September 2026\n\n## 기준과 범위 / Basis and scope\n\n`_chat 14.txt`의 Gertrude 의견과 `_chat 15.txt`의 Yaw 답변을 대조했습니다. 의견이 달랐던 부분은 Yaw가 최종 확인한 문장을 적용했습니다. 본 교재 수정이며 평가책, 쓰기책, 앱과 음성 파일은 이번 작업에 포함하지 않았습니다.\n\nBook 4–7은 `최종/ECCR_Book_N.pdf`를 원본으로 사용했습니다. Book 8·9는 최종 폴더에 없어서 기존 `a4/ECCR_Book_8_A4_print.pdf`, `a4/ECCR_Book_9_A4_print.pdf`로 별도 검토 수정본을 만들었습니다. 해당 두 권의 기존 표지·속지 디자인은 이번 내용 교정에서 유지했습니다.\n\n페이지 표기는 책에 인쇄된 번호 기준입니다. 아래 본문 페이지의 실제 PDF 순번은 인쇄 번호보다 1 큽니다.\n\n## 수정 내용\n\n| 책 | 인쇄 페이지 | 반영 사항 |\n|---|---|---|\n| 4 | 표지, 2–9 | 9월 11일 Yaw 의견에 따라 학습자용 영어 번역을 삭제. 표지 언어를 Asante Twi로 정리하고 질문 페이지도 Twi만 표시. |\n| 4 | 7 | `Ɔkra ho hia.` → `Ɔkra no ho hia.`. Gertrude 메시지의 `ne` 대신 9월 4일 Yaw가 명시한 `no`를 사용. |\n| 5 | 표지, 2–8 | 학습자용 영어 번역 삭제. 표지 언어를 Asante Twi로 정리. |\n| 5 | 5 | `Ako nom nsuo.` → `Ako no nom nsuo.` |\n| 5 | 8, 질문 2 | 이야기 속 특정 앵무새를 가리키도록 `Aduane bɛn na ako no di?`로 정리. Gertrude의 a/the 지적과 Yaw의 필요한 수정 동의를 반영한 편집. |\n| 6 | 표지·속지·1–9 | Twi 학습 집중 원칙을 letter cards에도 적용해 영어 뜻풀이 제거. `Consonant blends` → `Digraphs` (Yaw의 5월 14일 원안과 9월 3일 설명). Twi 예시와 9개 digraph는 유지하고 그림을 확대 배치. |\n| 7 | 3 | `The cat sat on the mat.`. 고양이가 실제로 매트에 앉아 있도록 그림 수정. |\n| 7 | 4 | `Sam and the cat sat on the mat.`. 두 캐릭터 모두 매트 위에 있도록 그림 수정. |\n| 7 | 5 | `The cat ran after the rat.` 및 `Sam and the cat sat on the mat.` |\n| 7 | PDF 10·11 | 원본의 잘못된 빈 content 참조를 제거하고, 꼬마 캐릭터를 유지하면서 빈 페이지의 크림색 배경과 테두리 복원. |\n| 8 | 3 | `Here are Sam and Ama. Sam is a boy. He is sitting on the mat. Ama is a girl. She is sitting beside the mat.` |\n| 8 | 4 | 제목 `They Can See the Cat`. 본문 `He can see the cat. She can see the cat too.` |\n| 8 | 6 | `The duck was glad to see them.` |\n| 9 | 2 | 첫 문단에 `They had a son called Baah.` 반영 (`call`의 문법 교정 포함). |\n| 9 | 5 | `But one day the mother returned at midday.`로 대명사의 지칭 대상 명확화. |\n| 9 | 6 | `Oh, no!`로 수정하고, Yaw의 9월 11일 최종 문장에 따라 `... with a terrible howl, the mother ran into the house.` 반영. |\n| 9 | 8 | `Oh, oh` → `Oh, no!` |\n\n## 기존 반영 확인 / Already reflected\n\nBook 1의 `Mekɔ sukuu.`, `M’AKYERƐKYERƐFOƆ`, ADESUA의 `Metwerɛ m’adeɛ yie.`, 오른손을 든 학생과 Akenkan 칠판 내용을 확인했습니다. Book 2의 9월 수정 문장(`Ama twerɛ ne din.`, `Wɔpɔn a, wɔboa wɔ dwa so.`, `Anwummerɛ` 등)은 최종본에 이미 반영되어 있습니다. Book 3은 Yaw가 9월 3일 검토 완료로 확인했으며 이후 해당 교재 내용 교정은 없습니다.\n\n## Teacher reference only — English meanings\n\nThe learner editions of Books 4–6 now focus on Twi, following Yaw's 11 September instruction. The English corrections therefore belong in a teacher reference, rather than beneath the Twi learner text:\n\n- Book 4, printed p5: **Aku likes the cat.**\n- Book 4, printed p6: **The cat also likes Aku.**\n- Book 4, printed p7: **The cat is important.**\n- Book 5, printed p5: **The parrot drinks water.**\n- Book 5, printed p6: **The parrot eats maize.** (Use *eats*, not *pecks*, for the proposed Basic 1 English wording.)\n- Book 5, question 2: **What food does the parrot eat?**\n\nThese are meanings, not pronunciation guidance. No letter pronunciations were generated or guessed.\n\n## 후속 제작 제안 / Future development identified in the chats\n\nYaw가 제안한 Book 0(단일 글자 소리), a–z와 ɛ·ɔ 카드, 4글자 이내의 짧은 단어 중심 영어 decodable reader는 별도의 신규 교재 제작에 해당합니다. 본 교재를 그 제안으로 대체하거나 새 책 번호를 부여하지 않았습니다. 수정된 본문과 연결된 평가책 및 앱·음성은 이후 이 수정본에 맞추어 동기화할 수 있습니다.\n\n## 검증 및 재현 / Verification and reproduction\n\n수정 6권은 각 12페이지 A4 세로이며, 전체 72페이지를 렌더링했습니다. 수정 페이지의 글자·줄바꿈·본문 상자와 두 그림을 시각 점검했습니다. Poppler로 Book 6, Book 7의 복원 빈 페이지, Book 9의 긴 문단도 확인했습니다. PDF 스트림 검사와 MuPDF 전체 렌더에서 경고가 없었습니다. 원본 경로와 SHA-256은 `source_manifest.json`에 기록했습니다.\n\n편집 코드: `revise_books.py`. 원본을 보존한 상태에서 실행합니다. 최종 폴더 적용은 별도 `install_revisions.py`가 원본 해시를 확인하고 백업 후 수행합니다.\n\n그림은 기본 내장 imagegen을 사용했습니다. 프로젝트 자산은 같은 폴더의 `cat_on_mat.png`, `sam_and_cat_on_mat.png`입니다. 프롬프트의 핵심은 각각 ‘기존 고양이와 배경을 유지하고 고양이 아래에 매트를 추가’, ‘기존 샘과 고양이를 유지하고 같은 매트를 샘의 발·무릎 아래까지 확장’입니다. 전체 제작 프롬프트는 `IMAGE_PROMPTS.md`에 기록했습니다.\n", "source": "book/output/pdf/최종/REVISION_NOTES_20260914.md", "sourceType": "Document", "label": {"en": "Saved production record", "ko": "저장된 제작 기록"}}, {"id": "a2-304", "stage": "print", "kind": "prompt", "role": "janet", "date": "9/15/26", "time": "08:53 KST", "summary": {"en": "Prepare two editions of Books 1–9: no blank pages for the audio app, and a separate bond-binding print layout.", "ko": "Book 1–9를 앱용 빈 페이지 제거판과 본드 제본용 인쇄판으로 나누어 제작합니다."}, "original": "이제, 두가지를 더 만들거야. 1. 오디오앱에 넣을 빈 종이 없는 버전 2. 본드 제본 인쇄를 위한 편집 버전 . 책 1-9에 대해 모두 만들어줘. 폴더를 따로 제작해줘.", "source": "Codex · 01a05ec0 · L8769", "sourceType": "Codex", "label": {"en": "Original prompt", "ko": "제작 프롬프트"}}, {"id": "a2-304r", "stag g Dropbox/Song Janet/mina-janet/________아프리카-가나/가나교사와2026/야우/book/output/pdf/최종/ECCR_Book_7.pdf\" purpose=\"output\"} :codex-file-citation{path=\"/Users/janetmath/Ibjanetsong Dropbox/Song Janet/mina-janet/________아프리카-가나/가나교사와2026/야우/book/output/pdf/최종/ECCR_Book_8.pdf\" purpose=\"output\"} :codex-file-citation{path=\"/Users/janetmath/Ibjanetsong Dropbox/Song Janet/mina-janet/________아프리카-가나/가나교사와2026/야우/book/output/pdf/최종/ECCR_Book_9.pdf\" purpose=\"output\"}", "source": "Codex · 01a05ec0 · L9857", "sourceType": "Codex", "label": {"en": "Response · editorial summary", "ko": "응답 · 편집 요약"}}, {"id": "a2-345", "stage": "print", "kind": "prompt", "role": "janet", "date": "9/19/26", "time": "12:54 KST", "summary": {"en": "The writing lines are too far apart. Match ordinary English-notebook proportions.", "ko": "쓰기 줄 간격이 너무 넓어 일반 영어 노트 비율에 맞춥니다."}, "original": "/Users/janetmath/Ibjanetsong\\ Dropbox/Song\\ Janet/mina-janet/________아프리카-가나/가나교사와2026/야우/book/output/pdf/최종/Writing_Book.pdf ---->줄 간격이 너무 커 . 일반 영어 노트비율로 선을 그어줘.", "source": "Codex · 01a05ec0 · L9948", "sourceType": "Codex", "label": {"en": "Revision prompt", "ko": "개선 요구 프롬프트"}}, {"id": "a2-345r", "stage": "print", "kind": "response", "role": "ai", "date": "9/19/26", "time": "", "summary": {"en": "Line spacing changed from 6.3 mm to 2.5 mm; a four-line set became 7.5 mm high. The 40-page notebook was retained.", "ko": "줄 간격을 6.3mm에서 2.5mm로 줄여 4선 한 세트 높이를 7.5mm로 맞췄습니다. 40쪽 구성은 유지했습니다."}, "original": "수정했습니다. 선 사이를 **6.3mm → 2.5mm**로 좁혀, 4선 한 세트 높이를 **7.5mm**로 맞췄습니다.\n\n내지는 페이지당 12세트이며, 빨강·검정 선과 이름란, 총 40페이지 구성을 유지했습니다. A4 인쇄 시 **실제 크기(100%)**로 출력하세요.\n\n수정본: :codex-file-citation{path=\"/Users/janetmath/Ibjanetsong Dropbox/Song Janet/mina-janet/________아프리카-가나/가나교사와2026/야우/book/output/pdf/최종/Writing_Book.pdf\" purpose=\"output\"}", "source": "Codex · 01a05ec0 · L9992", "sourceType": "Codex", "label": {"en": "Response · editorial summary", "ko": "응답 · 편집 요약"}}, {"id": "w1013", "stage": "print", "kind": "human", "role": "janet", "date": "9/19/26", "time": "12:28:06", "summary": {"en": "Janet considers combining Books 1–9 into a single bound volume.", "ko": "Janet이 Book 1–9를 하나의 책으로 묶는 방안을 검토했습니다."}, "original": "Since the materials are going to be bound, I was thinking of combining Books 1 through 9 into a single book, with each current book treated as a separate chapter.", "source": "_chat.txt · L2816 · message 1045", "sourceType": "WhatsApp", "label": {"en": "Original conversation", "ko": "실제 대화"}}, {"id": "w1015", "stage": "print", "kind": "human", "role": "yaw", "date": "9/19/26", "time": "12:35:02", "summary": {"en": "Yaw asks to keep the books separate and introduce each only when a learner is ready.", "ko": "야우는 학습자가 준비되었을 때 각 권을 제공할 수 있도록 낱권 유지를 요청했습니다."}, "original": "I understand. We have agreed not to use all the books in term 1. It’s only when the learner is ready for that book then we introduce them. \n\nHaving all of them in one book might compel them to flip those pages. Besides, they may even destroy a page that is not in use at the moment. When such happens, it affects the whole bundle.\n\nI suggest we make our books available only when the learners are ready to use them. ‎\u003cThis message was edited>", "source": "_chat.txt · L2820 · message 1047", "sourceType": "WhatsApp", "label": {"en": "Original conversation", "ko": "실제 대화"}}, {"id": "w1016", "stage": "print", "kind": "human", "role": "janet", "date": "9/19/26", "time": "12:40:46", "summary": {"en": "Janet agrees: keep them separate and introduce them according to readiness.", "ko": "Janet이 낱권으로 유지하고 준비도에 맞춰 제공하는 데 동의했습니다."}, "original": "I understand. Let’s keep the books separate and introduce each one when the learners are ready. ‎\u003cThis message was edited>", "source": "_chat.txt · L2825 · message 1048", "sourceType": "WhatsApp", "label": {"en": "Original conversation", "ko": "실제 대화"}}, {"id": "w860", "stage": "practice", "kind": "human", "role": "yaw", "date": "9/11/26", "time": "11:30:56", "summary": {"en": "Yaw proposes one illustration with connected, mostly decodable sentences, using words of at most four letters.", "ko": "야우는 그림 하나와 연결된 문장, 최대 네 글자 길이의 단어로 읽는 reader를 제안했습니다."}, "original": "I propose that we have a book with at most 4 letter words sentences that are mostly DECODABLE.\n\nThe cover page is just like the previous design, but inside it has one picture or illustration, with sentences like:\n\nKim is a vet. He has a pet. The pet is a cat. Kim pats the cat. The cat runs. It runs to the dog.\n\n\nAnother page could have a different illustration with similar idea. These readers build the confidence I want to see in my learners as we progress.\n\n\n😀When I had not met you, I would be having these simple sentences in my one designed card, neatly written with permanent markers. But, they don’t last. Thank you for this amazing resources. My classroom will be more engaging than ever.", "source": "_chat.txt · L2538 · message 892", "sourceType": "WhatsApp", "label": {"en": "Original conversation", "ko": "실제 대화"}}, {"id": "a2-360", "stage": "practice", "kind": "prompt", "role": "janet", "date": "9/19/26", "time": "13:52 KST", "summary": {"en": "Build Book 0 around sound recognition → blending → words → sentences → connected reading.", "ko": "음가 인식 → 블렌딩 → 낱말 → 문장 → 연결된 읽기로 Book 0을 구성합니다."}, "original": "다음 내용을 바탕으로 Book 0를 만들어줘. 좋아. 야우가 지금까지 말한 흐름을 그대로 살리면, 이 책은 **일반적인 영어 파닉스 교재**라기보다 **ECCR의 sound-first 수업을 학생이 손에 들고 따라갈 수 있게 만든 ‘기초 음가 학습책’**으로 만드는 게 좋아.\n\n야우가 계속 강조한 순서는 **letter/sound recognition → blending → decodable words → simple sentences → connected reading**이었어. 또 처음부터 letter cards와 sound cards를 따로 쓰려고 했기 때문에, 이 책은 카드의 대체물이 아니라 **카드 수업 뒤에 학생이 연습하고 기록하는 Learner Phonics Material Book**으로 두는 게 가장 자연스러워.  \n\n## ECCR Phonics Material Book\n\n### Sounds, Blending and Early Reading\n\n**Basic 1 Learner Book**\n\n### 전체 구조\n\n책을 크게 5단계로 나누면 좋아.\n\n**Part 1. I Hear the Sound**\n소리를 듣고 구별하기\n\n**Part 2. I Know the Letter**\n소리와 문자를 연결하기\n\n**Part 3. I Blend Sounds**\n2개 또는 3개 소리를 연결해 읽기\n\n**Part 4. I Read Words and Sentences**\ndecodable word와 짧은 문장 읽기\n\n**Part 5. I Can Read**\n아주 짧은 decodable text 읽기\n\n---\n\n# 1. 첫 부분: How We Learn Sounds\n\n학생용 설명은 아주 짧게.\n\n### I listen.\n\n### I say.\n\n### I point.\n\n### I trace.\n\n### I write.\n\n### I blend.\n\n### I read.\n\n그림 아이콘을 붙여서 아이가 글을 잘 못 읽어도 활동 순서를 알 수 있게 해.\n\n---\n\n# 2. Sound Unit의 기본 구조\n\n**한 sound당 4페이지 정도**가 가장 좋아 보여.\n\n야우가 한 주에 보통 한 sound, 때로 두 sound를 가르친다고 했으니까, 각 sound가 독립적인 작은 unit처럼 보여야 해. \n\n예를 들어 `/a/`라면:\n\n## Page 1 — Meet the Sound\n\n# a\n\n**Sound: /a/**\n\n큰 `a` 하나.\n\n그 아래 그림 3개 정도:\n\n* ant\n* apple\n* bag\n\n여기서 핵심은 **alphabet name “A”를 외우게 하는 페이지가 아니라 sound를 먼저 인식하게 하는 것**이야.\n\n야우도 아이들이 A–Z 이름은 알면서 읽지 못하는 문제를 지적했었어. \n\n활동:\n\n**Listen and say.**\n/a/ /a/ /a/\n\n**Point to the pictures with /a/.**\n\n---\n\n## Page 2 — See and Write\n\n큰 글자:\n\n**A a**\n\n활동:\n\nTrace:\n\n`a   a   a   a`\n\nWrite:\n\n`__  __  __  __`\n\n그리고:\n\n**Circle a**\n\n예:\n\na   m   s   a   t   a\n\n---\n\n## Page 3 — Blend\n\n여기서 letter cards와 연결.\n\n예:\n\n**m + a = ma**\n\n**s + a = sa**\n\n**f + a = fa**\n\n그리고 화살표:\n\nm → a\n**ma**\n\n이 부분은 Twi first라면 야우가 제시한 방식처럼 아주 짧은 blending을 사용하면 돼.\n\n그가 예로 들었던:\n\n* Fa bi na kɔ.\n* Yi bi di.\n* Sa bi we.\n* Tu bi gu.\n* Ma me bi.\n\n같은 구조가 이 단계와 연결돼. \n\n---\n\n## Page 4 — Read\n\n### Read the words\n\nma\nfa\nsa\n\n### Read the sentence\n\nMa me bi.\n\n또는 해당 sound 단계에서 읽을 수 있는 아주 짧은 문장.\n\n마지막:\n\n⭐ **I can read this sound.**\n\n□ Yes\n□ I need more practice\n\n---\n\n# 3. Asante Twi Sound Section\n\n이 책의 앞부분은 **L1인 Asante Twi를 먼저** 두는 게 ECCR 철학에 더 잘 맞아.\n\n야우도 L1 sound knowledge를 먼저 만들고 이후 English로 넘어가는 구조를 반복해서 이야기했어. \n\n구성은:\n\n### Unit 1\n\nTwi vowel sounds\n\na\ne\nɛ\ni\no\nɔ\nu\n\n각각 4페이지.\n\n그 다음:\n\n### Unit 2\n\nSingle consonant sounds\n\nYaw가 실제로 사용할 letter inventory를 최종 확인해서 넣어야 해.\n\n여기서는 내가 임의로 Ghana/Twi alphabet을 완성해서 넣는 것보다는 **Yaw가 직접 확정한 letter list를 기준으로 제작**하는 게 맞아.\n\n---\n\n# 4. Digraph Section\n\n야우가 이미 제시한 digraph가 있어:\n\n* ky\n* gy\n* hy\n* ny\n* tw\n* dw\n* kw\n* hw\n* nw \n\n이건 별도 챕터로 두면 좋아.\n\n## Example\n\n### ky\n\n**Say:** ky\n\n**Read:**\n\nkyɛ\n\n그림:\n\nshare / 나눠주는 장면\n\n활동:\n\nCircle:\n\nky   ka   ma   ky\n\nWrite:\n\nky ______\n\nRead:\n\nkyɛ\n\n---\n\n# 5. Blending Booklet Section\n\nletter sounds를 충분히 배운 뒤에는 페이지 형태가 바뀌어야 해.\n\n## Stage 1 — Two-part blending\n\nFa\nMa\nSa\nYi\nDi\n\n---\n\n## Stage 2 — Short words\n\n아이들이 이미 배운 sounds만 사용.\n\n큰 원칙:\n\n**아직 배우지 않은 sound를 word에 넣지 않는다.**\n\n---\n\n## Stage 3 — Decodable sentences\n\n야우가 원했던 핵심이야.\n\n그는 영어에서도:\n\n> Pat is a vet.\n> Pat has a mat.\n> Pat sits on it.\n\n처럼 **배운 sound로 읽을 수 있는 문장**을 원했어. \n\n그래서 각 unit 마지막에는 반드시:\n\n### I can read a sentence.\n\n형태가 들어가면 좋아.\n\n---\n\n# 6. English Bridge Section\n\nTwi sound/blending이 안정된 후 영어로 넘어가는 부분.\n\n이걸 책 뒤쪽에 넣어.\n\n# Let's Read in English\n\n## Short vowel a\n\n### Sound\n\n/a/\n\n### Words\n\ncat\nmat\nbag\ncap\n\n### Sentences\n\nSam has a cap.\nThe cat sat.\nSam has a bag.\n\n그 다음에는 야우가 이미 구상했던 **Sam and the Cat** 같은 별도 reader로 연결.\n\n즉 이 Phonics Material Book이 끝난 뒤:\n\n**Phonics Material Book → Book 7 / short vowel readers**\n\n로 연결되는 구조야. 야우가 short vowel별로 작은 reader를 만들자는 구상을 했던 것도 이 흐름이야. \n\n---\n\n# 7. Review Pages\n\n5~6 sounds마다 한 번씩 Review.\n\n예:\n\n## I Remember My Sounds\n\nListen and circle.\n\na / e / i\n\nMatch:\n\na → 그림\ne → 그림\n\nBlend:\n\nm + a = ___\n\nRead:\n\nma\nfa\nsa\n\nWrite:\n\n---\n\n---\n\n# 8. Progress Check\n\n여기서 **research assessment가 아니라 classroom learning check**로 만들어.\n\n### My Sound Check\n\n| Skill                              | Yes | Not Yet |\n| ---------------------------------- | --- | ------- |\n| I can say the sound.               | □   | □       |\n| I can find the letter.             | □   | □       |\n| I can write the letter.            | □   | □       |\n| I can blend it with another sound. | □   | □       |\n| I can read a word.                 | □   | □       |\n\n교사용 observation에도 사용할 수 있어.\n\n---\n\n# 9. 책 전체의 권장 구성\n\n나는 첫 버전을 약 **60–80페이지** 정도로 만들 것 같아.\n\n예:\n\n**Front matter**\n4 pages\n\n**Twi vowels**\n7 sounds × 4 pages = 28 pages\n\n**Core consonants**\n선정된 핵심 consonants 중 Term 1용 6~8개 × 3 pages\n약 18–24 pages\n\n**Blending practice**\n8 pages\n\n**Review / Progress Check**\n6 pages\n\n총 약 **64–70 pages**\n\n처음부터 모든 alphabet과 모든 digraph를 다 넣어서 두껍게 만들 필요는 없어.\n\n오히려 야우가 지금 말한 것처럼 **learner readiness에 따라 필요한 책을 제공한다**는 철학을 적용해서:\n\n### Phonics Material Book 1\n\n**First Sounds and Blending**\n\n### Phonics Material Book 2\n\n**More Sounds and Digraphs**\n\n로 나누는 것도 좋아.\n\n---\n\n## 특히 중요한 점\n\n이 책은 **Book 1–9 중 하나의 storybook처럼 만들면 안 돼.**\n\n역할이 달라.\n\n**Storybooks / readers**\n→ 읽기 경험\n\n**Practice Book**\n→ 읽기·쓰기 연습\n\n**Phonics Material Book**\n→ sound mastery + blending의 체계적 연습\n\n**Letter/sound cards**\n→ 교사가 조작하면서 가르치는 수업 도구\n\n그래서 ECCR 자료체계는 최종적으로 이렇게 정리가 돼:\n\n**Teacher:** Teacher’s Guide + Letter/Sound Cards + Word Cards\n**Learner:** Phonics Material Book + Reading Books + Practice/Writing Book\n**Classroom:** Word Wall + Board Materials\n**Digital:** ECCR Audio App\n\n이 구조가 야우가 지금까지 설명해온 수업 방식과 가장 잘 맞아.\n\n내가 만든다면 제목도 그냥 `Phonics Book`보다는 **`ECCR First Sounds & Blending`**으로 할 것 같아. 부제로 `Basic 1 Phonics and Early Reading Practice Book`을 붙이면 좋아.", "source": "Codex · 01a05ec0 · L10176", "sourceType": "Codex", "label": {"en": "Original prompt", "ko": "제작 프롬프트"}}, {"id": "a2-360r", "stage": "practice", "kind": "response", "role": "ai", "date": "9/19/26", "time": "", "summary": {"en": "An 80-page foundational practice book was created as a draft for Yaw to review, with sound and vocabulary choices still needing his validation.", "ko": "야우 검토용 80쪽 기초 연습책 초안을 제작했습니다. 음가·그림 낱말 등은 야우 확인이 필요했습니다."}, "original": "**Book 0 — ECCR First Sounds & Blending**을 A4 80페이지로 제작해 ‘최종’ 폴더에 저장했습니다. :codex-file-citation{path=\"/Users/janetmath/Ibjanetsong Dropbox/Song Janet/mina-janet/________아프리카-가나/가나교사와2026/야우/book/output/pdf/최종/ECCR_Book_0.pdf\" purpose=\"output\"}\n\n모음 7개 → 핵심 자음 6개 → 블렌딩·문장 읽기 → digraph 9개 → English Bridge로 구성했습니다. 기존 시리즈 디자인과 4선 쓰기란, 홀짝 페이지번호를 적용했습니다.\n\n**야우 검토용 초안**입니다. 자음 목록·음가·그림 낱말은 확인이 필요하며, 검토 안내서도 함께 저장했습니다.\n\n- :codex-followup[야우에게 검토 요청]{prompt=\"Book 0 검토를 야우에게 부탁하는 영어 메시지를 작성해줘.\"}\n- :codex-followup[교사용 지도안]{prompt=\"Book 0 초안에 맞춰 교사용 수업 지도안을 만들어줘. 미확정 음가는 추측하지 마.\"}\n- :codex-followup[제본용 편집]{prompt=\"Book 0를 본드 제본용으로 편집해줘. 원본은 유지하고 별도 파일로 만들어줘.\"}", "source": "Codex · 01a05ec0 · L10368", "sourceType": "Codex", "label": {"en": "Response · editorial summary", "ko": "응답 · 편집 요약"}}, {"id": "a2-367", "stage": "practice", "kind": "prompt", "role": "janet", "date": "9/19/26", "time": "15:15 KST", "summary": {"en": "Check whether Book 0 truly matches Yaw’s “one picture + connected short sentences” request.", "ko": "Book 0이 야우의 “그림 하나 + 연결된 짧은 문장” 요청을 충족하는지 확인합니다."}, "original": "I propose that we have a book with at most 4 letter words sentences that are mostly DECODABLE.\n\nThe cover page is just like the previous design, but inside it has one picture or illustration, with sentences like:\n\nKim is a vet. He has a pet. The pet is a cat. Kim pats the cat. The cat runs. It runs to the dog.\n\n\nAnother page could have a different illustration with similar idea. These readers build the confidence I want to see in my learners as we progress.\n\n\n😀When I had not met you, I would be having these simple sentences in my one designed card, neatly written with permanent markers. But, they don’t last. Thank you for this amazing resources. My classroom will be more engaging than ever. 이 내용이 충분히 반영됐어?", "source": "Codex · 01a05ec0 · L10375", "sourceType": "Codex", "label": {"en": "Revision prompt", "ko": "개선 요구 프롬프트"}}, {"id": "a2-367r", "stage": "practice", "kind": "response", "role": "ai", "date": "9/19/26", "time": "", "summary": {"en": "The response acknowledges a gap: Book 0 is mainly a practice workbook, not a connected-text reader. It clarifies that four letters means word length, not four words per sentence.", "ko": "응답은 Book 0이 연결된 글을 읽는 reader보다 연습책에 가깝다는 차이를 인정했습니다. 네 글자는 문장당 단어 수가 아닌 단어의 길이라는 점도 짚었습니다."}, "original": "**일부는 반영됐지만, 야우가 말한 형태를 충분히 구현했다고 보기는 어렵습니다.** 제가 만든 Book 0는 음가·쓰기·블렌딩 **연습책** 중심이고, 이번 제안은 아이가 짧은 이야기를 스스로 읽는 **reader**에 더 가깝습니다.\n\n실제 Book 0를 확인하면:\n\n- PDF 78페이지: 그림 여러 개에 문장 하나씩 배치했습니다. ‘한 그림과 연결된 여러 문장’ 구성은 아닙니다.\n- PDF 79페이지: 한 그림과 짧은 문장 3개가 있지만, 이런 읽기 페이지가 충분히 반복되지 않습니다.\n- 짧은 단어는 사용했지만, 야우가 예시로 준 것처럼 인물과 행동이 이어지는 이야기 구성은 부족합니다.\n\n여기서 **“at most 4 letter words”는 문장당 네 단어가 아니라, 각 단어가 최대 네 글자라는 뜻**입니다. 또 짧은 단어라고 모두 decodable한 것은 아니므로, 이미 배운 음가로 읽을 수 있는지 별도로 확인해야 합니다.\n\n따라서 야우의 의도를 충실히 반영하려면, **기존 Book 0는 기초 연습책으로 유지하고 별도의 첫 단계 reader를 만드는 것이 적합합니다.** 기존 표지를 유지하면서 매 페이지에 그림 하나와 연결된 짧은 문장 4–6개를 넣고, 단어 길이는 최대 네 글자로 제한하며 배운 음가를 반복하도록 구성하면 됩니다.\n\n아직 파일은 수정하지 않았습니다.", "source": "Codex · 01a05ec0 · L10385", "sourceType": "Codex", "label": {"en": "Response · editorial summary", "ko": "응답 · 편집 요약"}}, {"id": "a2-370", "stage": "practice", "kind": "prompt", "role": "janet", "date": "9/19/26", "time": "15:16 KST", "summary": {"en": "Keep existing files and create an additional reader that matches Yaw’s message.", "ko": "기존 파일을 유지하고 야우의 의도에 맞는 별도 reader를 만듭니다."}, "original": "파일을 수정하지 말고, 야우의 메시지에 맞는 파일을 하나 더 생성해줘.", "source": "Codex · 01a05ec0 · L10392", "sourceType": "Codex", "label": {"en": "Revision prompt", "ko": "개선 요구 프롬프트"}}, {"id": "a2-370r", "stage": "practice", "kind": "response", "role": "ai", "date": "9/19/26", "time": "", "summary": {"en": "A 12-page “I Can Read” reader was produced with one illustration and five or six connected sentences per reading page.", "ko": "읽기 페이지마다 그림 하나와 연결된 5–6문장을 담은 12쪽 I Can Read를 제작했습니다."}, "original": "기존 Book 0–9는 수정하지 않고, **별도 reader 「I Can Read」 12페이지**를 제작했습니다. :codex-file-citation{path=\"/Users/janetmath/Ibjanetsong Dropbox/Song Janet/mina-janet/________아프리카-가나/가나교사와2026/야우/book/output/pdf/최종/ECCR_I_Can_Read_Short_Word_Reader.pdf\" purpose=\"output\"}\n\n- 읽기 페이지마다 **그림 하나 + 연결된 문장 5–6개**\n- 본문의 모든 단어는 **최대 네 글자**\n- 야우의 “Kim is a vet…” 예문 그대로 포함\n- 별도 지도가 필요한 단어는 교사용 안내에 표시\n\n새 삽화 5개는 내장 이미지 생성으로 제작했습니다. [삽화 파일·프롬프트 안내](\u003c/Users/janetmath/Ibjanetsong Dropbox/Song Janet/mina-janet/________아프리카-가나/가나교사와2026/야우/book/output/pdf/a4/short_word_reader_20260919/README.md>)\n\n- :codex-followup[야우 검토 요청]{prompt=\"이 reader를 야우에게 보내면서 음가와 읽기 난이도 검토를 부탁하는 영어 메시지를 작성해줘.\"}\n- :codex-followup[오디오용 대본]{prompt=\"이 reader의 본문으로 페이지별 오디오 녹음 대본을 만들어줘.\"}\n- :codex-followup[수업용 카드]{prompt=\"이 reader와 연결되는 교사용 단어 카드를 별도 PDF로 만들어줘.\"}", "source": "Codex · 01a05ec0 · L10499", "sourceType": "Codex", "label": {"en": "Response · editorial summary", "ko": "응답 · 편집 요약"}}, {"id": "a2-382", "stage": "practice", "kind": "prompt", "role": "janet", "date": "9/19/26", "time": "16:00 KST", "summary": {"en": "Combine the materials as Book 0 and preserve the earlier edition as Book 0-pre.", "ko": "자료를 Book 0으로 합치고 기존 판본은 Book 0-pre로 보존합니다."}, "original": "응 책 이름은 book 0으로 해줘. 기존이름을 book 0-pre 라고 해주고", "source": "Codex · 01a05ec0 · L10565", "sourceType": "Codex", "label": {"en": "Revision prompt", "ko": "개선 요구 프롬프트"}}, {"id": "a2-382r", "stage": "practice", "kind": "response", "role": "ai", "date": "9/19/26", "time": "", "summary": {"en": "A 90-page combined Book 0 was produced; the previous 80-page version was preserved as Book 0-pre.", "ko": "90쪽 합본 Book 0을 제작하고 기존 80쪽은 Book 0-pre로 보존했습니다."}, "original": "완료했습니다.\n\n**Book 0 — 90페이지 합본:** 기존 학습편과 「I Can Read」를 연결하고, 중복 표지와 페이지번호를 정리했습니다. :codex-file-citation{path=\"/Users/janetmath/Ibjanetsong Dropbox/Song Janet/mina-janet/________아프리카-가나/가나교사와2026/야우/book/output/pdf/최종/ECCR_Book_0.pdf\" purpose=\"output\"}\n\n**Book 0-pre — 기존 80페이지:** 내용은 그대로 보존하고 파일명만 변경했습니다. :codex-file-citation{path=\"/Users/janetmath/Ibjanetsong Dropbox/Song Janet/mina-janet/________아프리카-가나/가나교사와2026/야우/book/output/pdf/최종/ECCR_Book_0-pre.pdf\" purpose=\"output\"}\n\n별도 「I Can Read」와 Book 1–9는 변경하지 않았습니다.\n\n- :codex-followup[인쇄·제본용 편집]{prompt=\"합본 Book 0를 본드 제본 인쇄용으로 별도 편집해줘.\"}\n- :codex-followup[단원별 수업 계획]{prompt=\"합본 Book 0의 학습 순서에 맞춰 교사용 단원별 수업 계획을 만들어줘.\"}\n- :codex-followup[오디오 녹음 대본]{prompt=\"합본 Book 0의 영어 읽기편을 페이지별 녹음 대본으로 정리해줘.\"}", "source": "Codex · 01a05ec0 · L10643", "sourceType": "Codex", "label": {"en": "Response · editorial summary", "ko": "응답 · 편집 요약"}}, {"id": "w1051", "stage": "practice", "kind": "human", "role": "yaw", "date": "9/19/26", "time": "16:00:29", "summary": {"en": "Yaw proposes three parallel books with 12 texts each, so learners can practise 36 texts at a similar planned level.", "ko": "야우가 같은 수준의 12개 글을 담은 책 3종을 제안했습니다. 학습자에게 총 36개 글의 반복 연습 기회를 주려는 목적입니다."}, "original": "Janet, I am proposing an idea. We will maintain the same stories. \nLet’s have 2 other sets of the same style. That way, we will have 3 different decodable books. We will then print 10 each.\n\nIn practice, a learner may have one book at a time but after completing that, they still have another 2 different books of the same strength to practice.\n\nAt the end, a learner will read 12*3=36 different decodable texts.\nWhat do you think?", "source": "_chat.txt · L2879 · message 1083", "sourceType": "WhatsApp", "label": {"en": "Original conversation", "ko": "실제 대화"}}, {"id": "a2-387", "stage": "practice", "kind": "prompt", "role": "janet", "date": "9/21/26", "time": "09:20 KST", "summary": {"en": "Create Readers A, B and C with 12 texts each, following the sound-first progression and repeated practice brief.", "ko": "sound-first 흐름과 반복 연습 구성에 맞춰 12개 글씩 담은 Reader A·B·C를 제작합니다."}, "original": "/Users/janetmath/Downloads/_chat\\ 24.txt 좋아. 지금까지 야우가 말한 **sound-first → blending → decodable words → sentence → connected text** 흐름과, 최근 제안한 **“같은 난이도의 서로 다른 decodable book 3종, 각 12개 text”**를 기준으로 실제 제작 가능한 형태로 설계하면 이렇게 가는 게 가장 깔끔해.\n\n야우는 short vowel별 짧은 reader를 원했고, 한 권을 다 읽은 뒤 같은 수준의 다른 책으로 연습하게 하려는 구상이야.  \n\n## 1. 전체 시리즈 구조\n\n### ECCR Read & Rise – Decodable Readers\n\n**Basic 1**\n\n총 3세트:\n\n* **Reader A – First Steps**\n* **Reader B – More Practice**\n* **Reader C – I Can Read More**\n\n각 Reader에 **12개의 짧은 decodable text**를 넣어.\n\n그러면:\n\n**12 texts × 3 books = 36 texts**\n\n야우가 말한 구조와 정확히 맞아.\n\n중요한 건 A, B, C가 난이도가 계속 올라가는 책이라기보다 처음에는 **“같은 phonics 수준에서 다른 이야기로 반복연습”**하게 하는 거야.\n\n---\n\n# 2. 한 권의 구성\n\n한 권당 약 **32~40페이지** 정도가 좋아.\n\n### Front Cover\n\nECCR – READ & RISE\n**DECODABLE READER A**\nBasic 1\n\n이름 쓰는 칸:\n\n**My name is: __________**\n\n---\n\n### Page 2\n\n## How to Use This Book\n\n아이에게는 글을 길게 쓰지 말고:\n\n**Say it.\nBlend it.\nRead it.\nTalk about it.**\n\n아이콘과 함께.\n\n---\n\n### Page 3\n\n## Sounds I Know\n\n이 책에서 사용하는 sound만 표시.\n\n예:\n\na\ni\no\nm\ns\nt\np\nc\nn\n\n정확한 순서는 **야우의 ECCR teaching sequence에 맞춰 최종 확정**해야 해.\n\n---\n\n# 3. 각 Text의 기본 구조\n\n각 이야기는 **2~3페이지**로 만들어.\n\n## Page A — Sound & Word Warm-up\n\n예를 들어 short /a/라면:\n\n### Sound\n\n**a**\n\n### Blend\n\nc + a + t → **cat**\n\nm + a + t → **mat**\n\ns + a + t → **sat**\n\n### Read\n\ncat\nmat\nSam\nsat\n\n그림은 2~3개만.\n\n---\n\n## Page B — Decodable Story\n\n### Sam and the Cat\n\nSam has a cat.\nThe cat sat on a mat.\nSam sat by the cat.\nThe cat ran.\nSam ran after the cat.\nSam and the cat sat.\n\n여기서 중요한 원칙:\n\n**아이가 아직 배우지 않은 phonics pattern은 최대한 사용하지 않는다.**\n\n꼭 필요한 high-frequency word만 별도로 표시.\n\n예:\n\n### Heart Words\n\nthe\nhas\n\n---\n\n## Page C — Check & Respond\n\n### Read Again\n\n1. Who has a cat?\n2. Where did the cat sit?\n\n### Say\n\nTell your partner about the cat.\n\n### Write\n\ncat __________\nmat __________\n\n또는:\n\nThe cat sat on a ______.\n\n---\n\n# 4. Reader A의 12개 Text\n\n처음 책은 **CVC + short vowel 중심**으로 잡는 게 좋아.\n\n### Reader A – First Steps\n\n**Text 1 — Sam and the Cat**\nTarget: short a\ncat, mat, sat, Sam\n\n**Text 2 — Pat Has a Bag**\nTarget: short a\nPat, bag, cap, map\n\n**Text 3 — Tim Can Sit**\nTarget: short i\nTim, sit, pin, big\n\n**Text 4 — The Big Pig**\nTarget: short i\npig, big, dig\n\n**Text 5 — Tom and the Dog**\nTarget: short o\nTom, dog, log, hop\n\n**Text 6 — The Hot Pot**\nTarget: short o\nhot, pot, top\n\n**Text 7 — Ben and the Hen**\nTarget: short e\nBen, hen, pen, ten\n\n**Text 8 — The Red Hen**\nTarget: short e\nred, bed, hen\n\n**Text 9 — Gus and the Bus**\nTarget: short u\nGus, bus, run, sun\n\n**Text 10 — The Mud Hut**\nTarget: short u\nmud, hut, cup\n\n**Text 11 — Sam, Tim and Tom**\nTarget: mixed short vowels\n\n**Text 12 — Fun at School**\nTarget: cumulative review\n\n이렇게 하면 **한 권 안에서 short vowels를 한 바퀴 돌고 마지막 두 text에서 누적 복습**할 수 있어.\n\n---\n\n# 5. Reader B\n\nReader B는 **똑같은 음가 수준을 다른 이야기로 반복**하는 책으로 만들면 돼.\n\n### Reader B – More Practice\n\n예:\n\n1. Pam and the Jam\n2. Dan Has a Van\n3. Kim and the Fish\n4. A Big Tin\n5. Rob and the Box\n6. The Fox on the Log\n7. Meg and the Red Pen\n8. Ten Hens\n9. Mum Has a Cup\n10. Run in the Sun\n11. A Fun Day\n12. At the Market\n\n즉 A에서 `cat, mat`을 읽었다고 B에서 똑같은 문장을 반복하지 않고, **같은 decoding ability를 새로운 context에 적용**하는 거야.\n\n이게 야우가 말한:\n\n> “another 2 different books of the same strength”\n\n에 가장 잘 맞아. \n\n---\n\n# 6. Reader C\n\n세 번째도 아직 너무 어렵게 올리지 않아.\n\n### Reader C – I Can Read More\n\n1. Max Has a Cap\n2. Dad and the Bag\n3. Kim Sits\n4. The Little Pig\n5. Tom Has a Job\n6. A Fox Can Hop\n7. Jen and Ben\n8. The Red Bed\n9. Gus Can Run\n10. Mum Has Fun\n11. We Can Read\n12. My Reading Day\n\n마지막 3~4개부터 문장을 조금 길게 만들면 돼.\n\n예:\n\n**Gus can run.\nGus can run in the sun.\nMum can run with Gus.\nThey have fun.**\n\n---\n\n# 7. 난이도 증가 방식\n\n난이도는 **단어가 어려워지는 것보다 문장과 text가 조금씩 길어지는 방식**으로 올리는 게 좋아.\n\n### Level 1\n\n3~4 word sentences\n\n**Sam has a cat.**\n\n### Level 2\n\n4~6 words\n\n**The cat sat on a mat.**\n\n### Level 3\n\n2개 문장 연결\n\n**The cat ran to Sam.\nSam ran after the cat.**\n\n### Level 4\n\n짧은 paragraph\n\n5~7문장 정도.\n\n---\n\n# 8. High-frequency words 처리\n\n야우가 이전에 제안한:\n\nthe\nwas\nare\none\nyou\nhe\nshe\nwe\nboy\ngirl\nthey\n\n같은 단어는 처음부터 다 넣지 않는 게 좋아.\n\n그도 short-vowel reader를 끝낸 뒤 **intermediate reader에서 high-frequency words를 점차 넣자**고 했어. \n\n그래서 첫 3권에서는:\n\nthe\na\nis\nhas\nI\n\n정도의 최소한만 쓰고,\n\n나중에:\n\n### ECCR Decodable Readers – Level 2\n\n를 따로 만드는 게 더 체계적이야.\n\n---\n\n# 9. 그림 설계\n\n그림도 중요한데 **문장의 답을 그림만 보고 추측할 수 있게 만들면 안 돼.**\n\n예를 들어:\n\n> The cat sat on a mat.\n\n이라면 고양이와 매트는 보여도 돼.\n\n하지만 질문:\n\n> Where did the cat sit?\n\n의 정답이 그림 하나만 보고 바로 나오도록 지나치게 설명적일 필요는 없어.\n\n목표는:\n\n**picture reading이 아니라 decoding**이니까.\n\n---\n\n# 10. 한 Text의 실제 완성 예시\n\n## TEXT 1\n\n### Sam and the Cat\n\n**Sound**\n\na\n\n**Blend**\n\nc + a + t = cat\nm + a + t = mat\ns + a + t = sat\n\n**Read**\n\ncat\nmat\nSam\nsat\n\n### Story\n\nSam has a cat.\n\nThe cat sat on a mat.\n\nSam sat by the cat.\n\nThe cat ran.\n\nSam ran after the cat.\n\nSam and the cat sat.\n\n### Talk\n\nWho has a cat?\n\nWhere did the cat sit?\n\n### Write\n\ncat __________\n\nmat __________\n\nComplete:\n\nThe cat sat on a ______.\n\n---\n\n이 정도면 한 text에 **2~3페이지**면 충분해.\n\n---\n\n### 물리적인 책은 3권\n\n**ECCR Decodable Reader A — 12 texts**\n**ECCR Decodable Reader B — 12 texts**\n**ECCR Decodable Reader C — 12 texts**\n\n로 만드는 것을 추천해.\n\n즉 **교육적으로는 36개의 reader 경험**을 주면서도 실제 제본은 **3권만** 하는 거야.\n 이 내용을 참고해서 Book1-9과 디자인을 통일한 파닉스 북 3권을 별도로 제작해줘.", "source": "Codex · 01a05ec0 · L10652", "sourceType": "Codex", "label": {"en": "Original prompt", "ko": "제작 프롬프트"}}, {"id": "a2-387r", "stage": "practice", "kind": "response", "role": "ai", "date": "9/21/26", "time": "", "summary": {"en": "Three 40-page books, each with 12 texts and illustrations, were produced with a teacher guide. A, B and C practise the same planned phonics scope; they are not three increasing levels.", "ko": "삽화와 12개 글을 담은 40쪽 책 3권, 교사용 안내서를 제작했습니다. A·B·C는 같은 계획 음가 범위의 연습책이며 세 단계의 상승 난이도가 아닙니다."}, "original": "완성했습니다. **각 40페이지·12개 이야기, 총 3권**이며 기존 Book 1–9는 변경하지 않았습니다.\n\nReader A — First Steps: :codex-file-citation{path=\"/Users/janetmath/Ibjanetsong Dropbox/Song Janet/mina-janet/________아프리카-가나/가나교사와2026/야우/book/output/pdf/최종/Phonics_Readers_ABC/ECCR_Decodable_Reader_A.pdf\" purpose=\"output\"}\n\nReader B — More Practice: :codex-file-citation{path=\"/Users/janetmath/Ibjanetsong Dropbox/Song Janet/mina-janet/________아프리카-가나/가나교사와2026/야우/book/output/pdf/최종/Phonics_Readers_ABC/ECCR_Decodable_Reader_B.pdf\" purpose=\"output\"}\n\nReader C — I Can Read More: :codex-file-citation{path=\"/Users/janetmath/Ibjanetsong Dropbox/Song Janet/mina-janet/________아프리카-가나/가나교사와2026/야우/book/output/pdf/최종/Phonics_Readers_ABC/ECCR_Decodable_Reader_C.pdf\" purpose=\"output\"}\n\n기존 시리즈의 색상·둥근 테두리·꼬마 캐릭터를 맞췄습니다. **소리 → blending → 그림과 이야기 → 이해 확인·4선 쓰기**로 구성했고, 내장 이미지 생성 도구로 삽화 36개를 제작했습니다.\n\n세 권은 같은 음가 범위의 반복 연습용입니다. 수업 적용 전 야우의 음가 순서·학생 준비도 확인이 필요합니다. 같은 폴더에 교사용 안내서와 정답도 저장했습니다.\n\n- :codex-followup[야우 검토용 메시지]{prompt=\"새 Reader A–C의 구성과 확인할 사항을 야우에게 보낼 영어 메시지로 작성해줘.\"}\n- :codex-followup[수업용 카드 제작]{prompt=\"Reader A–C의 음가와 단어에 맞는 인쇄용 letter·word cards를 별도로 만들어줘.\"}\n- :codex-followup[본드 제본판 제작]{prompt=\"Reader A–C의 원본은 유지하고 안쪽 제본 여백을 확보한 양면 인쇄용 버전을 별도 폴더에 만들어줘.\"}", "source": "Codex · 01a05ec0 · L11016", "sourceType": "Codex", "label": {"en": "Response · editorial summary", "ko": "응답 · 편집 요약"}}, {"id": "w1064", "stage": "practice", "kind": "human", "role": "janet", "date": "9/21/26", "time": "13:29:17", "summary": {"en": "Janet shares Reader A as a 40-page PDF on 21 September.", "ko": "9월 21일 Janet이 40쪽 Reader A PDF를 전달했습니다."}, "original": "ECCR_Decodable_Reader_A.pdf • ‎40 페이지 ‎문서 생략됨", "source": "_chat.txt · L2904 · message 1096", "sourceType": "WhatsApp", "label": {"en": "Original conversation", "ko": "실제 대화"}}, {"id": "w1065", "stage": "practice", "kind": "human", "role": "janet", "date": "9/21/26", "time": "13:29:20", "summary": {"en": "Janet shares Reader B as a 40-page PDF.", "ko": "Janet이 40쪽 Reader B PDF를 전달했습니다."}, "original": "ECCR_Decodable_Reader_B.pdf • ‎40 페이지 ‎문서 생략됨", "source": "_chat.txt · L2905 · message 1097", "sourceType": "WhatsApp", "label": {"en": "Original conversation", "ko": "실제 대화"}}, {"id": "w1066", "stage": "practice", "kind": "human", "role": "janet", "date": "9/21/26", "time": "13:29:22", "summary": {"en": "Janet shares Reader C as a 40-page PDF.", "ko": "Janet이 40쪽 Reader C PDF를 전달했습니다."}, "original": "ECCR_Decodable_Reader_C.pdf • ‎40 페이지 ‎문서 생략됨", "source": "_chat.txt · L2906 · message 1098", "sourceType": "WhatsApp", "label": {"en": "Original conversation", "ko": "실제 대화"}}, {"id": "w1173", "stage": "next", "kind": "human", "role": "yaw", "date": "10/6/26", "time": "22:09:55", "summary": {"en": "Yaw proposes another ECCR app for a new activity and sends image references.", "ko": "야우가 새로운 활동용 ECCR 앱을 제안하고 이미지 자료를 보냈습니다."}, "original": "I want us to develop another ECCR app for another activity. ‎이미지 생략됨", "source": "_chat.txt · L3114 · message 1205", "sourceType": "WhatsApp", "label": {"en": "Original conversation", "ko": "실제 대화"}}, {"id": "w1182", "stage": "next", "kind": "human", "role": "yaw", "date": "10/6/26", "time": "22:58:20", "summary": {"en": "Yaw says he needs to record the content on each sheet.", "ko": "야우가 각 자료의 내용을 녹음해야 한다고 설명했습니다."}, "original": "That’s the end of it. I need to record what I have on each sheet for you.", "source": "_chat.txt · L3123 · message 1214", "sourceType": "WhatsApp", "label": {"en": "Original conversation", "ko": "실제 대화"}}, {"id": "w1187", "stage": "next", "kind": "human", "role": "janet", "date": "10/8/26", "time": "23:33:44", "summary": {"en": "Janet asks for Yaw’s teaching rationale for every resource, including the new phonics materials that are not yet finished.", "ko": "Janet이 미완성 새 파닉스 자료까지 포함해 각 자료의 필요와 기대 효과를 교사 관점에서 설명해 달라고 요청했습니다."}, "original": "Hi Yaw, I’d love to understand your perspective as a teacher on the purpose of each material we are developing together.\n\nCould you please write a short explanation for each individual book or resource, including Books 0–9, the assessment materials, and Decodable Readers A, B, and C? Please also include the phonics and letter-sound materials you sent recently, even though we haven’t developed those into a finished resource yet.\n\nFor each one, could you share:\n1. Why you feel it is needed in your classroom, including the specific learning needs or difficulties it is intended to address.\n2. What benefits you expect it to bring to your learners and your teaching.\n\nA few sentences or bullet points for each would be very helpful. Your classroom experience will help us clearly explain why each material matters and what we hope to achieve with it.\n\nThank you, Yaw.", "source": "_chat.txt · L3128 · message 1219", "sourceType": "WhatsApp", "label": {"en": "Original conversation", "ko": "실제 대화"}}, {"id": "w1191", "stage": "next", "kind": "human", "role": "janet", "date": "10/10/26", "time": "00:53:57", "summary": {"en": "Janet asks whether this will be used in Term 1.", "ko": "Janet이 1학기에 사용할 자료인지 물었습니다."}, "original": "Will this be used in Term 1 out of Terms 1, 2, and 3?", "source": "_chat.txt · L3145 · message 1223", "sourceType": "WhatsApp", "label": {"en": "Original conversation", "ko": "실제 대화"}}, {"id": "w1192", "stage": "next", "kind": "human", "role": "yaw", "date": "10/10/26", "time": "02:01:34", "summary": {"en": "Yaw says the intended app could support beginners at any grade, including older learners who still struggle to read. He will add this to his explanation.", "ko": "야우는 읽기에 어려움을 겪는 고학년까지 포함해 모든 초보 학습자를 도울 수 있는 자료라고 설명했고, 요청받은 설명에 추가하겠다고 했습니다."}, "original": "It’s a complete app that can help every beginner. Even if a learner is at the upper primary or junior high and still struggling with reading skills, this gives a solid foundation. Therefore it’s for all levels. I will respond to the earlier request and add it. Thank you. ‎\u003cThis message was edited>", "source": "_chat.txt · L3146 · message 1224", "sourceType": "WhatsApp", "label": {"en": "Original conversation", "ko": "실제 대화"}}, {"id": "full-1226", "stage": "next", "kind": "human", "role": "janet", "date": "10/10/26", "time": "04:19:03", "summary": {"en": "Janet says she is preparing a step-by-step guide to share how she created the learning materials and AI tools.", "ko": "Janet이 학습 자료와 AI 도구를 어떻게 만들었는지 알려주는 안내서를 준비하고 있다고 전합니다."}, "original": "Thank you for keeping me updated.\n\nI’m going to show you how to create the learning materials and AI tools I’ve developed. I’m currently preparing a guide for you, and I’ll share more details with you soon.", "source": "_chat.txt · L3148 · message 1226", "sourceType": "WhatsApp", "label": {"en": "WhatsApp conversation", "ko": "WhatsApp 대화"}}, {"id": "full-1227", "stage": "next", "kind": "human", "role": "yaw", "date": "10/10/26", "time": "06:39:59", "summary": {"en": "Yaw welcomes the guide and says he is eager to go through the process step by step.", "ko": "야우가 안내서를 환영하며 제작 과정을 단계별로 배우고 싶다고 답합니다."}, "original": "It sounds great. I can’t wait to go through step by step.\n❤️ Thank you.\n\nI missed my learners within these few days.😁", "source": "_chat.txt · L3151 · message 1227", "sourceType": "WhatsApp", "label": {"en": "WhatsApp conversation", "ko": "WhatsApp 대화"}}, {"id": "full-1228", "stage": "next", "kind": "human", "role": "yaw", "date": "10/10/26", "time": "09:23:35", "summary": {"en": "Yaw explains how the full set fits his classroom: Books 1, 2 and 4 introduce reading; 3 and 5 practise blending; 6 introduces digraphs; 7 transfers skills to English; 8 adds tricky words; 9 integrates the basic skills. Book 0 provides activities after individual sounds are recognised. A–C are exchanged across the class to offer 36 texts. Individual assessments guide support; baseline checks move from 10 to 22 sounds; the Writing Book supports writing on lines. The proposed letter-sound app also serves teachers. These are his intended uses and expected benefits.", "ko": "야우가 전체 자료의 수업 목적을 설명합니다. Book 1·2·4는 읽기 입문, 3·5는 소리 합성, 6은 두 글자가 한 소리를 내는 digraph, 7은 영어로의 전이, 8은 불규칙 단어, 9는 기초 기능 통합 읽기입니다. Book 0는 개별 음가를 인식한 뒤 쓰는 활동책입니다. A·B·C를 교환해 36개 글을 읽고, 개별 평가로 보충 지도를 계획하며, 기초 평가는 10개 음가에서 22개 음가로 확장합니다. 쓰기책은 줄에 맞춰 쓰기를 돕습니다. 새 음가 앱은 교사용 도구도 지향합니다. 모두 야우가 설명한 활용 의도와 기대 효과입니다."}, "original": "Hello Janet, here are some explanations for our books.\n\n ⁠* Books 1, 2, 4 (introduction to early reading)\n\n* Book 3 — This is the first book learners begin to read when they master blending skills.\n\n* Book 5 - This is an additional reading book after book 3. They follow similar principles: blending of sounds to read. \n\n* Book 6 — Digraphs: 2 letters making one sound. I will introduce them one by one as learners become confident in the regular practice ie blending of sounds to read.\n\n* Book 7 — English reading practice book. The words are mostly decodable with a focused sound “a”. Learners can transfer their blending skills from the Twi books 3 and 5 to read book 7 with little guidance.\n\nBook 8: They are tricky words. All of them do not follow the sounding out and blending techniques. My learners need to know each of them as they appear in texts. I will introduce them in our Word Bank. \n\nTherefore book 8 becomes available when learners can read those tricky words. The rest of the words in book 8 are decodable.\n\nBook 9: It’s expected to be read by a learner who has mastered all the basic skills: letter sounds, blending, decoding, tricky or sight words and punctuation. I expect this to be done in the final term when learners have go through a lot of practice.\n\nBook 0: Purely activity. It will be made available when learners can show me the individual sounds of the letters on our walls, word bank, in old readers and other resources available in the classroom. \n\nDecodable Books A, B, C\nBook A has 12 decodable texts titles. It’s the same for B and C. I decided to have 10 copies each for the class.\n\nApplication in the classroom: 10  books of A will be given to 10 learners. 10 books of B go to another 10 learners. The last 10 of book C go to the last 10 learners. \n\nIn all, we have served 30 books to 30 learners but they have different titles.\n\nFor example: If a learner completes book A, they can take either B or C. Since it B and C have different titles, they become another reading experience. \n\nIn effect, a learner will read 36 titles of decodable texts in the class. This will help them build fluency, recognition, vocabulary and pronunciation skills. \n\n\n* Assessment Books 1, 2 and 4 will check how well my learners read the words, sentences and answer oral questions in the reading books. They will write too.\n\n* Assessment Book 3 will test the first decodable texts and story in Twi, ie Book 3.\n\nThe assessment books are all targeted to checking progress and addressing challenges in the reading books. Every book has its assessment book.\n\nIn practice, let’s say if we practice an activity for a week or two, we will assess. After that, I would get to know who knows what and what they can do. With that, I would know those who need support.\n\nSince I will be checking progress of every learner, each of them needs their own assessment records. \n\nThe baseline entry sheet: Pre-instruction \n\nI recorded the assessment scores in an exercise book. I need to write each of them on the sheet with their scores, out of 10.\n\nWith time, most of them will score all the 10 sounds on the Pre-instruction sheet.\n\nWhen that happens, I will give them the complete letter sound entry baseline sheet. I will assess and score out of 22.\n\nThe writing books: It will help me teach learners how to write on the lines focusing on what we learn in our classroom.\n\nIn fact, I want our learners to be in print rich classroom. The books will play their part and the “talking classroom” will add up to make them read. \n\nMy desire to build readers at the early stages. With these resources, I am more equipped to achieving it.\n\nThe letter sounds app I shared with you is for all learners who want to learn the basic sounds in Asante Twi. I repeated some letters. For instance, Aa, Ee, and Oo. They have 2 sounds each. The app will be a teaching tool for Twi teachers as well. It’s like a digital manual or resource pack.\n\nPlease feel free to ask for clarification on any of the points explained. Thank you.🙏", "source": "_chat.txt · L3155 · message 1228", "sourceType": "WhatsApp", "label": {"en": "WhatsApp conversation", "ko": "WhatsApp 대화"}}, {"id": "full-1229", "stage": "next", "kind": "human", "role": "yaw", "date": "10/10/26", "time": "16:41:00", "summary": {"en": "Yaw later notes minor typographical errors in his explanation. His message is preserved verbatim; the summaries present its intended meaning.", "ko": "야우는 뒤이어 자신의 설명에 작은 오타가 있다고 알립니다. 원문은 그대로 보존하고 요약에는 취지를 정리했습니다."}, "original": "Hello Janet, having gone through the whole thing this morning, I saw some slight typographical errors in it. I was tired though. \n\nI believe you got the whole idea behind that. Thank you.", "source": "_chat.txt · L3214 · message 1229", "sourceType": "WhatsApp", "label": {"en": "WhatsApp conversation", "ko": "WhatsApp 대화"}}], "counts": {"human": 53, "prompts": 37, "responses": 37}}}</script><script>'use strict';

요. 기존 제작 앱도 비교 자료로 열어볼 수 있습니다.'],production:['Open the original production reader ↗','기존 제작 읽기 앱 보기 ↗'],repository:['Website source on GitHub ↗','GitHub에서 소스 보기 ↗'],footer:['Sources audited 21 October 2026\nPractice notes are saved in this browser.','2026년 10월 21일 자료 대조\n실습 기록은 이 브라우저에 저장됩니다.'],launcher:['Read prompts + responses','프롬프트·응답 보기'],evidenceNote:['Original records stay in their source language. Summaries and the new tutorial prompts are labelled separately. Related prompt and response records are shown together.','원문은 원래 언어를 유지합니다. 요약과 새 실습 프롬프트는 구분해 표시하며, 연결된 프롬프트와 응답을 함께 보여줍니다.'],allEvidence:['Show all records','전체 기록 보기'],auditTitle:['What can be reproduced—and from which source','어떤 자료로 무엇을 재현할 수 있나요'],purpose:['What this component does','구성요소와 역할'],recipe:['Build / change procedure','제작·변경 절차'],verify:['What to verify','확인할 것'],code:['Code & implementation details','코드·구현 상세 펼치기'],input:['Starting material','준비 자료'],task:['Your task','직접 해보기'],expected:['Expected artifact','완성할 산출물'],prompt:['Copy a prompt for this step','이 단계의 실습 프롬프트'],newPrompt:['New teaching template · not a verbatim historical prompt','새로 작성한 실습 템플릿 · 당시 원문과 구분'],copy:['Copy','복사'],checks:['Check your result','결과 확인하기'],checkNote:['Mark these after checking your own artifact. These are your observations, not automatic certification.','직접 만든 자료를 확인한 뒤 표시하세요. 자동 인증이 아닌 본인의 점검 기록입니다.'],challenge:['When the result needs a revision','결과를 개선하는 연습'],revision:['Try this revision request','이렇게 수정 요청하기'],transfer:['Transfer to your classroom','내 수업에 적용하기'],sources:['Open the evidence behind this step','이 단계의 원문 근거 열기'],prev:['← Previous','← 이전'],next:['Next →','다음 →'],lab:['Try it here','여기서 직접 해보기'],local:['Saved on this device','이 기기에 저장'],technicalNav:['COMPONENTS & DEVELOPMENT','구성요소와 개발 절차'],tutorialNav:['BUILD ONE SMALL READER','작은 읽기책부터 만들기'],complete:['checked','점검'],copyDone:['Copied','복사했습니다'],exportDone:['Practice file exported','실습 기록을 저장했습니다'],empty:['No matching records.',' function codeHTML(code){if(!code)return '';const raw=typeof code==='string'?code:code.text||code.code||'';if(!raw)return '';return `<details class="code-block"><summary>${t('code')}</summary><div class="inner">${code.caption?`<p class="prompt-note">${esc(tx(code.caption))}</p>`:''}${code.sourceNote?`<p class="prompt-note">${esc(tx(code.sourceNote))}</p>`:''}${code.source?`<p class="prompt-note">${esc(code.source)}</p>`:''}<pre>${esc(raw)}</pre><button class="button" data-copy-code>${t('copy')}</button></div></details>`}

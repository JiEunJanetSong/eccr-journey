를 통과로 처리하지 말고 파일 목록을 다시 만든 뒤 MP3 재생과 앱 시작을 재검사해줘."}, "lesson": {"en": "A successful open tab does not prove that startup files and every recording were saved.", "ko": "열려 있는 탭이 작동해도 시작 파일과 모든 녹음이 저장됐다는 뜻은 아닙니다."}}, "evidence": ["w354", "w355", "a4-1521", "a4-1521r", "a4-1567", "a4-1567r", "w733", "a4-1624r"], "transfer": {"en": "Use the same browser profile for saving and reading. Plan an online refresh when the edition changes or browser storage is cleared.", "ko": "저장할 때와 읽을 때 같은 브라우저 프로필을 사용하세요. 판본이 바뀌거나 브라우저 저장소를 지웠다면 온라인에서 다시 저장합니다."}, "code": {"title": {"en": "Existing app maintenance commands", "ko": "기존 앱의 갱신 명령"}, "language": "sh", "text": "npm run build:offline\nnpm run check\nnpm run serve", "source": "기술인계문서-ECCR/TECHNICAL_HANDOFF_EN.md §§16–17", "note": {"en": "Run in the reading-app repository, where these scripts exist. They are not commands for a blank folder or this tutorial page. npm run check checks JavaScript syntax; cold-start behavior still needs device testing.", "ko": "해당 스크립트가 있는 읽기 앱 저장소에서 실행합니다. 빈 폴더나 이 실습 페이지의 명령이 아닙니다. npm run check는 JavaScript 문법을 검사하며 완전 종료 후 실행은 기기에서 확인해야 합니다."}, "caption": {"en": "Existing app maintenance commands", "ko": "기존 앱의 갱신 명령"}, "sourceNote": {"en": "Run in the reading-app repository, where these scripts exist. They are not commands for a blank folder or this tutorial page. npm run check checks JavaScript syntax; cold-start behavior still needs device testing.", "ko": "해당 스크립트가 있는 읽기 앱 저장소에서 실행합니다. 빈 폴더나 이 실습 페이지의 명령이 아닙니다. npm run check는 JavaScript 문법을 검사하며 완전 종료 후 실행은 기기에서 확인해야 합니다."}}}, {"id": "release", "title": {"en": "Release a reproducible classroom kit", "ko": "다시 만들 수 있는 수업 자료로 묶어 배포하기"}, "goal": {"en": "Deliver the source, finished files, teaching decisions and checks so another teacher can continue.", "ko": "다른 교사가 이어갈 수 있도록 원본·완성 파일·수업 판단·확인 결과를 함께 전달합니다."}, "teacherTask": {"en": "Export your brief, manuscript, prompts, corrections and test record. Put editable sources beside the finished PDF/app files. Check the published URL, then pilot with a small group and record the next change.", "ko": "제작 계획·원고·프롬프트·교정·검사 기록을 내보내세요. 완성 PDF·앱 파일과 수정 가능한 원본을 함께 정리합니다. 배포 주소를 확인하고 소규모 수업에서 다음 수정점을 기록합니다."}, "inputs": [{"en": "Approved book, images, recordings, editable sources and a completed review log.", "ko": "승인된 책·그림·녹음·수정 가능한 원본·검토 기록."}, {"en": "Host configuration and the classroom use plan.", "ko": "배포 설정과 수업 활용 계획."}], "prompt": {"en": "Prepare a reproducible handoff for this edition. Include purpose, file map, exact inputs, regeneration instructions, required fonts/tools, audio mapping, missing items, version/update steps and test results. Label what is implemented, what is a historical proposal and what still needs teacher review. Deploy the approved files to the selected host and verify the published paths, media and mobile layout. Include a small-class pilot record and a matching assessment plan, without inventing learning gains.", "ko": "이 판본을 다시 만들 수 있는 인계 자료를 정리해줘. 목적·파일 구성·정확한 입력·재생성 절차·필요한 글꼴과 도구·음성 연결·누락 항목·버전 갱신·검사 결과를 포함해줘. 구현된 것, 과거 제안, 교사 검토가 남은 것을 구분해줘. 승인된 파일을 선택한 호스트에 배포하고 실제 주소에서 경로·미디어·모바일 배치를 확인해줘. 소규모 수업 기록과 연계 평가 계획을 넣되 확인되지 않은 학습 효과를 쓰지 마."}, "expected": {"en": "A shareable release plus a source kit that another teacher or developer can inspect and rebuild.", "ko": "공유 가능한 배포본과 다른 교사·개발자가 살펴보고 다시 만들 수 있는 원본 묶음."}, "checks": [{"en": "The published link opens from another device and all needed files resolve.", "ko": "다른 기기에서 배포 주소가 열리고 필요한 파일이 연결된다."}, {"en": "Editable content, prompts, generated artwork and build instructions are included or clearly located.", "ko": "수정 가능한 내용·프롬프트·생성 그림·제작 절차의 위치가 명확하다."}, {"en": "Known gaps and teacher approval status are visible.", "ko": "알려진 누락과 교사 승인 상태가 표시되어 있다."}, {"en": "A teacher can say what learners will read, how progress will be observed and what will trigger revision.", "ko": "학생이 무엇을 읽고 어떻게 진전을 관찰하며 언제 수정할지 교사가 설명할 수 있다."}], "challenge": {"symptom": {"en": "The homepage is online, but an image path fails or the source kit depends on a creator’s personal folder.", "ko": "홈페이지는 열리지만 그림 경로가 끊어지거나 원본 묶음이 제작자의 개인 폴더에 의존합니다."}, "revision": {"en": "Test the release under its actual project URL. Replace machine-specific content paths with portable project paths. Document unavoidable local font/tool requirements. Rebuild from a fresh copy and list any input that is still missing.", "ko": "실제 프로젝트 주소 아래에서 배포본을 확인해줘. 개인 컴퓨터에 종속된 콘텐츠 경로는 이동 가능한 프로젝트 경로로 바꾸고, 로컬 글꼴·도구 조건은 문서화해줘. 새 사본에서 다시 만들어보고 빠진 입력을 알려줘."}, "lesson": {"en": "A finished PDF or live homepage becomes reproducible when its inputs and regeneration steps travel with it.", "ko": "완성 PDF나 홈페이지에 입력과 재생성 절차가 함께 있어야 다른 사람이 다시 만들 수 있습니다."}}, "evidence": ["full-211", "full-212", "w242", "a2-208", "a2-208r", "a4-1624", "a4-1624r", "full-1228"], "transfer": {"en": "Expand after the pilot: add matching assessment and writing pages, then other stories at the planned scope. Readers A/B/C provide different texts for repeated practice; their shared scope is not a validated claim of equal difficulty.", "ko": "첫 수업 이후 연계 평가·쓰기 자료를 더하고 같은 계획 범위의 다른 이야기를 만드세요. Readers A/B/C는 다른 글로 반복 연습하는 자료이며, 같은 범위가 검증된 동등 난이도를 뜻하지는 않습니다."}}], "interactionSuggestions": [{"lesson": "brief", "type": "brief-builder", "description": {"en": "Audience, known sounds, prepared words and goal fields generate a filled prompt and exportable brief.", "ko": "학습자·배운 음가·준비 단어·목표를 입력하면 채워진 프롬프트와 제작 계획서를 내보냅니다."}}, {"lesson": "manuscript", "type": "editable-manuscript", "description": {"en": "Edit real source sentences; show word/sentence counts and differences. Warnings never claim to certify decodability.", "ko": "실제 원고를 편집하고 단어·문장 수와 수정 차이를 봅니다. 경고를 읽기 가능성 인증으로 표시하지 않습니다."}}, {"lesson": "illustration", "type": "image-inspection", "description": {"en": "Show the actual image and teacher checks: scene match, character continuity, no text, safe crop.", "ko": "실제 그림과 장면 일치·인물 일관성·글자 없음·잘림 없음 확인 항목을 제공합니다."}}, {"lesson": "layout", "type": "image-text-balance", "description": {"en": "Change image/text balance, fit/fill and font size. Display clipping risk before exporting a layout brief.", "ko": "그림·본문 비율, 전체 맞춤/채우기, 글자 크기를 바꾸고 잘림 위험을 확인한 뒤 배치 지시서를 내보냅니다."}}, {"lesson": "review", "type": "correction-diff", "description": {"en": "Old/new text, source/page and reason produce a narrow revision prompt and dependent-file checklist.", "ko": "이전·수정 문장, 출처·쪽, 이유로 구체적인 수정 프롬프트와 연결 파일 확인표를 만듭니다."}}, {"lesson": "audio", "type": "hotspot-percent", "description": {"en": "Move and resize a rectangle over a real page; export x/y/w/h percentages. State clearly if no real recording is connected.", "ko": "실제 페이지 위에서 사각형을 옮기고 크기를 바꿔 x/y/w/h 백분율을 내보냅니다. 실제 녹음이 연결되지 않았다면 명시합니다."}}, {"lesson": "offline", "type": "cold-start-log", "description": {"en": "Record device, browser, edition, first-save completion and close/reopen results. A tick is a self-reported test, not automated verification.", "ko": "기기·브라우저·판본·최초 저장·종료 후 재실행 결과를 기록합니다. 체크는 자기 보고이며 자동 검증은 아닙니다."}}, {"lesson": "release", "type": "project-export", "description": {"en": "Export the edited brief, manuscript, correction and checks together; progress reflects user-completed tasks.", "ko": "편집한 계획·원고·수정·확인을 함께 내보냅니다. 진행률은 사용자가 완료한 작업을 반영합니다."}}], "sourceDocuments": [{"path": "book/v.0/결과물Yaw_Janet/book_7_8_9_materials/05_prompts/sam_and_cat_imagegen_prompts.md", "usedFor": ["illustration"]}, {"path": "book/v.0/결과물Yaw_Janet/book_7_8_9_materials/06_scripts/make_sam_and_cat_reader_imagegen.py", "usedFor": ["layout", "manuscript"]}, {"path": "book/output/pdf/최종/ECCR_Book_7.pdf", "usedFor": ["manuscript", "review", "layout"]}, {"path": "book/output/pdf/최종/REVISION_NOTES_20260914.md", "usedFor": ["review"]}, {"path": "book/output/pdf/최종/Phonics_Readers_ABC/TEACHER_GUIDE_AND_ANSWERS.md", "usedFor": ["manuscript", "release"]}, {"path": "book/output/pdf/a4/phonics_abc_20260921/build_series.py", "usedFor": ["layout"]}, {"path": "기술인계문서-ECCR/TECHNICAL_HANDOFF_EN.md", "usedFor": ["audio", "offline", "release"]}]}, "documents": {"기술인계문서-ECCR/TECHNICAL_HANDOFF_EN.md": {"text": "# ECCR Picture Book Technical Handoff\n\n## 1. Purpose\n\nThis document allows another LLM or developer to understand, reproduce, and safely maintain the ECCR Picture Book application without access to the original conversation history.\n\nCurrent production locations:\n\n- Picture Book: `https://jieunjanetsong.github.io/eccr-picture-audio-site/picturebook/`\n- Audio Practice: `https://jieunjanetsong.github.io/eccr-picture-audio-site/audio/`\n- GitHub repository: `https://github.com/JiEunJanetSong/eccr-picture-audio-site`\n\nThe current deployment contains `Book1` through `Book7`.\n\n## 2. Product Definition\n\nECCR Picture Book is a static, web-based reading tool designed to work on low-spec smartphones and standard desktop computers in Ghana.\n\nThe main user flow is:\n\n1. The learner selects a book.\n2. The learner taps a printed word, sentence, or heading on the page image.\n3. The teacher recording mapped to that exact text plays.\n4. The learner moves between pages using the page numbers or previous/next controls.\n5. While online, the learner selects `Save offline` and waits for `Offline ready`.\n6. The books and recordings can then be used offline in the same browser or installed home-screen app.\n\nThe project also provides an `Audio Practice` view that presents the same content as a selectable list.\n\n### Requirements That Must Be Preserved\n\n- The application name is `ECCR`.\n- Keep the `Produced by Team Kairos` credit visible.\n- Do not require login, accounts, or a database.\n- The application must remain deployable as static files.\n- Packaged teacher recordings must work when the developer's MacBook and local TTS server are off.\n- The UI must work on mobile phones and desktop computers.\n- When a page contains both Twi and English, each language must play the recording for that language.\n- Do not replace missing recordings with incorrect TTS. The current UI displays `Audio coming soon`.\n- Hotspots must be invisible so the learner appears to tap the printed text itself.\n- Moving quickly between text items must not leave a translucent box or stale playing state.\n- Changing the book or page must stop the current audio immediately.\n\n## 3. Technology Stack\n\n- HTML5\n- CSS3\n- Vanilla JavaScript\n- HTML `\u003caudio>` element\n- Web App Manifest\n- Service Worker and Cache Storage API\n- Node.js scripts for generating the offline asset list and checking JavaScript syntax\n- GitHub Pages and GitHub Actions for production deployment\n- Netlify and Vercel configuration files are included, but GitHub Pages is the current production host.\n\nThe frontend has no framework, bundler, database, authentication layer, or required server runtime. This reduces startup cost and maintenance complexity on low-spec devices.\n\n## 4. Repository Layout\n\n```text\neccr-picture-audio-site/\n├── .github/workflows/pages.yml       # Deploys main to GitHub Pages\n├── audio/\n│   ├── index.html                    # List-based Audio Practice UI\n│   ├── app.js\n│   └── style.css\n├── icons/icon.svg                    # PWA icon\n├── picturebook/\n│   ├── assets/\n│   │   ├── book1/page-01.jpg ...\n│   │   └── book7/page-12.jpg\n│   ├── audio/\n│   │   ├── book1/*.mp3 ...\n│   │   └── book7/*.mp3\n│   ├── a4_books.js                   # Shared content, hotspot, and audio data\n│   ├── app.js                        # Picture Book runtime\n│   ├── index.html\n│   └── style.css\n├── scripts/generate-offline-assets.mjs\n├── shared/config.js                  # Optional TTS API policy\n├── index.html                        # App selection page\n├── manifest.webmanifest\n├── offline-assets.js                 # Generated file; do not edit manually\n├── pwa.js                            # Save Offline UI and SW messages\n├── sw.js                             # Offline cache and MP3 range responses\n├── MISSING_VOICE_RECORDINGS.md       # Visible text without recordings\n├── package.json\n├── netlify.toml\n└── vercel.json\n```\n\nThere are currently 112 page images:\n\n- Book1: 12 pages\n- Book2: 20 pages\n- Book3: 32 pages\n- Book4: 12 pages\n- Book5: 12 pages\n- Book6: 12 pages\n- Book7: 12 pages\n\n## 5. Shared Content Data Contract\n\n`picturebook/a4_books.js` is the main content source. It creates the `window.ECCR_A4_BOOKS` array, which is consumed by both Picture Book and Audio Practice.\n\n### Book Object\n\n```js\n{\n  id: \"book7\",\n  title: \"Book7\",\n  assetDir: \"assets/book7\",\n  pages: [/* Page objects */]\n}\n```\n\nRules:\n\n- `id` must be unique. The recommended format is `bookN`.\n- Books are sorted numerically using the number found in `id` or `title`.\n- Current display titles use `Book1`, `Book2`, and so on.\n- `assetDir` is relative to `picturebook/index.html`.\n\n### Page Object\n\n```js\n{\n  title: \"Simple Sentences\",\n  image: \"page-04.jpg\",\n  audio: [/* AudioItem objects */]\n}\n```\n\nBlank pages must remain in the data so that page order matches the printed book.\n\n```js\n{\n  title: \"Blank\",\n  image: \"page-10.jpg\",\n  audio: []\n}\n```\n\n### AudioItem Object\n\nNormal item with a recording:\n\n```js\n{\n  text: \"Sam has a cap.\",\n  speechText: \"Sam has a cap.\",\n  audioSrc: \"audio/book7/page-04-01.mp3\",\n  box: { x: 47, y: 28, w: 36, h: 8 },\n  lang: \"en\"\n}\n```\n\nOne recording mapped to two separate printed regions:\n\n```js\n{\n  text: \"Writing Activity: Write\",\n  speechText: \"Writing Activity: Write\",\n  audioSrc: \"audio/book7/page-09-heading.mp3\",\n  boxes: [\n    { x: 28, y: 8, w: 44, h: 7 },\n    { x: 16, y: 23, w: 20, h: 7 }\n  ],\n  lang: \"en\"\n}\n```\n\nVisible text without a recording:\n\n```js\n{\n  text: \"Short /a/ Reader\",\n  speechText: \"Short /a/ Reader\",\n  box: { x: 32, y: 20, w: 36, h: 6 },\n  lang: \"en\",\n  recordingMissing: true\n}\n```\n\nField definitions:\n\n| Field | Required | Meaning |\n| --- | --- | --- |\n| `text` | Yes | Text used in lists and accessibility labels |\n| `speechText` | Recommended | Spoken text and recording reference text |\n| `audioSrc` | For recordings | Teacher recording path relative to `picturebook/` |\n| `box` | Conditional | One tappable region |\n| `boxes` | Conditional | Multiple regions that play the same recording |\n| `lang` | Yes | `twi`, `en`, or occasionally `twi-en` |\n| `recordingMissing` | For missing audio | Prevents TTS and shows the pending-audio state |\n\nEvery item should have either `box` or `boxes`. The application can estimate a temporary box from text length, but production books must use manually verified coordinates.\n\n## 6. Hotspot Coordinate System\n\nHotspots use percentages of the full page image rather than image pixels.\n\n```text\nx = leftPixel / imageWidth * 100\ny = topPixel / imageHeight * 100\nw = boxWidth / imageWidth * 100\nh = boxHeight / imageHeight * 100\n```\n\nFor example, a rectangle beginning at `(560, 472)` with a size of `(430, 135)` on a 1191 x 1684 image becomes:\n\n```js\n{\n  x: 560 / 1191 * 100,\n  y: 472 / 1684 * 100,\n  w: 430 / 1191 * 100,\n  h: 135 / 1684 * 100\n}\n```\n\nPercentage coordinates keep hotspots aligned with responsive page images on both phones and desktops.\n\nHotspot rules:\n\n- Include modest padding around the letters for finger input.\n- Do not overlap adjacent words or sentences.\n- A sentence hotspot should cover the entire printed sentence.\n- Add a separate item for a heading when a heading recording exists.\n- Keep hotspot backgrounds, focus outlines, and mobile tap highlights invisible.\n- Verify coordinates at both mobile and desktop widths.\n\n## 7. Audio Routing and Playback Priority\n\n`picturebook/app.js` and `audio/app.js` resolve audio in this order:\n\n1. If `recordingMissing` is `true`, do not play anything and show `Audio coming soon`.\n2. If `audioSrc` exists, play the packaged teacher recording.\n3. If neither condition applies and a TTS API is configured, build a TTS URL based on `lang`.\n4. If no source is available, do not play audio.\n\nOn GitHub Pages, `shared/config.js` deliberately leaves the TTS API URL empty:\n\n```js\nwindow.ECCR_STATIC_AUDIO_ONLY = window.location.hostname.endsWith(\"github.io\");\nwindow.ECCR_TTS_API_BASE = window.ECCR_STATIC_AUDIO_ONLY ? \"\" : window.location.origin;\n```\n\nThe production app therefore plays its packaged MP3 files without depending on an external TTS service or local MacBook.\n\nCurrent behavior to understand:\n\n- Changing the English or Twi voice does not alter packaged teacher recordings.\n- Voice selectors matter only when a deployment has a TTS backend and an item needs synthesis.\n- The default English TTS fallback is Kokoro `bm_fable` at speed `0.9`.\n- The default Twi TTS fallback is MMS Akan/Twi `mms-aka` at speed `0.9`.\n- `recordingMissing` intentionally disables fallback synthesis to prevent incorrect pronunciation.\n\n### Relative Path Difference Between the Two Apps\n\nFor the same `audioSrc` value:\n\n- Picture Book uses `item.audioSrc` directly because it runs inside `picturebook/`.\n- Audio Practice resolves it as `../picturebook/${item.audioSrc}` because it runs inside `audio/`.\n\nChanging this rule can break audio in one app while leaving the other app operational.\n\n## 8. Pages Containing Twi and English\n\nDo not connect one combined recording to separate Twi and English lines. Split the recording and create one hotspot per language.\n\n```js\nfunction bilingualPage(bookNumber, pageNumber, twi, english) {\n  const base = `audio/book${bookNumber}/page-${String(pageNumber).padStart(2, \"0\")}`;\n  return page(pageNumber, twi, [\n    recording(twi, `${base}-twi.mp3`, TWI_BOX, \"twi\"),\n    recording(english, `${base}-en.mp3`, ENGLISH_BOX, \"en\"),\n  ]);\n}\n```\n\nRecommended filenames:\n\n```text\npage-03-twi.mp3\npage-03-en.mp3\n```\n\nUse one file with `lang: \"twi-en\"` only when the source recording intentionally alternates between Twi and English as one inseparable item, such as a bilingual question block.\n\n## 9. PDF and Page Image Processing\n\nThe app does not render PDFs in the browser. Every PDF page is converted to a JPEG before deployment.\n\nCurrent image conventions:\n\n- Filenames: `page-01.jpg`, `page-02.jpg`, and so on\n- Page numbers use two-digit zero padding.\n- Current final pages are 1191 x 1684 JPEG images.\n- CSS fixes the page ratio with `aspect-ratio: 816 / 1158`.\n\nExample conversion with Poppler:\n\n```sh\nmkdir -p picturebook/assets/book8\npdftoppm -jpeg -r 144 -jpegopt quality=82 \\\n  /path/to/ECCR_Book_8.pdf \\\n  /tmp/book8-page\n```\n\nRename and move the output into `picturebook/assets/book8/` using the project naming convention. When a source PDF is replaced, page count, page order, and text positions may change. Inspect every page and do not reuse old hotspot coordinates without verification.\n\n## 10. Recording Segmentation and Text Matching\n\nWhen a source recording contains a full page or full book, divide it into the smallest useful units represented by tappable text.\n\nRecommended process:\n\n1. Extract all visible PDF text in page order.\n2. Listen to the full recording and identify the start and end time of each visible item.\n3. Use a local ASR model such as Whisper only to produce draft timestamps.\n4. Manually verify Ghanaian English, Twi, and children's reading because ASR errors are likely.\n5. Exclude greetings, instructions, page announcements, `Thank you`, and other narration not printed in the book.\n6. Reuse one clip when exactly the same title appears on multiple pages with identical pronunciation.\n7. Create separate clips when individual words must be independently tappable.\n8. Check each final clip for excessive silence, clipped phonemes, and click noise.\n\nFFmpeg example:\n\n```sh\nffmpeg -y -i source.m4a -ss 12.40 -to 14.85 \\\n  -codec:a libmp3lame -b:a 96k \\\n  picturebook/audio/book8/page-03-01.mp3\n```\n\nValidation example:\n\n```sh\nffprobe -v error -show_entries format=duration \\\n  -of default=noprint_wrappers=1:nokey=1 \\\n  picturebook/audio/book8/page-03-01.mp3\n```\n\nMP3 is the preferred deployment format because it is small and broadly compatible. M4A and WAV are acceptable source formats, but the deployed package should normally contain MP3 files only.\n\n## 11. Adding a New Book\n\nFollow this order:\n\n1. Confirm the source PDF page count and page order.\n2. Render every page to JPEG and inspect the images visually.\n3. Place images in `picturebook/assets/bookN/`.\n4. Inventory all source recordings and their durations.\n5. Match the printed text to the recordings page by page.\n6. Split recordings into sentence or word clips where required.\n7. Place final MP3 files in `picturebook/audio/bookN/`.\n8. Add Book, Page, and AudioItem data to `picturebook/a4_books.js`.\n9. Use `missing(...)` for visible text that has no recording.\n10. Add all missing items to `MISSING_VOICE_RECORDINGS.md`.\n11. Run `npm run build:offline`.\n12. Increment the service worker cache name and both HTML asset query versions.\n13. Validate syntax, file references, playback, mobile hotspots, and offline behavior.\n14. Commit and push to `main` to deploy through GitHub Pages.\n\nMinimal book example:\n\n```js\n{\n  id: \"book8\",\n  title: \"Book8\",\n  assetDir: \"assets/book8\",\n  pages: [\n    page(1, \"Book title\", [\n      recording(\"Book title\", \"audio/book8/title.mp3\", COVER_BOX, \"en\"),\n    ]),\n    page(2, \"Sentence Practice\", [\n      recording(\n        \"This is a sentence.\",\n        \"audio/book8/page-02-01.mp3\",\n        { x: 15, y: 60, w: 70, h: 8 },\n        \"en\"\n      ),\n    ]),\n  ],\n}\n```\n\n## 12. Picture Book Runtime\n\nMain state in `picturebook/app.js`:\n\n```js\n{\n  bookId,\n  pageIndex,\n  audio,\n  playbackToken,\n  englishVoice,\n  twiVoice\n}\n```\n\nImportant behavior:\n\n- Changing books selects page 1, stops audio, and rerenders the screen.\n- Changing pages stops audio and rerenders the image, title, counter, and hotspots.\n- Tapping text stops the previous recording before starting the new one.\n- `playbackToken` prevents delayed `ended` or `error` events from an old recording from clearing a newer playing state.\n- Left Arrow selects the previous page.\n- Right Arrow or Space selects the next page.\n- Mobile hides the left/right page buttons and uses the numbered navigation below the book.\n\nHotspots are absolutely positioned buttons over the page image. They have `title` and `aria-label` attributes but remain visually transparent.\n\n## 13. Audio Practice Runtime\n\nThe `audio/` app uses the same `ECCR_A4_BOOKS` data and provides:\n\n- Book selection\n- A selectable page list\n- A list of all audio items on the page\n- An individual `Listen` control\n- A `Play page` action that plays page items in order\n\n`sequenceToken` cancels an earlier page-play sequence when the user changes context or starts another action.\n\n## 14. Responsive UI Requirements\n\nPicture Book on desktop:\n\n- Use a three-row layout: header, centered page, and bottom page navigation.\n- Fit the page to both viewport height and width, with a maximum width of 720px.\n- Show previous and next page controls at the sides.\n\nPicture Book on mobile (`max-width: 820px`):\n\n- Do not use a fixed header. It must scroll away so it does not cover the book.\n- Rearrange header controls into two columns.\n- Let the book selector and status use full width.\n- Fit the page to screen width and remove the desktop shadow and rounded corners.\n- Hide side page controls.\n- Keep the numbered page controls large enough for touch.\n\nTarget browsers:\n\n- Current Safari, Chrome, and Edge\n- iPhone/iPad through Safari or Add to Home Screen\n- Android through Chrome or installed PWA\n- Standard Windows desktops, including HP computers, through Chrome or Edge\n\n## 15. PWA and Offline Architecture\n\n### File Responsibilities\n\n- `manifest.webmanifest`: installation name, start URL, scope, and standalone display\n- `pwa.js`: service worker registration, save requests, and progress UI\n- `offline-assets.js`: generated list of all files required offline\n- `sw.js`: cache population, version cleanup, fetch handling, and media ranges\n\n### Offline Save Flow\n\n1. The page registers root-level `sw.js`.\n2. During installation, the worker attempts to cache the core files and the full offline package.\n3. Selecting `Save offline` sends `CACHE_ALL_OFFLINE_ASSETS`.\n4. The worker downloads only missing files in batches of four.\n5. The worker reports progress with `OFFLINE_PROGRESS`.\n6. The UI displays `Offline ready` after every asset is present.\n7. Same-origin requests are then served cache-first.\n\n### MP3 Range Requests\n\nSafari and Chrome can request audio using the HTTP `Range` header. Returning an ordinary cached response may cause offline MP3 playback to fail.\n\n`createRangeResponse()` in `sw.js` slices the cached Blob and returns `206 Partial Content` with:\n\n- `Accept-Ranges`\n- `Content-Length`\n- `Content-Range`\n- `Content-Type`\n\nDo not remove this logic.\n\n### User Instructions\n\n```text\nTo use the app without an internet connection, click Save Offline while you are online and wait until Offline Ready appears. After that, you can access the books and audio offline using the same browser. This works the same way on desktop computers.\n```\n\nOn iPhone, users can open the site in Safari and select Share > Add to Home Screen. The initial download must finish while connected to the internet. The learner must continue using the same browser profile or installed home-screen app.\n\nOffline data can be removed if the browser evicts storage or the user clears site data.\n\n## 16. Cache Updates After Content Changes\n\nAfter changing any image, MP3, HTML, CSS, or JavaScript file:\n\n1. Regenerate the offline list:\n\n```sh\nnpm run build:offline\n```\n\n2. Change `CACHE_NAME` in `sw.js` to a new unique value:\n\n```js\nconst CACHE_NAME = \"eccr-final-books-YYYYMMDD-N\";\n```\n\n3. Update the matching `?v=` query values in `picturebook/index.html` and `audio/index.html`.\n4. Run `npm run check` again.\n5. After deployment, open the app online and select `Save offline` until `Offline ready` appears.\n\nWithout a new cache name, installed users can remain on old images or JavaScript. Never edit `offline-assets.js` manually because it is generated.\n\n## 17. Local Development and Verification\n\nRun from the repository root:\n\n```sh\nnpm run check\nnpm run serve\n```\n\nLocal addresses:\n\n```text\nhttp://localhost:4173/\nhttp://localhost:4173/picturebook/\nhttp://localhost:4173/audio/\n```\n\nDo not open the HTML directly through `file://`; service workers and relative paths require an HTTP server.\n\n### Minimum Verification Checklist\n\n- `npm run check` passes.\n- Every image referenced by `a4_books.js` exists.\n- Every referenced `audioSrc` file exists.\n- Books appear in ascending Book number order.\n- Every page image appears in the correct order and aspect ratio.\n- Every word, sentence, and heading hotspot is aligned correctly.\n- Twi text plays Twi audio and English text plays English audio.\n- Selecting another item immediately starts the new recording without stale UI state.\n- Blank and credit pages do not contain accidental hotspots.\n- The mobile header scrolls and does not obscure the book.\n- `Save offline` reaches `Offline ready`.\n- In airplane mode, fully close and reopen the app, then verify images and audio.\n- Repeat offline testing on desktop in the same browser profile.\n\n`npm run check` validates JavaScript syntax only. It does not verify referenced files, hotspot coordinates, playback correctness, or offline restart behavior. Those require additional checks and browser QA.\n\n## 18. Deployment\n\n`.github/workflows/pages.yml` deploys the static repository to GitHub Pages whenever `main` is pushed.\n\n```sh\ngit status --short\ngit add \u003cchanged-files>\ngit commit -m \"Describe the ECCR update\"\ngit push origin main\n```\n\nDeployment verification:\n\n```sh\ngh run list --workflow pages.yml --limit 1\ngh run watch \u003crun-id>\n```\n\nAn existing installation can briefly show the old version after a successful deployment because of its service worker cache. Verify the service worker cache name and HTML query versions first.\n\nNetlify and Vercel can also serve the project without a build step. Use the repository root as the publish directory. HTTPS is required for service workers.\n\n## 19. Missing Recordings\n\nUse `MISSING_VOICE_RECORDINGS.md` as the authoritative list, including suggested filenames. Current missing items are:\n\n- Book2 p17: `Kenkan bio.`\n- Book3 p1/p2: `Asante Twi Reading Practice`\n- Book3 p30: `Kenkan bio.`\n- Book4 p1: `Aku and the Cat.`\n- Book4 p10: `Kenkan bio.`\n- Book4 p10: `Read again.`\n- Book6 p1/p2: `Twi Letter Cards`\n- Book7 p1/p2: `Short /a/ Reader`\n\nWhen a new recording arrives:\n\n1. Add it to the correct `picturebook/audio/bookN/` directory.\n2. Replace the corresponding `missing(...)` item with `recording(...)`.\n3. Remove the resolved row from `MISSING_VOICE_RECORDINGS.md`.\n4. Regenerate the offline list and increment the cache version.\n5. Verify playback both online and after a cold airplane-mode restart.\n\n## 20. Known Constraints and Future Improvements\n\n- Items without teacher recordings remain silent on the static GitHub Pages deployment.\n- Voice selectors do not affect packaged recordings. A future static-only UI could hide them or label the source as `Recorded voice`.\n- Downloading every book and recording at once will become slower and consume more storage as the library grows.\n- For a larger library, provide separate `Save all books` and `Save selected book` actions.\n- Hotspot coordinates are currently entered manually in code. If books are added frequently, create an admin tool that lets an editor click and drag over a page image to generate coordinates.\n- Automated transcription is only a timestamping aid and must not be treated as final validation of Twi text or pronunciation.\n\n## 21. Instructions for Another LLM\n\nUse the following as the implementation prompt:\n\n```text\nYou are maintaining the ECCR static picture-book PWA.\nRead TECHNICAL_HANDOFF_EN.md, README.md, picturebook/a4_books.js,\npicturebook/app.js, pwa.js, and sw.js before editing.\n\nUse the existing data model and relative-path rules. Do not replace recorded\nteacher audio with browser TTS. If visible text has no recording, mark it with\nrecordingMissing and update MISSING_VOICE_RECORDINGS.md. For bilingual pages,\nmap Twi and English text to separate language-correct clips and hotspots.\n\nAfter every content or asset change, regenerate offline-assets.js, bump the\nservice-worker cache version and HTML asset query versions, run syntax and\nreference checks, test desktop/mobile playback, and verify a cold offline\nrestart. Do not deploy until all referenced files return successfully.\n```\n\n## 22. Definition of Done\n\nA new implementation or maintenance change is complete only when:\n\n- Page images, order, and printed text match the supplied final PDF.\n- Every hotspot is aligned with the actual printed text.\n- Every hotspot plays only the correct language and recording.\n- Packaged recordings work without an external server or developer laptop.\n- The UI does not overlap or clip on mobile and desktop.\n- The app can be fully reopened offline after its initial online save.\n- Every changed asset is present in the offline list and a new cache version is deployed.\n- The GitHub Pages workflow succeeds and the production URL is verified.\n\n", "url": ""}, "book/output/pdf/최종/APP_AUDIO_SYNC_REVIEW_20260915.md": {"text": "# ECCR textbook / assessment / app-audio synchronization review\n\nCompleted: 15 September 2026. Working folder retains the start date, `followup_20260914`.\n\n## 완료 범위\n\n1. 최종 교재의 수정 사항을 반영해 Assessment 4–7을 갱신했습니다. Assessment 1–3은 이번 대화로 인한 추가 변경이 없어 유지했습니다.\n2. 앱의 등록 문장·재생 영역·음성 파일 연결을 교재와 대조했습니다. 앱 수정, 배포, 음성 편집·재녹음은 수행하지 않았습니다.\n3. Book 8·9의 표지, 표지 다음 장, 마지막 장을 Book 7의 공통 디자인에 맞췄습니다. 표지에는 페이지 번호가 없습니다. 앞서 수정한 본문 3–11페이지는 픽셀 비교로 보존을 확인했습니다.\n\nPDF 페이지 번호는 표지를 1로 세는 물리적 페이지입니다. 본문에 인쇄된 번호와 구별하세요.\n\n## Assessment changes\n\n| Book | Changes |\n|---|---|\n| 4 | Sentence reading: `Ɔkra no ho hia.` |\n| 5 | `Ako no nom nsuo.`; questions `Aduane bɛn na ako no di?` and `Deɛn na ako no nom?` |\n| 6 | Use **Digraphs**; remove English-meaning-dependent items. Assess Twi sounds, example words, word construction and writing. Teacher dictates whole words **hyɛ, nyɛ, kwaeɛ, nwom** for the completion items; answers **hy, ny, kw, nw**. Yaw validates accepted sounds. |\n| 7 | `The cat sat on the mat.` / `Sam and the cat sat on the mat.` / `The cat ran after the …` and revised textbook illustration thumbnails. |\n\nAll four remain three-page, A4, 20-point book-specific achievement checks—not entry baselines or standardized tests. Full-scene thumbnails and Teacher-label spacing are retained. The teacher references match the revised items.\n\n## Evidence and limitations\n\n- App: https://jieunjanetsong.github.io/eccr-picture-audio-site/picturebook/\n- Local repository: `/Users/janetmath/janet/speech/eccr-picture-audio-site`\n- Shared metadata: `picturebook/a4_books.js`; used by both picturebook and audio interfaces.\n- Downloaded deployed metadata matches the local file byte-for-byte: SHA-256 `e9bbb39959450cca0d0794b39415a517869a687eadae3f30bc4ae74a12c75f67`.\n- The adjacent JSON contains every registered audio item, its PDF page and local file-existence check.\n- **Registered speechText is not proof of what a recording actually says.** Audio pronunciation has not been independently certified. Items below distinguish definite metadata differences from listening/re-recording decisions for Yaw. No Twi pronunciations have been invented.\n\n## Page-by-page action list\n\n| Book / PDF page | Confirmed metadata or asset work | Recording action |\n|---|---|---|\n| 1 / 4 | `Mehyɛ ataade fitaa.` → `Mehyɛ ataadeɛ fitaa.` (final page checked visually) | Listen to `audio/book1/page-04.mp3`; replace only if needed. |\n| 1 / 6 | `Kraman no di emo.` → `Kraman no di ɛmo.` (final page checked visually) | Yaw checks `audio/book1/page-06.mp3`; spelling mismatch alone does not prove incorrect sound. |\n| 2 / 17 | Existing `Kenkan bio.` item has no recording. | Record if this prompt remains interactive; question audio is a separate item. |\n| 3 / 1–2, 30 | Title audio and `Kenkan bio.` are marked missing. | Title may share one optional clip; record the reading prompt if retained. |\n| 4 / 1, 3–8 | Remove English translation audio entries and English hotspots, consistent with revised Twi learner pages. | Retire English playback; no replacement English recording needed. |\n| 4 / 8 | `Ɔkra ho hia.` → `Ɔkra no ho hia.` | Check `audio/book4/page-08-twi.mp3`. Yaw's conversation says the recording already includes **no**; confirm before requesting another recording. |\n| 4 / 9 | Questions must be Twi-only; old item is bilingual. | Listen to `audio/book4/page-09.mp3`; trim or re-record only if it actually includes English. |\n| 4 / 10 | Keep Twi `Kenkan bio.` request; remove missing English `Read again.` request. | Twi prompt still missing; English is no longer needed. |\n| 5 / 1, 3–8 | Remove English translation entries/hotspots. | Retire English playback. The pecks/eats translation correction is not a new learner-audio requirement. |\n| 5 / 6 | `Ako nom nsuo.` → `Ako no nom nsuo.` | Check `audio/book5/page-06-twi.mp3` for **no**. |\n| 5 / 9 | Use `Aduane bɛn na ako no di?`; questions Twi-only. | Check `audio/book5/page-09.mp3`; adjust omitted **no** / English only if present in the actual clip. |\n| 6 / 3–11 | Keep the nine Twi digraph/example pairs; remove English glosses from registered text. Rename consonant blends to digraphs where displayed. | Nine `audio/book6/page-XX.mp3` clips need Yaw's listening check. Reuse if already Twi-only; edit/re-record if they contain the removed glosses. |\n| 6 / 1–2 | Existing `Twi Letter Cards` title clips are missing. | Optional branding clips, separate from assessed sound accuracy. |\n| 7 / 4 | `The cat sat.` → `The cat sat on the mat.` | Check/replace `audio/book7/page-04-02.mp3`. |\n| 7 / 5 | `Sam and the cat sat.` → `Sam and the cat sat on the mat.` | Check/replace `audio/book7/page-05-03.mp3`. |\n| 7 / 6 | `The cat ran at a rat.` → `The cat ran after the rat.` | Check/replace `audio/book7/page-06-04.mp3`. |\n| 7 / 6 | `Sam and the cat sat.` → `Sam and the cat sat on the mat.` | Check/replace `audio/book7/page-06-05.mp3`; can reuse the identical approved sentence clip from page 5. |\n| 7 / 1–2 | `Short /a/ Reader` subtitle audio is missing. | Optional; do not confuse with missing story sentences. |\n| 8–9 | Not registered in current app metadata. | New image/metadata/audio integration is required; do not label these books synchronized yet. |\n\n### Image and interaction updates\n\n- Re-export revised Book 4–7 PDF pages as app images. Book 4–5 English text has been removed; Book 6 pictures are enlarged; Book 7 pages 4–5 have revised illustrations and pages 10–11 have repaired blank-page content.\n- Export all 12 pages each of the newly styled Book 8 and Book 9.\n- Re-measure clickable text boxes on the exported pages. Delete English hotspots in Books 4–6; Book 6 needs separate digraph/example-word hit areas that avoid the enlarged illustration. Extend Book 7 sentence boxes for wrapped longer text.\n- Preserve the revised Book 1–3 images; confirm existing deployed images against these PDFs before deciding any further replacements.\n- After authorized implementation, test **both** readers, regenerate `offline-assets.js` with the repository build command, update the service-worker cache version, and check online plus offline playback. No deployment occurred as part of this review.\n\n## Book 8–9 narration handoff\n\nUse the new final PDFs as the authority, not old app scripts. Suggested new story recordings are listed below; title/word-bank/question recordings are separate optional decisions. Record only text, not the printed page number or character credit.\n\n### Book 8 — The Duck in the Pond\n\n- PDF 4: Here are Sam and Ama. Sam is a boy. He is sitting on the mat. Ama is a girl. She is sitting beside the mat.\n- PDF 5: He can see the cat. She can see the cat too.\n- PDF 6: One day, the boy and the girl sat by a pond.\n- PDF 7: They saw a duck in the pond. The duck was glad to see them.\n- PDF 8: The boy was glad. The girl was glad.\n- PDF 3 word bank / PDF 9 questions: add separately if those interactions are wanted.\n\n### Book 9 — The Little Fox\n\n- PDF 3: Once upon a time, there was a hunter and his wife who lived very well and happily. They had a son called Baah.\n- PDF 4: One day the hunter caught a baby fox and brought him home to his son as a gift. The boy liked him very much.\n- PDF 5: The little fox was very quick and mischievous. The boy liked him very much. They played together.\n- PDF 6: But one day the mother returned at midday. The little fox did not run to meet her. Instead, he sat near the door and whined sadly. The woman saw that the fox was covered with blood.\n- PDF 7: “Oh, no! The fox has attacked my child!” the woman cried. She grabbed a rock, hit the little fox, and with a terrible howl, the mother ran into the house.\n- PDF 8: There was her little son. He was laughing happily and playing. Next to him was a large dead snake that had been torn to pieces.\n- PDF 9: “Oh, no!” the woman wept. “What have I done!” She was angry at herself for having been so quick to blame the fox.\n\nThe subject **the mother** on Book 9 PDF 7 follows Yaw's explicit correction. Do not silently change it to the fox.\n\n## Files and preservation\n\n- New deliverables: `ECCR_Book4_Assessment.pdf` through `ECCR_Book7_Assessment.pdf`, `ECCR_Book_8.pdf`, `ECCR_Book_9.pdf`.\n- Existing assessments are backed up before installation. Earlier Book 8/9 review PDFs are retained.\n- Reproducible builder: `build_followups.py`; verification: `verify_followups.py`; evidence: `verification_and_audio_inventory.json` in the working folder.\n- This update does not modify Writing Book, entry baselines, Book 1–3 assessments, original chat exports, or the live app.\n", "url": ""}, "book/output/pdf/최종/REVISION_NOTES_20260914.md": {"text": "# ECCR textbook revisions — 14 September 2026\n\n## 기준과 범위 / Basis and scope\n\n`_chat 14.txt`의 Gertrude 의견과 `_chat 15.txt`의 Yaw 답변을 대조했습니다. 의견이 달랐던 부분은 Yaw가 최종 확인한 문장을 적용했습니다. 본 교재 수정이며 평가책, 쓰기책, 앱과 음성 파일은 이번 작업에 포함하지 않았습니다.\n\nBook 4–7은 `최종/ECCR_Book_N.pdf`를 원본으로 사용했습니다. Book 8·9는 최종 폴더에 없어서 기존 `a4/ECCR_Book_8_A4_print.pdf`, `a4/ECCR_Book_9_A4_print.pdf`로 별도 검토 수정본을 만들었습니다. 해당 두 권의 기존 표지·속지 디자인은 이번 내용 교정에서 유지했습니다.\n\n페이지 표기는 책에 인쇄된 번호 기준입니다. 아래 본문 페이지의 실제 PDF 순번은 인쇄 번호보다 1 큽니다.\n\n## 수정 내용\n\n| 책 | 인쇄 페이지 | 반영 사항 |\n|---|---|---|\n| 4 | 표지, 2–9 | 9월 11일 Yaw 의견에 따라 학습자용 영어 번역을 삭제. 표지 언어를 Asante Twi로 정리하고 질문 페이지도 Twi만 표시. |\n| 4 | 7 | `Ɔkra ho hia.` → `Ɔkra no ho hia.`. Gertrude 메시지의 `ne` 대신 9월 4일 Yaw가 명시한 `no`를 사용. |\n| 5 | 표지, 2–8 | 학습자용 영어 번역 삭제. 표지 언어를 Asante Twi로 정리. |\n| 5 | 5 | `Ako nom nsuo.` → `Ako no nom nsuo.` |\n| 5 | 8, 질문 2 | 이야기 속 특정 앵무새를 가리키도록 `Aduane bɛn na ako no di?`로 정리. Gertrude의 a/the 지적과 Yaw의 필요한 수정 동의를 반영한 편집. |\n| 6 | 표지·속지·1–9 | Twi 학습 집중 원칙을 letter cards에도 적용해 영어 뜻풀이 제거. `Consonant blends` → `Digraphs` (Yaw의 5월 14일 원안과 9월 3일 설명). Twi 예시와 9개 digraph는 유지하고 그림을 확대 배치. |\n| 7 | 3 | `The cat sat on the mat.`. 고양이가 실제로 매트에 앉아 있도록 그림 수정. |\n| 7 | 4 | `Sam and the cat sat on the mat.`. 두 캐릭터 모두 매트 위에 있도록 그림 수정. |\n| 7 | 5 | `The cat ran after the rat.` 및 `Sam and the cat sat on the mat.` |\n| 7 | PDF 10·11 | 원본의 잘못된 빈 content 참조를 제거하고, 꼬마 캐릭터를 유지하면서 빈 페이지의 크림색 배경과 테두리 복원. |\n| 8 | 3 | `Here are Sam and Ama. Sam is a boy. He is sitting on the mat. Ama is a girl. She is sitting beside the mat.` |\n| 8 | 4 | 제목 `They Can See the Cat`. 본문 `He can see the cat. She can see the cat too.` |\n| 8 | 6 | `The duck was glad to see them.` |\n| 9 | 2 | 첫 문단에 `They had a son called Baah.` 반영 (`call`의 문법 교정 포함). |\n| 9 | 5 | `But one day the mother returned at midday.`로 대명사의 지칭 대상 명확화. |\n| 9 | 6 | `Oh, no!`로 수정하고, Yaw의 9월 11일 최종 문장에 따라 `... with a terrible howl, the mother ran into the house.` 반영. |\n| 9 | 8 | `Oh, oh` → `Oh, no!` |\n\n## 기존 반영 확인 / Already reflected\n\nBook 1의 `Mekɔ sukuu.`, `M’AKYERƐKYERƐFOƆ`, ADESUA의 `Metwerɛ m’adeɛ yie.`, 오른손을 든 학생과 Akenkan 칠판 내용을 확인했습니다. Book 2의 9월 수정 문장(`Ama twerɛ ne din.`, `Wɔpɔn a, wɔboa wɔ dwa so.`, `Anwummerɛ` 등)은 최종본에 이미 반영되어 있습니다. Book 3은 Yaw가 9월 3일 검토 완료로 확인했으며 이후 해당 교재 내용 교정은 없습니다.\n\n## Teacher reference only — English meanings\n\nThe learner editions of Books 4–6 now focus on Twi, following Yaw's 11 September instruction. The English corrections therefore belong in a teacher reference, rather than beneath the Twi learner text:\n\n- Book 4, printed p5: **Aku likes the cat.**\n- Book 4, printed p6: **The cat also likes Aku.**\n- Book 4, printed p7: **The cat is important.**\n- Book 5, printed p5: **The parrot drinks water.**\n- Book 5, printed p6: **The parrot eats maize.** (Use *eats*, not *pecks*, for the proposed Basic 1 English wording.)\n- Book 5, question 2: **What food does the parrot eat?**\n\nThese are meanings, not pronunciation guidance. No letter pronunciations were generated or guessed.\n\n## 후속 제작 제안 / Future development identified in the chats\n\nYaw가 제안한 Book 0(단일 글자 소리), a–z와 ɛ·ɔ 카드, 4글자 이내의 짧은 단어 중심 영어 decodable reader는 별도의 신규 교재 제작에 해당합니다. 본 교재를 그 제안으로 대체하거나 새 책 번호를 부여하지 않았습니다. 수정된 본문과 연결된 평가책 및 앱·음성은 이후 이 수정본에 맞추어 동기화할 수 있습니다.\n\n## 검증 및 재현 / Verification and reproduction\n\n수정 6권은 각 12페이지 A4 세로이며, 전체 72페이지를 렌더링했습니다. 수정 페이지의 글자·줄바꿈·본문 상자와 두 그림을 시각 점검했습니다. Poppler로 Book 6, Book 7의 복원 빈 페이지, Book 9의 긴 문단도 확인했습니다. PDF 스트림 검사와 MuPDF 전체 렌더에서 경고가 없었습니다. 원본 경로와 SHA-256은 `source_manifest.json`에 기록했습니다.\n\n편집 코드: `revise_books.py`. 원본을 보존한 상태에서 실행합니다. 최종 폴더 적용은 별도 `install_revisions.py`가 원본 해시를 확인하고 백업 후 수행합니다.\n\n그림은 기본 내장 imagegen을 사용했습니다. 프로젝트 자산은 같은 폴더의 `cat_on_mat.png`, `sam_and_cat_on_mat.png`입니다. 프롬프트의 핵심은 각각 ‘기존 고양이와 배경을 유지하고 고양이 아래에 매트를 추가’, ‘기존 샘과 고양이를 유지하고 같은 매트를 샘의 발·무릎 아래까지 확장’입니다. 전체 제작 프롬프트는 `IMAGE_PROMPTS.md`에 기록했습니다.\n", "url": ""}, "과정/HANDOFF.md": {"text": "# Codex Handoff\n\nDate: 2026-05-13\n\nThis Dropbox folder contains the current working files for the Ghana Basic 1 Asante Twi reader project. The chat history itself may not sync through Dropbox, so a new Codex session on another computer should start by reading this file and inspecting the files listed below.\n\n## Current Folder\n\n`/Users/janetmath/Dropbox/mina-janet/________아프리카-가나/가나교사와2026/야우`\n\n## Main Deliverable\n\n- `book2.pdf`\n  - Current final PDF for `PROJECT: MA YƐNSUA AKENKAN (Basic 1 Twi Reader)`.\n  - 28 pages.\n  - Portrait layout.\n  - Image at the top, Twi text at the bottom.\n  - Text is set in Times New Roman Bold, not baked into the images.\n  - Built from `book2.tex`.\n\n## Source Files\n\n- `book2.tex`\n  - Main LaTeX source.\n  - Uses XeLaTeX.\n  - Uses Times New Roman from macOS:\n    `/System/Library/Fonts/Supplemental/Times New Roman.ttf`\n    and\n    `/System/Library/Fonts/Supplemental/Times New Roman Bold.ttf`\n  - If building on another OS, update the font path or install Times New Roman.\n\n- `book2_assets/`\n  - Contains the imagegen-generated image sheets and the cropped page images.\n  - Important files:\n    - `set1.png`\n    - `set2.png`\n    - `set3.png`\n    - `story.png`\n    - `page01.png` through `page27.png`\n  - The page images are the actual images used by `book2.tex`.\n\n## Build Command\n\nRun from this folder:\n\n```bash\nxelatex -interaction=nonstopmode -jobname=book2 book2.tex\n```\n\nExpected result:\n\n- `book2.pdf`\n- 28 pages\n\nUseful checks:\n\n```bash\npdfinfo book2.pdf\npdffonts book2.pdf\npdftotext -f 1 -l 28 book2.pdf -\nrg \"Missing character|Illegal unit|^!\" book2.log\n```\n\nRepresentative preview render commands:\n\n```bash\npdftoppm -png -f 1 -l 1 -singlefile book2.pdf book2_preview_p01\npdftoppm -png -f 20 -l 20 -singlefile book2.pdf book2_preview_p20\npdftoppm -png -f 28 -l 28 -singlefile book2.pdf book2_preview_p28\n```\n\n## Page Text Map\n\n1. Fa bi\n2. Ka bi\n3. Di bi\n4. Sa fa\n5. Tu kɔ\n6. Kɔ da\n7. Yi bi di\n8. Sa bi we\n9. Ka bi fa\n10. Ma me bi\n11. Te me so\n12. Ka bi we\n13. Fa bi si me so\n14. Sa bi gu me ho\n15. To bi gu me ho\n16. Yi bi ma me\n17. To bi ma yɛn\n18. Ka bi na fa\n19. Papa Musa\n20. Papa Musa wɔ nkokɔ mmienu, mpɔnkye mmienu ne mma baanu.\n21. Ne ba barima ne Ali.\n22. Ne ba baa ne Alima.\n23. Anɔpa biara, Ali pra mmoa no buo no mu.\n24. Ɔma mmoa no aduane di.\n25. Anɔpa biara, Alima pra adihɔ.\n26. Ɔma mmoa no nsuo nom.\n27. Wɔyɛ ntɛm kɔ sukuu.\n28. Nsɛmmisa page:\n    - LEVEL 1 — Recall\n    - 1. Hwan ne Ali?\n    - 2. Nkokɔ sɛn na Papa Musa wɔ?\n    - LEVEL 2 — Understanding\n    - 3. Adwuma bɛn na Ali yɛ no anɔpa?\n    - 4. Adwuma bɛn na Alima yɛ no anɔpa?\n    - LEVEL 3 — Thinking\n    - 5. Adɛn nti na wɔboa mmoa no?\n    - 6. Wo nso, deɛn na woyɛ ansa na wakɔ sukuu?\n    - Kenkan bio.\n\n## Current Visual Approach\n\nThe first version of `book2.pdf` used deterministic TikZ drawings. The user then requested `$imagegen book2를 다시 작업해줘`, so the current version uses generated raster illustrations.\n\nImportant design choices:\n\n- Images are generated separately and saved into `book2_assets/`.\n- Twi text is not part of the generated images.\n- This avoids incorrect AI-generated text inside images.\n- Page 20 is important for teaching counting:\n  - exactly 2 chickens\n  - exactly 2 goats\n  - exactly 2 children\n\n## Verification Already Done\n\nThe latest build was checked with:\n\n- `pdfinfo book2.pdf`: 28 pages.\n- `pdffonts book2.pdf`: TimesNewRomanPS-BoldMT embedded.\n- `pdftotext -f 1 -l 28 book2.pdf -`: Twi text extracted correctly, including `ɔ`, `ɛ`, and `Ɔ`.\n- Rendered and visually checked representative pages:\n  - page 1\n  - page 20\n  - page 28\n\n## Notes for Another Codex Session\n\nStart with:\n\n```text\n이 폴더의 HANDOFF.md를 읽고 book2.pdf/book2.tex/book2_assets를 확인한 뒤 이어서 작업해줘.\n```\n\nIf the new computer cannot build the PDF, first check:\n\n- XeLaTeX is installed.\n- Times New Roman exists at the expected path.\n- `book2_assets/page01.png` through `book2_assets/page27.png` are present after Dropbox sync.\n\nIf font paths differ, update `book2.tex` near the `\\setmainfont` block.\n\n## Related Previous Files\n\nEarlier work in this folder may include:\n\n- `Yaw_Janet_16pages_times_new_roman.pdf`\n- other page 7 test PDFs or TeX files\n\nThose are separate from the current `book2.pdf` task.\n", "url": ""}, "book/v.0/book2.tex": {"text": "\\documentclass[12pt]{article}\n\\usepackage[\n  paperwidth=148mm,\n  paperheight=210mm,\n  margin=0mm\n]{geometry}\n\\usepackage{fontspec}\n\\usepackage{xcolor}\n\\usepackage{graphicx}\n\\usepackage{tikz}\n\n\\setmainfont[\n  Path=/System/Library/Fonts/Supplemental/,\n  UprightFont={Times New Roman.ttf},\n  BoldFont={Times New Roman Bold.ttf}\n]{Times New Roman}\n\n\\pagestyle{empty}\n\\setlength{\\parindent}{0pt}\n\\setlength{\\topskip}{0pt}\n\n\\definecolor{ink}{HTML}{111111}\n\\definecolor{whitepanel}{HTML}{FFFDF7}\n\\definecolor{linegray}{HTML}{D8D1C4}\n\\definecolor{green}{HTML}{16824B}\n\n\\newcommand{\\pagenum}[1]{%\n  \\draw[green,line width=0.45mm] (136,9) circle (4.2);\n  \\node[text=green,font=\\fontsize{11}{12}\\selectfont\\bfseries] at (136,9) {#1};\n}\n\n\\newcommand{\\sentence}[2]{%\n  \\node[\n    text=ink,\n    align=center,\n    text width=132mm,\n    font=\\fontsize{#2pt}{\\dimexpr #2pt + 6pt\\relax}\\selectfont\\bfseries\n  ] at (74,25) {#1};\n}\n\n\\newcommand{\\imagepage}[4]{%\n\\noindent\n\\begin{tikzpicture}[x=1mm,y=1mm]\n  \\fill[whitepanel] (0,0) rectangle (148,210);\n  \\node[inner sep=0pt] at (74,129) {%\n    \\includegraphics[width=136mm,height=146mm,keepaspectratio]{#3}%\n  };\n  \\fill[whitepanel] (0,0) rectangle (148,52);\n  \\draw[linegray,line width=0.4mm] (0,52) -- (148,52);\n  \\sentence{#2}{#4}\n  \\pagenum{#1}\n\\end{tikzpicture}\n\\newpage\n}\n\n\\newcommand{\\questiontext}[1]{%\n  \\node[\n    text=ink,\n    align=left,\n    text width=126mm,\n    font=\\fontsize{15}{21}\\selectfont\\bfseries\n  ] at (76,93) {#1};\n}\n\n\\begin{document}\n\n\\imagepage{1}{Fa bi}{book2_assets/page01.png}{34}\n\\imagepage{2}{Ka bi}{book2_assets/page02.png}{34}\n\\imagepage{3}{Di bi}{book2_assets/page03.png}{34}\n\\imagepage{4}{Sa fa}{book2_assets/page04.png}{34}\n\\imagepage{5}{Tu kɔ}{book2_assets/page05.png}{34}\n\\imagepage{6}{Kɔ da}{book2_assets/page06.png}{34}\n\n\\imagepage{7}{Yi bi di}{book2_assets/page07.png}{32}\n\\imagepage{8}{Sa bi we}{book2_assets/page08.png}{32}\n\\imagepage{9}{Ka bi fa}{book2_assets/page09.png}{32}\n\\imagepage{10}{Ma me bi}{book2_assets/page10.png}{32}\n\\imagepage{11}{Te me so}{book2_assets/page11.png}{32}\n\\imagepage{12}{Ka bi we}{book2_assets/page12.png}{32}\n\n\\imagepage{13}{Fa bi si me so}{book2_assets/page13.png}{27}\n\\imagepage{14}{Sa bi gu me ho}{book2_assets/page14.png}{27}\n\\imagepage{15}{To bi gu me ho}{book2_assets/page15.png}{27}\n\\imagepage{16}{Yi bi ma me}{book2_assets/page16.png}{27}\n\\imagepage{17}{To bi ma yɛn}{book2_assets/page17.png}{27}\n\\imagepage{18}{Ka bi na fa}{book2_assets/page18.png}{27}\n\n\\imagepage{19}{Papa Musa}{book2_assets/page19.png}{34}\n\\imagepage{20}{Papa Musa wɔ nkokɔ mmienu,\\\\mpɔnkye mmienu ne mma baanu.}{book2_assets/page20.png}{17}\n\\imagepage{21}{Ne ba barima ne Ali.}{book2_assets/page21.png}{25}\n\\imagepage{22}{Ne ba baa ne Alima.}{book2_assets/page22.png}{25}\n\\imagepage{23}{Anɔpa biara, Ali pra mmoa no buo no mu.}{book2_assets/page23.png}{18}\n\\imagepage{24}{Ɔma mmoa no aduane di.}{book2_assets/page24.png}{24}\n\\imagepage{25}{Anɔpa biara, Alima pra adihɔ.}{book2_assets/page25.png}{20}\n\\imagepage{26}{Ɔma mmoa no nsuo nom.}{book2_assets/page26.png}{24}\n\\imagepage{27}{Wɔyɛ ntɛm kɔ sukuu.}{book2_assets/page27.png}{25}\n\n\\noindent\n\\begin{tikzpicture}[x=1mm,y=1mm]\n  \\fill[whitepanel] (0,0) rectangle (148,210);\n  \\node[text=ink,font=\\fontsize{24}{29}\\selectfont\\bfseries] at (74,190) {Nsɛmmisa};\n  \\node[anchor=west,text=ink,font=\\fontsize{12}{14}\\selectfont\\bfseries] at (13,172) {LEVEL 1 — Recall};\n  \\questiontext{1. Hwan ne Ali?\\\\[3mm]\n  2. Nkokɔ sɛn na Papa Musa wɔ?\\\\[8mm]\n  LEVEL 2 — Understanding\\\\[3mm]\n  3. Adwuma bɛn na Ali yɛ no anɔpa?\\\\[3mm]\n  4. Adwuma bɛn na Alima yɛ no anɔpa?\\\\[8mm]\n  LEVEL 3 — Thinking\\\\[3mm]\n  5. Adɛn nti na wɔboa mmoa no?\\\\[3mm]\n  6. Wo nso, deɛn na woyɛ ansa na wakɔ sukuu?}\n  \\node[text=ink,font=\\fontsize{20}{24}\\selectfont\\bfseries] at (74,20) {Kenkan bio.};\n  \\pagenum{28}\n\\end{tikzpicture}\n\n\\end{document}\n", "url": ""}, "book/output/pdf/a4/phonics_abc_20260921/build_series.py": {"text": "\"\"\"Three parallel-scope Basic 1 English phonics readers; existing books untouched.\"\"\"\nfrom pathlib import Path\nimport hashlib\nimport json\nimport random\nimport re\nimport shutil\nimport sys\nfrom collections import Counter\n\nimport fitz\nfrom PIL import Image, ImageDraw\nfrom reportlab.pdfgen import canvas\nfrom reportlab.pdfbase import pdfmetrics\nfrom reportlab.pdfbase.ttfonts import TTFont\nfrom reportlab.lib.colors import HexColor, white\nfrom reportlab.lib.pagesizes import A4\nfrom reportlab.lib.units import mm\nfrom reportlab.lib.utils import ImageReader\nfrom reportlab.platypus import Paragraph\nfrom reportlab.lib.styles import ParagraphStyle\n\nROOT=Path(__file__).resolve().parent\nFINAL=ROOT.parent.parent/'최종'\nASSETS=ROOT/'assets'\nQA=ROOT/'qa'\nDATA=json.loads((ROOT/'manuscripts.json').read_text())\nW,H=A4\nGREEN=HexColor('#138754');DARK=HexColor('#126B46');INK=HexColor('#202923')\nCREAM=HexColor('#FFFCF5');PALE=HexColor('#EAF4ED');BLUE=HexColor('#E7F2F6')\nSAND=HexColor('#D8CCB7');MUTED=HexColor('#5D6C63');RED=HexColor('#D9535F')\nFONTROOT=Path('/System/Library/Fonts/Supplemental')\nfor name,file in [('Body','Arial.ttf'),('Bold','Arial Bold.ttf'),('Display','Times New Roman Bold.ttf')]:\n    pdfmetrics.registerFont(TTFont(name,str(FONTROOT/file)))\nC=None;BOOK='';PAGE=0;LOG=[];ANSWERS={};LINE_BOXES=[]\nHEART={'a','the','is','has','i'}\nVOWELS=set('aeiou')\n\n\ndef words(s):return re.findall(r'[A-Za-z]+',s)\ndef digest(p):return hashlib.sha256(p.read_bytes()).hexdigest()\n\n\ndef audit():\n    records=[];alltexts=[]\n    for book,bd in DATA['books'].items():\n        known=set()\n        for t in bd['texts']:\n            if t['target']=='mixed':known=set('aeiou')\n            else:known.add(t['target'])\n            n=t['number'];expected=5 if n\u003c=4 else 6 if n\u003c=10 else 7\n            assert len(t['sentences'])==expected,(t['id'],'sentence count')\n            passage=' '.join(t['sentences']);alltexts.append(passage)\n            terms=words(t['title']+' '+passage)+t['blend']\n            for q in t['questions']:terms += [q['answer'],q['distractor']]\n            for token in terms:\n                token=token.lower()\n                assert len(token)\u003c=4,(t['id'],token,'length')\n                if token in HEART:continue\n                assert (set(token)&VOWELS)\u003c=known,(t['id'],token,'untaught vowel')\n                assert token=='and' or re.fullmatch(r'[bcdfghjklmnpqrstvwxyz]?[aeiou][bcdfghjklmnpqrstvwxyz]?',token),(t['id'],token,'outside VC/CVC + and')\n            for item in t['blend']:\n                assert len(item)==3 and item[1].lower() in VOWELS,(t['id'],item)\n            hearts=[v for v in DATA['heart_words'] if v.lower() in {w.lower() for w in words(passage)}]\n            t['hearts']=hearts\n            chosen=next(v for v in reversed(t['blend']) if re.search(r'\\b'+v+r'\\b',passage,re.I))\n            line=next(s for s in t['sentences'] if re.search(r'\\b'+chosen+r'\\b',s,re.I))\n            match=re.search(r'\\b'+chosen+r'\\b',line,re.I)\n            actual=match.group(0)\n            cloze=line[:match.start()]+'______'+line[match.end():]\n            decoy=next(w for w in t['blend'] if w.lower()!=chosen.lower())\n            t['cloze']=dict(sentence=cloze,answer=actual,distractor=decoy)\n            records.append(dict(id=t['id'],target=t['target'],known_vowels=''.join(sorted(known)),\n                                sentence_count=len(t['sentences']),word_count=len(words(passage)),\n                                sentence_word_counts=[len(words(s)) for s in t['sentences']],\n                                heart_words=hearts,max_word_length=max(map(len,words(passage))),\n                                consonants=''.join(sorted(set(passage.lower())&set('bcdfghjklmnpqrstvwxyz')))))\n    assert len(set(alltexts))==36\n    (ROOT/'decoding_audit.json').write_text(json.dumps(records,indent=2))\n    return records\n\n\ndef txt(x,y,s,size=13,font='Body',color=INK,align='left'):\n    s=str(s);width=pdfmetrics.stringWidth(s,font,size)\n    left=x if align=='left' else x-width/2 if align=='center' else x-width\n    assert left>=27 and left+width\u003c=W-27,(BOOK,PAGE,s,left,width)\n    C.setFillColor(color);C.setFont(font,size)\n    if align=='center':C.drawCentredString(x,y,s)\n    elif align=='right':C.drawRightString(x,y,s)\n    else:C.drawString(x,y,s)\n    LINE_BOXES.append(dict(book=BOOK,page=PAGE,text=s,x=left,y=y,width=width,size=size))\n\n\ndef para(s,x,top,width,size=11,color=MUTED):\n    style=ParagraphStyle('p',fontName='Body',fontSize=size,leading=size*1.42,textColor=color)\n    p=Paragraph(s,style);_,height=p.wrap(width,1000)\n    assert top-height>72,(BOOK,PAGE,s)\n    p.drawOn(C,x,top-height)\n    return top-height\n\n\ndef box(x,y,w,h,fill=PALE,stroke=None,r=11):\n    C.setFillColor(fill);C.setStrokeColor(stroke or fill);C.setLineWidth(.6)\n    C.roundRect(x,y,w,h,r,fill=1,stroke=int(stroke is not None))\n\n\ndef art(name,x,y,w,h,rounded=True):\n    path=ASSETS/(name+'.png')\n    if name!='mascots' and (ASSETS/(name+'.jpg')).exists():path=ASSETS/(name+'.jpg')\n    with Image.open(path) as im:iw,ih=im.size\n    scale=min(w/iw,h/ih);dw,dh=iw*scale,ih*scale\n    dx,dy=x+(w-dw)/2,y+(h-dh)/2\n    C.saveState()\n    if rounded:\n        p=C.beginPath();p.roundRect(dx,dy,dw,dh,11);C.clipPath(p,stroke=0,fill=0)\n    C.drawImage(ImageReader(str(path)),dx,dy,dw,dh,mask='auto')\n    C.restoreState()\n\n\ndef page(kind,title='',section='',folio=True,mascot=True):\n    global PAGE\n    PAGE+=1\n    n=PAGE-2 if folio else None\n    LOG.append(dict(book=BOOK,pdf_page=PAGE,printed_page=n,kind=kind,title=title))\n    C.setFillColor(CREAM);C.rect(0,0,W,H,fill=1,stroke=0)\n    C.setStrokeColor(SAND);C.setLineWidth(.65);C.roundRect(20,20,W-40,H-40,14,fill=0,stroke=1)\n    if folio:\n        txt(46,794,'ECCR / READER '+BOOK,9,'Bold',GREEN)\n        txt(W-46,794,section,9,'Bold',GREEN,'right')\n        C.setStrokeColor(GREEN);C.line(46,782,W-46,782)\n        cx=W-61 if n%2 else 61\n        C.circle(cx,43,14,fill=0,stroke=1)\n        txt(cx,39,n,10,'Body',GREEN,'center')\n        if mascot:art('mascots',39 if n%2 else W-75,31,36,44,False)\n\n\ndef end():C.showPage()\ndef heading(s,y=742,size=27):txt(46,y,s,size,'Display')\n\n\ndef fourlines(top,sample=None):\n    for j in range(4):\n        C.setStrokeColor(RED if j in [0,3] else HexColor('#333333'))\n        C.setLineWidth(.5 if j in [0,3] else .35)\n        C.line(58,top-j*2.5*mm,W-58,top-j*2.5*mm)\n    if sample:\n        for x in [71,194,317]:txt(x,top-5*mm+.2,sample,13,'Body',HexColor('#A7AEA8'))\n\n\ndef icon(kind,x,y):\n    C.saveState();C.translate(x,y);C.setStrokeColor(GREEN);C.setLineWidth(1.8)\n    if kind=='say':\n        C.roundRect(0,5,30,22,6,fill=0);C.line(8,5,5,0);C.line(5,0,17,5)\n    elif kind=='blend':\n        C.circle(5,20,5,fill=0);C.circle(25,20,5,fill=0);C.line(7,12,14,4);C.line(23,12,16,4)\n    elif kind=='read':\n        C.rect(0,0,29,25,fill=0);C.line(14.5,0,14.5,25)\n    else:\n        C.circle(7,21,5,fill=0);C.circle(25,21,5,fill=0);C.line(2,6,12,6);C.line(20,6,30,6)\n    C.restoreState()\n\n\ndef cover(bd):\n    page('cover',folio=False)\n    box(37,559,W-74,245,BLUE)\n    txt(W/2,770,'Yaw & Janet Learning Series',18,'Display',GREEN,'center')\n    txt(W/2,727,'ECCR - READ & RISE',23,'Display',INK,'center')\n    txt(W/2,665,'DECODABLE',34,'Display',INK,'center')\n    txt(W/2,618,'READER '+BOOK,38,'Display',INK,'center')\n    txt(W/2,581,bd['subtitle'],18,'Body',GREEN,'center')\n    art(bd['texts'][0]['id'],58,218,W-116,313)\n    txt(W/2,193,'Basic 1  •  Phonics and Reading Practice',12,'Bold',GREEN,'center')\n    txt(58,145,'My name is:',12,'Bold')\n    C.setStrokeColor(SAND);C.line(132,141,400,141)\n    txt(58,104,'Class:',12,'Bold');C.line(101,100,400,100)\n    art('mascots',447,75,70,90,False)\n    txt(W/2,48,'12 texts  •  A, B and C practise the same phonics scope',9,'Body',MUTED,'center')\n    end()\n\n\ndef how(bd):\n    page('how','How to Use This Book',folio=False)\n    box(43,700,W-86,88,BLUE)\n    txt(W/2,752,'ECCR Early Reading Series',19,'Display',GREEN,'center')\n    txt(W/2,718,'How to Use This Book',27,'Display',INK,'center')\n    actions=[('say','Say it.'),('blend','Blend it.'),('read','Read it.'),('talk','Talk about it.')]\n    for i,(key,label) in enumerate(actions):\n        x=58+(i%2)*250;y=619-(i//2)*66\n        box(x-10,y-14,235,58,PALE);icon(key,x+3,y);txt(x+49,y+7,label,21,'Bold',GREEN)\n    txt(46,512,'Our texts',17,'Bold',GREEN)\n    for i,t in enumerate(bd['texts']):\n        x=47+(i//6)*256;y=478-(i%6)*36\n        txt(x,y,f'{i+1:02d}',10,'Bold',GREEN)\n        title=t['title'];fs=11 if pdfmetrics.stringWidth(title,'Body',12)>207 else 12\n        txt(x+27,y,title,fs)\n    box(46,150,W-92,95,PALE)\n    para('Teacher: read the directions and questions aloud. Start with sound and letter cards, then blend the words. Learners read the printed story before using the picture to talk about meaning. On the response page, find the answer in the story.',59,231,W-118,11)\n    art('mascots',262,50,70,89,False)\n    end()\n\n\ndef sounds(bd):\n    page('sounds','Sounds I Know','GET READY')\n    heading('Sounds I Know')\n    para('Use this reader after the needed English sounds have been taught. Say the sounds, not just the letter names.',46,718,W-92,11)\n    txt(46,656,'Short vowels',18,'Bold',GREEN)\n    for i,v in enumerate('aioeu'):\n        x=61+i*99;box(x,564,75,66,white,SAND);txt(x+37.5,584,v,40,'Body',GREEN,'center')\n    corpus=' '.join(t['title']+' '+' '.join(t['sentences'])+' '+' '.join(t['blend']) for t in bd['texts']).lower()\n    consonants=sorted(set(corpus)&set('bcdfghjklmnpqrstvwxyz'))\n    txt(46,521,'Consonants in this book',18,'Bold',GREEN)\n    for i,ch in enumerate(consonants):\n        x=59+(i%9)*56;y=451-(i//9)*60\n        box(x,y,44,44,white,SAND,8);txt(x+22,y+12,ch,26,'Body',GREEN,'center')\n    txt(46,350,'Also blend: a + n + d → and',17,'Bold',GREEN)\n    used=[v for v in DATA['heart_words'] if re.search(r'\\b'+v+r'\\b',corpus,re.I)]\n    txt(46,309,'Heart words: learn with your teacher',17,'Bold',GREEN)\n    txt(62,274,'    '.join(used),23,'Bold')\n    box(46,142,W-92,104,PALE)\n    para('All three books follow the same plan: a, i, o, e, u, then mixed-vowel review. Texts 1-4 have 5 sentences, Texts 5-10 have 6, and Texts 11-12 have 7. A, B and C are different practice books, not three increasing levels.',59,230,W-118,11)\n    txt(46,103,'Pilot sequence: Yaw to confirm sounds, order and readiness before classroom use.',9,'Body',MUTED)\n    end()\n\n\ndef unithead(t,phase):\n    target='MIXED SHORT VOWELS' if t['target']=='mixed' else 'SHORT '+t['target'].upper()\n    page(phase,t['title'],f'TEXT {t[\"number\"]:02d} / {target}',mascot=phase!='story')\n\n\ndef warmup(t):\n    unithead(t,'warmup');heading('Sound & Word Warm-up')\n    txt(46,709,t['title'],16,'Bold',GREEN)\n    if t['target']=='mixed':\n        txt(46,656,'Say the sounds.',17,'Bold');txt(286,651,'a  i  o  e  u',28,'Body',GREEN)\n    else:\n        box(46,590,101,92,PALE);txt(96.5,610,t['target'],62,'Body',GREEN,'center')\n        txt(177,643,'Listen. Say the sound.',18,'Bold',GREEN)\n        txt(177,612,'Point to the letter.',15)\n    txt(46,551,'Blend it.',20,'Bold',GREEN)\n    for i,w in enumerate(t['blend']):\n        y=490-i*74\n        for j,ch in enumerate(w.lower()):\n            x=63+j*76;box(x,y-12,56,54,white,SAND,8);txt(x+28,y+3,ch,31,'Body',GREEN,'center')\n            if j\u003c2:txt(x+62,y+7,'+',13,'Body',MUTED)\n        txt(304,y+6,'→',25,'Body',GREEN);txt(355,y+1,w,32,'Bold',GREEN)\n    txt(46,287,'Read it.',19,'Bold',GREEN)\n    txt(65,246,'     '.join(t['blend']),26,'Bold')\n    box(46,136,W-92,83,PALE)\n    txt(59,194,'Heart words - learn first',14,'Bold',GREEN)\n    txt(65,158,'     '.join(t['hearts']),23,'Bold')\n    txt(46,99,'Teacher: blend from the letters before turning to the story picture.',9,'Body',MUTED)\n    end()\n\n\ndef story(t):\n    unithead(t,'story');heading(t['title'],size=27)\n    art(t['id'],58,439,W-116,280)\n    # Fixed sizing across A/B/C; longer passages add lines, not harder spellings.\n    for j,line in enumerate(t['sentences']):txt(62,399-j*39,line,25,'Body')\n    txt(62,105,'Read again. Tell the story.',11,'Body',GREEN)\n    end()\n\n\ndef options(y,values,seed):\n    vals=list(values);random.Random(seed).shuffle(vals)\n    for i,value in enumerate(vals):\n        x=65+i*244\n        C.setStrokeColor(MUTED);C.setLineWidth(.7);C.rect(x,y,11,11,fill=0,stroke=1)\n        txt(x+23,y-1,value,21,'Body')\n    return vals\n\n\ndef respond(t):\n    unithead(t,'respond');heading('Check & Respond')\n    txt(46,708,'Read again. Find it in the story.',16,'Bold',GREEN)\n    key=dict(title=t['title'],story_printed_page=PAGE-3,questions=[])\n    for j,q in enumerate(t['questions']):\n        top=656-j*93\n        para(f'{j+1}. '+q['q'],58,top,W-116,16,INK)\n        vals=options(top-59,[q['answer'],q['distractor']],PAGE*13+j)\n        evidence=[i+1 for i,s in enumerate(t['sentences']) if re.search(r'\\b'+re.escape(q['answer'])+r'\\b',s,re.I)]\n        key['questions'].append(dict(question=q['q'],answer=q['answer'],options=vals,matching_sentence_numbers=evidence))\n    txt(46,468,'Say: tell a partner what happened.',14,'Bold',GREEN)\n    txt(46,426,'Complete the sentence.',17,'Bold',GREEN)\n    para(t['cloze']['sentence'],58,402,W-116,20,INK)\n    vals=options(345,[t['cloze']['answer'],t['cloze']['distractor']],PAGE*29)\n    key['cloze']=dict(**t['cloze'],options=vals)\n    txt(46,307,'Trace. Write.',17,'Bold',GREEN)\n    # Two models, each followed by a full blank set; 7.5 mm total set height.\n    fourlines(281,t['blend'][0]);fourlines(228)\n    fourlines(175,t['blend'][1]);fourlines(122)\n    ANSWERS[t['id']]=key\n    end()\n\n\ndef back(bd):\n    page('colophon',folio=False)\n    txt(W/2,748,'Yaw & Janet Learning Series',20,'Display',GREEN,'center')\n    txt(W/2,644,'ECCR - READ AND RISE',29,'Display',INK,'center')\n    txt(W/2,582,'ECCR Early Reading Series',21,'Display',GREEN,'center')\n    txt(W/2,519,'Decodable Reader '+BOOK,25,'Display',INK,'center')\n    txt(W/2,479,bd['subtitle'],18,'Display',GREEN,'center')\n    txt(W/2,442,'Basic 1  •  12 texts',13,'Body',MUTED,'center')\n    txt(W/2,220,'Developed through the ECCR-Team Kairos collaboration',11,'Body',INK,'center')\n    txt(W/2,184,'Francis Eghan (Yaw) & JiEun Janet Song',13,'Display',GREEN,'center')\n    art('mascots',256,61,83,105,False)\n    txt(W/2,38,'Classroom pilot edition - sequence and local pronunciation for Yaw review',7.5,'Body',MUTED,'center')\n    end()\n\n\ndef prepare():\n    ASSETS.mkdir(exist_ok=True);QA.mkdir(exist_ok=True)\n    source=ROOT.parent/'short_word_reader_20260919/assets/mascots.png'\n    shutil.copy2(source,ASSETS/'mascots.png')\n    missing=[t['id'] for bd in DATA['books'].values() for t in bd['texts'] if not (ASSETS/(t['id']+'.png')).exists()]\n    assert not missing,missing\n    # Print export only: retain original PNGs; do not crop or redraw the art.\n    for bd in DATA['books'].values():\n        for t in bd['texts']:\n            with Image.open(ASSETS/(t['id']+'.png')) as im:\n                im.convert('RGB').save(ASSETS/(t['id']+'.jpg'),quality=95,subsampling=0,optimize=True)\n\n\ndef visual_qa(book,path):\n    doc=fitz.open(path);assert len(doc)==40\n    logs=[x for x in LOG if x['book']==book]\n    story_images=0\n    for i,p in enumerate(doc):\n        assert abs(p.rect.width-W)\u003c.01 and abs(p.rect.height-H)\u003c.01\n        for w in p.get_text('words'):\n            assert 18\u003c=w[0] and w[2]\u003c=W-18 and 18\u003c=w[1] and w[3]\u003c=H-18,(book,i+1,w)\n            assert '\\ufffd' not in w[4]\n        n=logs[i]['printed_page']\n        if n is not None:\n            hits=[w for w in p.get_text('words') if w[1]>780 and w[4]==str(n)]\n            assert len(hits)==1,(book,i+1,n,hits)\n            assert ((hits[0][0]+hits[0][2])/2>W/2)==bool(n%2)\n        if logs[i]['kind']=='story':\n            assert len(p.get_image_info())==1,(book,i+1)\n            story_images+=1\n        p.get_pixmap(matrix=fitz.Matrix(.9,.9),alpha=False).save(QA/f'{book}_{i+1:02d}.png')\n    assert story_images==12\n    for start in range(0,40,8):\n        sheet=Image.new('RGB',(1280,930),'#D9DED9');dr=ImageDraw.Draw(sheet)\n        for j in range(min(8,40-start)):\n            im=Image.open(QA/f'{book}_{start+j+1:02d}.png');im.thumbnail((302,427))\n            x=(j%4)*320+8;y=(j//4)*465+25\n            sheet.paste(im,(x,y));dr.text((x,y-18),f'{book} PDF {start+j+1}: {logs[start+j][\"kind\"]}',fill='black')\n        sheet.save(QA/f'{book}_contact_{start//8+1}.jpg')\n\n\ndef build():\n    global BOOK,PAGE,C\n    records=audit();prepare()\n    source_hashes={str(p):digest(p) for p in FINAL.glob('ECCR_Book_*.pdf')}\n    for book,bd in DATA['books'].items():\n        BOOK=book;PAGE=0\n        out=ROOT/f'ECCR_Decodable_Reader_{book}.pdf'\n        C=canvas.Canvas(str(out),pagesize=A4,pageCompression=1)\n        C.setTitle(f'ECCR Decodable Reader {book} - '+bd['subtitle'])\n        C.setAuthor('ECCR - Yaw & Janet Learning Series')\n        C.setSubject('Basic 1 parallel-scope English phonics reader. 12 texts. Classroom pilot, not a standardized test.')\n        cover(bd);how(bd);sounds(bd)\n        for t in bd['texts']:warmup(t);story(t);respond(t)\n        back(bd);assert PAGE==40;C.save()\n        visual_qa(book,out)\n        print(out,flush=True)\n    (ROOT/'page_map.json').write_text(json.dumps(LOG,ensure_ascii=False,indent=2))\n    (ROOT/'answer_key.json').write_text(json.dumps(ANSWERS,indent=2))\n    (ROOT/'layout_text.json').write_text(json.dumps(LINE_BOXES,indent=2))\n    assert all(digest(Path(p))==h for p,h in source_hashes.items())\n    report=dict(books=3,pages_each=40,texts_each=12,story_count=36,sequence=DATA['sequence'],\n                story_max_word_length=4,sentence_count_schedule=[5]*4+[6]*6+[7]*2,\n                vocabulary_scope='VC/CVC, plus explicitly taught and; heart words a/the/is/has/I',\n                validation='spelling inventory and cumulative vowels checked; Yaw classroom review still required',\n                original_books_unchanged=True,source_sha256=source_hashes)\n    (ROOT/'qa_report.json').write_text(json.dumps(report,ensure_ascii=False,indent=2))\n    print(json.dumps({k:v for k,v in report.items() if k!='source_sha256'},indent=2))\n\n\ndef install():\n    dest=FINAL/'Phonics_Readers_ABC'\n    assert not dest.exists(),f'Refusing overwrite: {dest}'\n    report=json.loads((ROOT/'qa_report.json').read_text())\n    assert all(digest(Path(p))==h for p,h in report['source_sha256'].items())\n    dest.mkdir()\n    for name in ['ECCR_Decodable_Reader_A.pdf','ECCR_Decodable_Reader_B.pdf','ECCR_Decodable_Reader_C.pdf','TEACHER_GUIDE_AND_ANSWERS.md']:\n        src=ROOT/name;assert src.exists()\n        with src.open('rb') as s,(dest/name).open('xb') as d:shutil.copyfileobj(s,d)\n        assert digest(src)==digest(dest/name)\n        print(dest/name)\n    assert all(digest(Path(p))==h for p,h in report['source_sha256'].items())\n\n\nif __name__=='__main__':\n    if '--audit' in sys.argv:print(json.dumps(audit(),indent=2))\n    elif '--install' in sys.argv:install()\n    else:build()\n", "url": ""}, "book/output/pdf/최종/01_Audio_App_No_Blanks/README.md": {"text": "# ECCR Books 1-9: app and binding editions\n\nPrepared 2026-09-15 from the nine main textbooks in `최종`. Assessments and Writing Book are not part of this export. Original files are unchanged.\n\n## 01_Audio_App_No_Blanks\n\nNine A4 PDFs with only visually confirmed empty/filler pages removed. Frames or a small footer character alone are counted as filler. Covers, title pages, questions, writing activities, `Kenkan bio.` and final credits are retained. Book 6 has no blank pages to remove.\n\nRemoved original PDF pages (cover = PDF 1):\n\n| Book | Removed | Output pages |\n|---|---|---|\n| 1 | 9, 10, 11 | 9 |\n| 2 | 18, 19 | 18 |\n| 3 | 31 | 31 |\n| 4 | 11 | 11 |\n| 5 | 10, 11 | 10 |\n| 6 | None | 12 |\n| 7 | 10, 11 | 10 |\n| 8 | 10, 11 | 10 |\n| 9 | 10, 11 | 10 |\n\nRetained pages are pixel-identical to their source pages. Printed page labels are intentionally unchanged. `PAGE_MAPPING.csv` and `.json` map the new PDF/image index to the original page index. These PDFs have not been uploaded to the app. Do not rename or relink existing audio by the new index without applying the mapping. Existing live-app text/audio discrepancies still need the separate synchronization review.\n\n## 02_Bond_Binding_A4\n\nFor each book:\n\n- `Binding_Interior.pdf`: A4 portrait, single pages in reader order; duplex, flip on the long edge, left binding. Interior page 1 (original title page) is recto/right-hand. Odd interior pages have the spine on the left, even pages on the right. Original filler pages remain, preserving an even page count.\n- The complete original page is proportionally reduced to approximately 85.7%, inside a safe area with 20 mm inner and 10 mm outer clearance, and at least 10 mm top/bottom clearance. Original text, characters and frames are not cropped. The safe-area figure describes the full imported page; actual content margins may be larger. No source artwork is regenerated.\n- `Cover_Panels.pdf`: two A4 pages, front cover first and the original final credits/back-cover design second. **Not** a two-page duplex job: these are the two outside cover panels for the printer. Cover interiors are unspecified/blank. No spine width is invented.\n- Print at **100% / Actual size**. Disable Fit/Shrink and booklet imposition. The printer handles production imposition. Files have no crop marks, bleed extension, CMYK conversion or PDF/X certification.\n\n### Printer confirmation required\n\nThese are binding-layout files, not a certified press-ready wraparound cover. Confirm paper stock, grain, minimum spine thickness, adhesive process, bleed and colour requirements with the printer before production. Several books have only 10 interior pages (five sheets) and may be too thin for the printer's perfect-binding process. Do not add unrequested filler pages or combine books solely to meet thickness without approval.\n\nIf a wraparound front/spine/back cover is required, obtain the exact spine width and bleed template after confirming the paper and final sheet count. Cover panels are supplied separately so the printer can place them correctly.\n\n## 한국어 인쇄 안내\n\n오디오앱용은 빈 면 15쪽만 제거했습니다. 제본용은 A4 양면·긴 쪽 넘김·왼쪽 제본 기준이며, 원래의 빈 면은 유지했습니다. 내지 안쪽 여백 20mm를 확보하기 위해 페이지 전체를 비례 축소했습니다. 표지는 앞·뒤표지 2면을 별도 PDF로 제공합니다. 펼친 표지와 책등은 인쇄소 규격 확인 후 제작해야 합니다. 본드 제본 가능한 최소 두께도 인쇄소에 확인해 주세요.\n", "url": ""}, "book/output/pdf/최종/01_Audio_App_No_Blanks/PAGE_MAPPING.json": {"text": "[\n  {\n    \"book\": 1,\n    \"original_pdf_page\": 1,\n    \"app_pdf_page\": 1,\n    \"original_asset\": \"book1/page-01.jpg\",\n    \"new_asset\": \"book1/page-01.jpg\"\n  },\n  {\n    \"book\": 1,\n    \"original_pdf_page\":

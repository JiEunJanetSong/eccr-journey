<script id="labData" type="application/json">{"tech": {"version": 1, "auditDate": "2026-10-21", "scope": {"en": "Technical documentation draft based on preserved conversation, inspected local production sources and public application revision 3b87245. A source/package audit is distinguished from browser and classroom verification.", "ko": "보존 대화·로컬 제작 소스·공개 앱 리비전 3b87245를 근거로 한 기술문서 초안입니다. 소스·패키지 점검과 브라우저·수업 검증을 구분합니다."}, "verifiedSnapshot": {"kind": "inspected-public-repository-snapshot", "applicationRepository": "eccr-picture-audio-site", "books": 7, "pages": 112, "audioItems": 143, "recordingReferences": 132, "explicitlyMissingAudioItems": 11, "missingReferencedFiles": 0, "cacheName": "eccr-book45-audio-20260907-1", "note": {"en": "The public repository snapshot matches local metadata byte-for-byte. There are 132 audio references pointing to 127 distinct MP3 files, plus 11 missing-audio items. It still contains older bilingual text and excludes Books 8–9. This is a source/package audit, not a pronunciation or fresh offline-browser test.", "ko": "공개 저장소 스냅샷과 로컬 메타데이터가 바이트 단위로 같습니다. 음성 참조 132개가 MP3 127개를 가리키며 누락 음성 항목은 11개입니다. 이전 두 언어 문구가 남아 있고 Book 8–9는 없습니다. 소스·패키지 점검이며 발음이나 새 오프라인 브라우저 시험 결과는 아닙니다."}, "revision": "3b87245", "repositoryUrl": "https://github.com/JiEunJanetSong/eccr-picture-audio-site/tree/3b87245", "metadataSha256": "e9bbb39959450cca0d0794b39415a517869a687eadae3f30bc4ae74a12c75f67", "uniqueReferencedMp3Files": 127}, "sections": [{"id": "system-map", "title": {"en": "A reproducible system, with three separate outputs", "ko": "세 가지 산출물을 구분하는 시스템 지도"}, "intro": {"en": "ECCR connects a teacher’s reading plan, editable book production, and a static listening app. Reproduction starts by naming the exact edition and deciding which output you are building.", "ko": "ECCR는 교사의 읽기 수업 계획, 수정 가능한 교재 제작, 정적 듣기 앱을 연결합니다. 재현의 첫 단계는 어떤 판본의 무엇을 만들 것인지 정하는 것입니다."}, "points": [{"en": "Authoring materials: manuscripts, approved images, fonts, recordings, scripts and page maps. Keep these so the outputs can be rebuilt.", "ko": "제작 자료: 원고, 승인된 그림, 글꼴, 녹음, 스크립트, 페이지 대응표입니다. 다시 만들 수 있도록 함께 보존합니다."}, {"en": "Print resources: Books 1–9, Book 0, parallel Readers A–C, book-specific assessments, entry baselines and Writing Book. These are separate products with different learning purposes.", "ko": "인쇄 자료: Book 1–9, Book 0, 병렬 연습책 Reader A–C, 권별 평가책, 기초 음가 평가, 쓰기책입니다. 서로 다른 학습 목적을 가진 별도 산출물입니다."}, {"en": "Listening software: two interfaces share one metadata source—picturebook/ for tapping printed text, audio/ for a list and sequential playback. The journey archive is a third, documentation website.", "ko": "듣기 소프트웨어: picturebook/의 글자 터치 화면과 audio/의 목록·연속 재생 화면이 하나의 데이터 원본을 씁니다. 작업 여정 아카이브는 이와 별개인 문서 사이트입니다."}], "recipe": [{"en": "Write a target list: named PDF edition, target pages, language, recordings, supported screens and offline requirement.", "ko": "목표 목록에 PDF 판본, 대상 페이지, 언어, 녹음, 화면 크기, 오프라인 요구를 적습니다."}, {"en": "Create a source manifest before changing anything; record file paths, page counts and hashes. Treat newly generated materials as candidates until reviewed.", "ko": "변경 전 원본 경로·쪽수·해시를 자료 목록에 기록합니다. 새로 만든 자료는 검토 전까지 후보본으로 관리합니다."}], "checks": [{"en": "A PDF being final does not establish that the deployed listening app uses that PDF. Verify both independently.", "ko": "PDF가 최종본이라는 사실만으로 배포된 듣기 앱도 그 PDF를 사용한다고 볼 수 없습니다. 둘을 따로 대조합니다."}], "evidence": [{"messageId": "full-1228"}, {"messageId": "w622"}, {"messageId": "w1015"}, {"path": "기술인계문서-ECCR/TECHNICAL_HANDOFF_EN.md", "section": "2–5"}, {"path": "book/output/pdf/최종/APP_AUDIO_SYNC_REVIEW_20260915.md", "section": "Evidence and limitations"}], "caveat": {"en": "The inspected public application snapshot (3b87245) contains Books 1–7 and older bilingual text. The print folder also contains revised Books 1–9 and later supplementary materials. Reproducing the current app and integrating the latest PDFs are different tasks.", "ko": "확인한 공개 앱 스냅샷(3b87245)은 Book 1–7과 이전 두 언어 문구를 포함합니다. 인쇄 폴더에는 교정된 Book 1–9와 후속 보조 자료가 있습니다. 현재 앱 재현과 최신 PDF 통합은 서로 다른 작업입니다."}}, {"id": "source-contract", "title": {"en": "Turn conversation into an inspectable brief", "ko": "대화를 검증 가능한 제작 조건으로 바꾸기"}, "intro": {"en": "A useful brief separates what the teacher supplied, what the AI proposed, and what the teacher later corrected. Dates alone do not resolve conflicting editions.", "ko": "좋은 제작 조건표는 교사가 제공한 내용, AI의 제안, 교사의 후속 교정을 구분합니다. 날짜만으로 서로 다른 판본의 충돌이 해결되지는 않습니다."}, "points": [{"en": "Store learner text separately from translation notes. Yaw’s English glosses helped Janet understand Twi; the later decision removed them from the learner editions of Books 4–6.", "ko": "학습자 본문과 번역 참고문을 분리합니다. 야우의 영어 뜻풀이는 Janet의 Twi 이해를 도왔고, 후속 결정에 따라 Book 4–6 학습자용에서는 삭제되었습니다."}, {"en": "A page record should identify source message, book, physical PDF page, printed page label, exact text, illustration requirement and approval status.", "ko": "페이지별 기록에는 출처 메시지, 책, PDF 순번, 인쇄 쪽 번호, 정확한 문구, 그림 요구, 승인 상태를 둡니다."}, {"en": "Use the latest explicit content decision and verified target file. Preserve original messages verbatim and label summaries or translated explanations as editorial.", "ko": "최신의 명시적 내용 결정과 확인한 대상 파일을 기준으로 삼습니다. 대화 원문은 그대로 두고 요약·번역 설명을 편집문으로 표시합니다."}], "recipe": [{"en": "For each request, write an acceptance check before asking AI to generate: for example, exactly two goats and two children, or one illustration with connected sentences.", "ko": "AI 생성 전 요청마다 합격 조건을 적습니다. 예: 염소 두 마리와 아이 두 명, 또는 그림 하나와 연결된 문장."}, {"en": "When feedback arrives, record old text → approved text → affected outputs. Include assessments and audio mapping in the impact list.", "ko": "피드백이 오면 이전 문구 → 확정 문구 → 영향받는 산출물을 기록합니다. 평가책과 음성 매핑도 영향 목록에 포함합니다."}], "checks": [{"en": "The text “four letters” constrains word length; it does not mean four words in each sentence, and it does not by itself establish decodability.", "ko": "“네 글자”는 단어 길이 조건이며 문장당 네 단어라는 뜻이 아닙니다. 단어가 짧다는 것만으로 해독 가능성이 입증되지도 않습니다."}], "evidence": [{"messageId": "w857"}, {"messageId": "a2-367"}, {"messageId": "a2-367r"}, {"messageId": "w860"}, {"path": "book/output/pdf/최종/REVISION_NOTES_20260914.md", "section": "Basis and scope; revision table"}], "code": {"language": "text", "caption": {"en": "Suggested specification format; a new teaching template", "ko": "권장 조건표 형식: 새 실습용 템플릿"}, "text": "Book / edition:\nSource message ID:\nPDF page / printed page:\nLearner text (exact):\nTeacher-only explanation:\nIllustration must show:\nRecording needed:\nAcceptance check:\nReviewed by / date:"}}, {"id": "manuscript-art", "title": {"en": "Keep the words editable and the pictures separate", "ko": "글은 편집 가능한 상태로, 그림은 별도 자산으로"}, "intro": {"en": "The early Book 2 source uses XeLaTeX: images sit above typeset Twi text. Later builders use ReportLab for precise PDF layout. The common principle is to keep text out of generated pictures.", "ko": "초기 Book 2는 XeLaTeX로 그림 위·Twi 조판 아래 구조를 만들었고, 이후 제작기는 ReportLab으로 PDF를 정밀 배치합니다. 공통 원칙은 생성 그림 안에 본문 글자를 넣지 않는 것입니다."}, "points": [{"en": "Save each accepted image, scene prompt and source reference. For repeated characters, preserve identity, clothing, relative height and scene continuity.", "ko": "승인된 이미지, 장면 프롬프트, 참조 원본을 함께 저장합니다. 반복 인물의 얼굴·옷·키 비율·장면 연속성을 유지합니다."}, {"en": "Use image generation to supply or change visual content. Use layout code for centering, margins, page numbers and text corrections.", "ko": "그림 생성은 시각 내용의 제작·변경에 사용합니다. 가운데 정렬·여백·쪽 번호·문구 교정은 조판 코드로 처리합니다."}, {"en": "Dependencies differ by route: XeLaTeX plus fontspec for the early TeX source; Python, ReportLab, PyMuPDF, Pillow and sometimes pypdf for later PDF builders. Font files are explicit inputs.", "ko": "경로별 도구가 다릅니다. 초기 TeX는 XeLaTeX·fontspec을, 후속 PDF 제작기는 Python·ReportLab·PyMuPDF·Pillow 및 일부 pypdf를 씁니다. 글꼴 파일도 입력 자료입니다."}], "recipe": [{"en": "Approve a small text-and-image sample first. Then expand the same rules across the book.", "ko": "글과 그림을 합친 작은 샘플을 먼저 검토한 뒤 같은 규칙을 책 전체로 확장합니다."}, {"en": "Render the PDF and extract its text. Inspect Twi characters such as ɔ, ɛ and Ɔ, text size, missing body parts, image overlap and real writing space.", "ko": "PDF를 이미지로 렌더링하고 본문도 추출합니다. ɔ·ɛ·Ɔ 같은 Twi 글자, 글자 크기, 신체 잘림, 그림 겹침, 실제 쓰기 공간을 점검합니다."}], "checks": [{"en": "For identical visual output, reuse the approved images. Repeating an image prompt is not a deterministic rebuild of the same artwork.", "ko": "동일한 그림을 재현하려면 승인된 이미지 파일을 재사용합니다. 이미지 프롬프트를 반복한다고 같은 그림이 그대로 만들어지지는 않습니다."}, {"en": "The historical TeX and Python scripts include machine-specific font paths. Resolve those paths before rebuilding on another computer.", "ko": "기존 TeX·Python 스크립트에는 특정 컴퓨터의 글꼴 경로가 있습니다. 다른 컴퓨터에서는 해당 경로를 먼저 맞춰야 합니다."}], "evidence": [{"messageId": "a1-8"}, {"messageId": "a1-10"}, {"messageId": "a0-42"}, {"messageId": "a0-81"}, {"messageId": "a0-88"}, {"path": "과정/HANDOFF.md", "section": "Source files; Build command"}, {"path": "book/v.0/book2.tex", "section": "fontspec and imagepage"}, {"path": "book/output/pdf/a4/phonics_abc_20260921/build_series.py", "section": "fonts; art; visual_qa"}], "code": {"language": "sh", "caption": {"en": "PDF inspection commands from the production guide; replace the sample filename", "ko": "제작 지침에 있는 PDF 점검 명령: 예시 파일명을 교체"}, "text": "pdfinfo book.pdf\npdffonts book.pdf\npdftotext -layout book.pdf -\npdftoppm -png -r 120 book.pdf /tmp/eccr-page"}, "caveat": {"en": "The archived early book2.tex builds an earlier A5-era manuscript, not the present 20-page A4 Book 2. It demonstrates the method; it is not a one-command rebuild of every subsequent revision.", "ko": "보관된 초기 book2.tex는 현재의 20쪽 A4 Book 2가 아닌 이전 A5 시기의 원고를 만듭니다. 제작 기법의 예시이며 후속 모든 교정을 한 번에 재현하는 명령은 아닙니다."}}, {"id": "editions", "title": {"en": "Manage print and app editions with page maps", "ko": "인쇄판과 앱판을 페이지 대응표로 관리하기"}, "intro": {"en": "The same book can produce several valid editions. Removing blank pages changes indexes even when every retained picture is unchanged.", "ko": "같은 책에서 여러 목적의 판본이 나올 수 있습니다. 보존된 그림이 같더라도 빈 페이지를 지우면 페이지 순번은 바뀝니다."}, "points": [{"en": "The September 15 app derivative removes 15 filler pages across Books 1–9 and records original_pdf_page → app_pdf_page. It was prepared as PDFs and explicitly not uploaded at that time.", "ko": "9월 15일 앱용 파생판은 Book 1–9의 빈 면 15쪽을 제거하고 original_pdf_page → app_pdf_page를 기록합니다. 당시 PDF만 제작되었고 앱에는 올리지 않았다고 명시합니다."}, {"en": "Print derivatives preserve facing-page and binding requirements. Printed folios, physical PDF pages and screen indexes are three distinct identifiers.", "ko": "인쇄 파생판은 펼침면과 제본 조건을 유지합니다. 인쇄 쪽 번호, 실제 PDF 페이지, 화면 인덱스는 서로 다른 세 가지 식별자입니다."}, {"en": "Final main-book folio correction moves even numbers left and odd numbers right. Earlier binding subfolders contain different experiments; do not apply one folder’s README to all editions.", "ko": "최종 본책의 쪽 번호 교정은 짝수 왼쪽·홀수 오른쪽입니다. 이전 제본 하위 폴더에는 다른 실험판도 있으므로 한 폴더의 README를 모든 판본에 적용하면 안 됩니다."}], "recipe": [{"en": "Select the source edition, preserve it, and build into a new output location. Save a mapping row for every retained page.", "ko": "원본 판본을 지정하고 보존한 뒤 새 출력 위치에 제작합니다. 보존하는 모든 페이지마다 대응표 한 행을 저장합니다."}, {"en": "Apply that map to image filenames and audio items. Remeasure hotspots whenever layout changes.", "ko": "이미지 파일명과 음성 항목에 같은 대응표를 적용합니다. 조판이 바뀌면 터치 영역을 다시 측정합니다."}], "checks": [{"en": "Compare retained pages against the source by rendering or pixel comparison. Check blank pages, cover order, margins, numbered-page side and page count.", "ko": "보존된 페이지를 렌더링 또는 픽셀 비교로 원본과 대조합니다. 빈 면·표지 순서·여백·쪽 번호 방향·전체 쪽수를 확인합니다."}], "evidence": [{"messageId": "a2-304"}, {"messageId": "a2-304r"}, {"messageId": "a2-335"}, {"messageId": "a2-335r"}, {"path": "book/output/pdf/최종/01_Audio_App_No_Blanks/README.md", "section": ""}, {"path": "book/output/pdf/최종/01_Audio_App_No_Blanks/PAGE_MAPPING.json", "section": ""}, {"path": "book/output/pdf/최종/_backups/before_odd_right_even_left_20260919_123937/changes_and_verification.json", "section": ""}], "code": {"language": "json", "caption": {"en": "Actual mapping example: the last Book 1 page changes index", "ko": "실제 대응표 예: Book 1 마지막 페이지의 순번 변경"}, "text": "{\n  \"book\": 1,\n  \"original_pdf_page\": 12,\n  \"app_pdf_page\": 9,\n  \"original_asset\": \"book1/page-12.jpg\",\n  \"new_asset\": \"book1/page-09.jpg\"\n}"}}, {"id": "learning-materials", "title": {"en": "Generate assessments and parallel readers from explicit rules", "ko": "명시한 규칙으로 평가와 병렬 읽기 자료 만들기"}, "intro": {"en": "Reusing a visual style is not enough. Each material needs its own learning purpose and verification rules.", "ko": "같은 디자인을 재사용하는 것만으로는 부족합니다. 자료마다 학습 목적과 검증 규칙이 필요합니다."}, "points": [{"en": "Book-specific assessments follow the content taught in that book. Entry baselines ask about sounds before instruction and keep learner and teacher item order aligned.", "ko": "권별 평가는 해당 책에서 가르친 내용과 연결합니다. 기초 평가는 수업 전 음가를 확인하며 학습자 항목과 교사 기록지 순서를 맞춥니다."}, {"en": "Readers A–C each contain 12 texts in 40 pages and share a planned scope. Their source manuscripts.json defines sentences, blend words, questions, target vowel and scene.", "ko": "Reader A–C는 각 40쪽·12개 글이며 계획된 음가 범위를 공유합니다. manuscripts.json은 문장·합성 낱말·질문·목표 모음·장면을 정의합니다."}, {"en": "The builder audits cumulative vowels, word length, VC/CVC constraints, sentence counts, distinct passages, PDF page count, folio side and one main image per story page.", "ko": "제작기는 누적 모음 범위·단어 길이·VC/CVC 조건·문장 수·글의 중복·PDF 쪽수·쪽 번호 방향·이야기 페이지당 그림 하나를 검사합니다."}, {"en": "The combined Book 0 is 90 pages, preserving the earlier 80-page book as Book 0-pre. Writing-line sets use 2.5 mm between lines: four lines span 7.5 mm.", "ko": "합본 Book 0는 90쪽이고 이전 80쪽 책은 Book 0-pre로 보존합니다. 쓰기 4선의 줄 간격은 2.5mm, 한 세트 높이는 7.5mm입니다."}], "recipe": [{"en": "Put manuscript decisions into structured records before laying out pages. Generate a teacher key from the same records.", "ko": "조판 전에 원고 결정을 구조화한 기록으로 만듭니다. 같은 기록에서 교사용 정답표를 생성합니다."}, {"en": "Run vocabulary and layout checks, then ask Yaw to review sound values, teaching order, meanings and learner readiness.", "ko": "어휘·배치 검사를 한 뒤 야우가 음가·교수 순서·뜻·학습자 준비도를 검토합니다."}], "checks": [{"en": "A–C are practice books within a shared planned scope, not validated equivalent tests. Four-letter word length and automated spelling checks do not validate pronunciation or classroom effectiveness.", "ko": "A–C는 계획 범위를 공유하는 연습책이지 동등성이 검증된 검사지가 아닙니다. 네 글자 조건과 자동 철자 검사는 발음이나 수업 효과를 검증하지 않습니다."}], "evidence": [{"messageId": "a2-274"}, {"messageId": "a2-360"}, {"messageId": "a2-382"}, {"messageId": "a2-387"}, {"messageId": "full-1228"}, {"path": "book/output/pdf/a4/phonics_abc_20260921/build_series.py", "section": "audit; visual_qa"}, {"path": "book/output/pdf/a4/phonics_abc_20260921/qa_report.json", "section": ""}, {"path": "book/output/pdf/a4/book0_combined_20260919/COMBINED_REVIEW.md", "section": ""}, {"path": "book/output/pdf/a4/build_entry_baseline.py", "section": ""}], "caveat": {"en": "The full builders depend on archived assets and locally configured fonts; a clean-room tutorial must first supply those inputs or create replacements. There is no single universal build command for all final PDFs.", "ko": "전체 제작기는 보관된 그림과 로컬 글꼴 설정에 의존합니다. 빈 작업 폴더에서 시작하는 실습은 이 입력을 준비하거나 새로 만들어야 합니다. 최종 PDF 전체를 만드는 하나의 공통 명령은 없습니다."}}, {"id": "audio-pipeline", "title": {"en": "Map every recording to the exact printed unit", "ko": "녹음을 정확한 인쇄 문구 단위에 연결하기"}, "intro": {"en": "Teacher audio becomes a deployment asset. A transcript field is a label, not proof that the recording says the same thing.", "ko": "교사의 녹음은 배포 자산이 됩니다. 대본 필드는 라벨이며, 실제 녹음도 같은 내용을 말한다는 증거는 아닙니다."}, "points": [{"en": "Keep original recordings, split them into tappable words, sentences or headings, and record the clip path and language beside the exact printed text.", "ko": "원본 녹음을 보존하고 터치할 낱말·문장·제목 단위로 나눈 뒤 정확한 인쇄 문구 옆에 클립 경로와 언어를 기록합니다."}, {"en": "Use automated transcription for draft timestamps only. Listen for Twi accuracy, clipped first/last sounds, missing pauses and narration not printed on the page.", "ko": "자동 전사는 시간 구간 초안에만 사용합니다. Twi 정확성·앞뒤 소리 잘림·쉼 누락·인쇄되지 않은 설명 음성을 직접 듣고 확인합니다."}, {"en": "For genuinely bilingual learner pages, use separate language-specific clips. For the revised Twi-only Books 4–6, retire English playback rather than preserving obsolete glosses.", "ko": "실제 두 언어 학습자 페이지에는 언어별 클립을 둡니다. 수정된 Twi 전용 Book 4–6에서는 삭제된 영어 뜻풀이의 재생도 제거합니다."}, {"en": "recordingMissing prevents synthesized fallback. GitHub Pages uses packaged MP3s and an empty TTS API base; the teacher’s Mac need not be running.", "ko": "recordingMissing은 음성 합성 대체를 막습니다. GitHub Pages는 포함된 MP3와 빈 TTS API 설정을 사용하므로 교사의 Mac이 켜져 있을 필요가 없습니다."}], "recipe": [{"en": "Create a text → source recording → start/end → exported clip table. Approve clips by listening before registering them.", "ko": "문구 → 원본 녹음 → 시작/끝 → 출력 클립 표를 만듭니다. 등록 전에 실제로 듣고 승인합니다."}, {"en": "When wording changes, compare the actual clip before rerecording. A spelling correction alone may not change the sound.", "ko": "문구가 바뀌면 재녹음 전에 실제 클립을 대조합니다. 철자 교정만으로 소리가 달라지는 것은 아닐 수 있습니다."}], "checks": [{"en": "Play the beginning, middle and end of each clip, then test rapid switching. Check that repetition gaps are present and playbackRate is 1.", "ko": "각 클립의 시작·중간·끝을 듣고 빠른 항목 전환을 시험합니다. 반복 사이 쉼이 있고 playbackRate가 1인지 확인합니다."}], "evidence": [{"messageId": "w605"}, {"messageId": "a4-1637"}, {"messageId": "a4-1637r"}, {"path": "기술인계문서-ECCR/TECHNICAL_HANDOFF_EN.md", "section": "7–10"}, {"path": "book/output/pdf/최종/APP_AUDIO_SYNC_REVIEW_20260915.md", "section": "Page-by-page action list"}, {"path": "eccr-picture-audio-site/shared/config.js", "section": "", "url": "https://github.com/JiEunJanetSong/eccr-picture-audio-site/blob/3b87245/shared/config.js"}], "code": {"language": "sh", "caption": {"en": "Documented FFmpeg example; choose boundaries by listening, not by copying these times", "ko": "문서의 FFmpeg 예: 아래 시간을 복사하지 말고 직접 들으며 구간 결정"}, "text": "ffmpeg -y -i source.m4a -ss 12.40 -to 14.85 \\\n  -codec:a libmp3lame -b:a 96k \\\n  picturebook/audio/book8/page-03-01.mp3\n\nffprobe -v error -show_entries format=duration \\\n  -of default=noprint_wrappers=1:nokey=1 \\\n  picturebook/audio/book8/page-03-01.mp3"}}, {"id": "data-hotspots", "title": {"en": "One data contract connects paper, picture and sound", "ko": "종이·그림·소리를 묶는 데이터 규격"}, "intro": {"en": "window.ECCR_A4_BOOKS supplies both listening interfaces. Each book contains pages; each page contains its image and audio items.", "ko": "window.ECCR_A4_BOOKS가 두 듣기 화면에 데이터를 제공합니다. 책은 페이지를, 페이지는 이미지와 음성 항목을 담습니다."}, "points": [{"en": "Book: unique id, title, assetDir, pages. Page: title, image, audio. Audio item: text, speechText, audioSrc or recordingMissing, lang, box or boxes.", "ko": "Book: 고유 id·title·assetDir·pages. Page: title·image·audio. Audio item: text·speechText·audioSrc 또는 recordingMissing·lang·box 또는 boxes입니다."}, {"en": "Hotspots are transparent buttons over the page image. x, y, w and h are percentages of the full image; using pixels without conversion breaks alignment when the page scales.", "ko": "터치 영역은 페이지 이미지 위의 투명 버튼입니다. x·y·w·h는 전체 이미지 대비 백분율이며 픽셀값을 그대로 쓰면 화면 크기가 바뀔 때 위치가 어긋납니다."}, {"en": "picturebook/ resolves audioSrc directly; audio/ prefixes ../picturebook/. Keep those path rules distinct while sharing the same records.", "ko": "picturebook/은 audioSrc를 그대로 사용하고 audio/는 ../picturebook/을 앞에 붙입니다. 데이터를 공유해도 상대 경로 규칙은 구분합니다."}], "recipe": [{"en": "Render the approved PDF into sequential JPEGs. Measure a generous but non-overlapping text rectangle, then convert its pixels to percentages.", "ko": "확정 PDF를 순서대로 JPEG로 만듭니다. 글자를 누르기 충분하되 이웃 문구와 겹치지 않는 사각형을 측정한 뒤 백분율로 바꿉니다."}, {"en": "Register the image, visible text and matching clip together. Test a single page before scaling to the full library.", "ko": "이미지·표시 문구·해당 클립을 함께 등록합니다. 전체 도서관으로 확장하기 전에 한 페이지부터 시험합니다."}], "checks": [{"en": "Check every referenced file exists and every region stays inside 0–100%. Visually confirm phone and desktop alignment; valid coordinates alone do not prove correct placement.", "ko": "참조 파일 존재와 0–100% 영역을 검사합니다. 폰과 데스크탑에서 실제 위치를 확인합니다. 좌표값이 유효하다고 배치도 정확한 것은 아닙니다."}], "evidence": [{"messageId": "a4-476"}, {"messageId": "a4-538"}, {"path": "기술인계문서-ECCR/TECHNICAL_HANDOFF_EN.md", "section": "5–6; 9"}, {"path": "eccr-picture-audio-site/picturebook/a4_books.js", "section": "", "url": "https://github.com/JiEunJanetSong/eccr-picture-audio-site/blob/3b87245/picturebook/a4_books.js"}, {"path": "eccr-picture-audio-site/picturebook/app.js", "section": "getHotspotStyle", "url": "https://github.com/JiEunJanetSong/eccr-picture-audio-site/blob/3b87245/picturebook/app.js"}, {"path": "eccr-picture-audio-site/audio/app.js", "section": "buildTtsUrl", "url": "https://github.com/JiEunJanetSong/eccr-picture-audio-site/blob/3b87245/audio/app.js"}], "code": {"language": "js", "caption": {"en": "Contract example from the handoff; coordinates are examples to remeasure", "ko": "인계서의 규격 예: 좌표는 실제 페이지에서 다시 측정"}, "text": "{\n  text: \"Sam has a cap.\",\n  speechText: \"Sam has a cap.\",\n  audioSrc: \"audio/book7/page-04-01.mp3\",\n  box: { x: 47, y: 28, w: 36, h: 8 },\n  lang: \"en\"\n}\n\n// x = leftPixel / imageWidth * 100\n// y = topPixel / imageHeight * 100\n// w = boxWidth / imageWidth * 100\n// h = boxHeight / imageHeight * 100"}}, {"id": "runtime", "title": {"en": "Small runtime, explicit playback state", "ko": "작은 실행 코드와 명시적인 재생 상태"}, "intro": {"en": "The app uses HTML, CSS and plain JavaScript with an HTML audio element. There is no required frontend framework, database, login or server runtime.", "ko": "앱은 HTML·CSS·일반 JavaScript와 HTML audio 요소를 사용합니다. 필수 프런트엔드 프레임워크·데이터베이스·로그인·서버 실행 환경은 없습니다."}, "points": [{"en": "Changing a book or page stops the current recording. Tapping another sentence invalidates the previous playback before starting the next.", "ko": "책이나 페이지를 바꾸면 재생을 멈춥니다. 다른 문장을 누르면 이전 재생을 무효화한 뒤 새 녹음을 시작합니다."}, {"en": "playbackToken distinguishes current events from delayed ended/error events. Audio Practice also uses sequenceToken to cancel an old Play page sequence.", "ko": "playbackToken은 현재 재생과 이전 재생에서 늦게 도착한 ended/error 이벤트를 구분합니다. Audio Practice의 sequenceToken은 이전 페이지 연속 재생을 취소합니다."}, {"en": "Responsive CSS changes control placement and page width for mobile. The reader image and its hotspot layer must always scale together.", "ko": "반응형 CSS는 모바일에서 조작부 배치와 페이지 폭을 바꿉니다. 책 이미지와 터치 영역 레이어는 항상 함께 확대·축소되어야 합니다."}], "recipe": [{"en": "Implement select book → render page → render hotspots → play item, then handle cancellation and missing audio explicitly.", "ko": "책 선택 → 페이지 표시 → 터치 영역 표시 → 항목 재생을 구현하고, 취소와 누락 음성을 명시적으로 처리합니다."}, {"en": "Reuse the same content contract in the list interface instead of copying the manuscripts into another independent dataset.", "ko": "목록 화면도 같은 콘텐츠 규격을 재사용하여 원고가 따로 중복되지 않게 합니다."}], "checks": [{"en": "Tap A then B rapidly; change page mid-playback; play a whole page then switch books; select missing audio. No stale highlight or previous sound should remain.", "ko": "A→B를 빠르게 누르기, 재생 중 페이지 변경, 페이지 연속 재생 중 책 변경, 누락 음성 선택을 시험합니다. 이전 표시나 소리가 남지 않아야 합니다."}], "evidence": [{"messageId": "a4-538"}, {"messageId": "a4-1567"}, {"path": "eccr-picture-audio-site/picturebook/app.js", "section": "playText; finishPlayback; stopAudio", "url": "https://github.com/JiEunJanetSong/eccr-picture-audio-site/blob/3b87245/picturebook/app.js"}, {"path": "eccr-picture-audio-site/audio/app.js", "section": "playSequence; stopAudio", "url": "https://github.com/JiEunJanetSong/eccr-picture-audio-site/blob/3b87245/audio/app.js"}, {"path": "기술인계문서-ECCR/TECHNICAL_HANDOFF_EN.md", "section": "12–14"}]}, {"id": "offline", "title": {"en": "Offline readiness is a complete download plus a fresh restart", "ko": "오프라인 준비: 전체 저장과 앱 재시작 확인"}, "intro": {"en": "A page visible while online is not proof of offline use. The complete images-and-audio package must be cached and remain usable after the app is closed.", "ko": "온라인에서 페이지가 보인다는 것만으로 오프라인 사용이 입증되지는 않습니다. 그림과 음성을 모두 저장하고 앱을 닫은 뒤에도 사용할 수 있어야 합니다."}, "points": [{"en": "manifest.webmanifest describes installation. pwa.js registers the service worker and shows progress. offline-assets.js lists required files. sw.js saves, updates and serves them.", "ko": "manifest.webmanifest는 설치 정보를, pwa.js는 서비스 워커 등록과 진행 표시를, offline-assets.js는 필수 파일 목록을, sw.js는 저장·갱신·제공을 담당합니다."}, {"en": "Save offline sends CACHE_ALL_OFFLINE_ASSETS; progress messages count files; Offline ready is reported only after the package is present.", "ko": "Save offline은 CACHE_ALL_OFFLINE_ASSETS를 보내고 진행 메시지가 파일 수를 셉니다. 패키지가 모두 있어야 Offline ready가 표시됩니다."}, {"en": "Browsers may request part of an MP3. createRangeResponse returns a 206 response with the requested cached byte range so offline audio can play.", "ko": "브라우저는 MP3의 일부 구간만 요청할 수 있습니다. createRangeResponse는 저장된 파일에서 해당 바이트 구간을 206 응답으로 제공해 오프라인 음성을 재생합니다."}], "recipe": [{"en": "After changing content, regenerate the asset list, use a new cache name, and update asset query versions. Do not hand-edit the generated list.", "ko": "내용을 바꾸면 자산 목록을 다시 만들고 새 캐시 이름과 자산 쿼리 버전을 사용합니다. 생성되는 목록은 수동 편집하지 않습니다."}, {"en": "Download online until Offline ready. Fully close the app, disconnect the network, reopen it in the same browser/profile and test both images and audio.", "ko": "온라인에서 Offline ready까지 저장합니다. 앱을 완전히 닫고 네트워크를 끊은 뒤 같은 브라우저·프로필로 다시 열어 그림과 소리를 시험합니다."}], "checks": [{"en": "Repeat on a phone and desktop. A successful warm session does not replace a cold offline restart. Browser storage can be cleared or evicted.", "ko": "폰과 데스크탑에서 각각 확인합니다. 이미 열린 화면에서 성공한 것만으로 오프라인 재실행 검증을 대신할 수 없습니다. 브라우저 저장소는 삭제·회수될 수 있습니다."}], "evidence": [{"messageId": "a4-1521"}, {"messageId": "a4-1567"}, {"messageId": "a4-1567r"}, {"messageId": "w733"}, {"path": "eccr-picture-audio-site/scripts/generate-offline-assets.mjs", "section": "", "url": "https://github.com/JiEunJanetSong/eccr-picture-audio-site/blob/3b87245/scripts/generate-offline-assets.mjs"}, {"path": "eccr-picture-audio-site/sw.js", "section": "cacheAllOfflineAssets; createRangeResponse", "url": "https://github.com/JiEunJanetSong/eccr-picture-audio-site/blob/3b87245/sw.js"}, {"path": "기술인계문서-ECCR/TECHNICAL_HANDOFF_EN.md", "section": "15–16"}], "code": {"language": "sh", "caption": {"en": "Verified package scripts; run from a working copy of the application repository", "ko": "실제 package.json에 있는 명령: 앱 저장소의 작업 사본에서 실행"}, "text": "npm run build:offline\nnpm run check\nnpm run serve\n# Open http://localhost:4173/"}}, {"id": "release-evidence", "title": {"en": "Release with evidence, and preserve the next maintainer’s starting point", "ko": "근거를 남기고 배포하여 다음 제작자의 출발점 만들기"}, "intro": {"en": "A repeatable release links approved inputs to outputs, verifies the actual deployed files, and explains what still needs teacher review.", "ko": "반복 가능한 배포는 승인된 입력과 산출물을 연결하고 실제 배포 파일을 검증하며, 교사가 더 확인해야 할 부분을 설명합니다."}, "points": [{"en": "The inspected package.json check script runs node --check on six JavaScript files. It checks syntax only; it does not validate references, learning content, hotspot positions or audio.", "ko": "확인한 package.json의 check는 여섯 JavaScript 파일에 node --check를 실행합니다. 문법만 검사하며 파일 연결·학습 내용·터치 위치·음성은 검증하지 않습니다."}, {"en": "The application’s GitHub workflow uploads the repository as a static Pages artifact on main pushes. Keep development-only material and private source records outside the published package.", "ko": "앱의 GitHub 워크플로는 main 푸시 시 저장소를 정적 Pages 산출물로 올립니다. 개발 전용 자료와 비공개 원문은 배포 패키지 밖에서 관리합니다."}, {"en": "The release record should name the source edition, page/audio inventory, cache version, changed files, automated checks, device checks and open questions.", "ko": "배포 기록에는 원본 판본·페이지/음성 목록·캐시 버전·변경 파일·자동 검사·기기 확인·미해결 질문을 적습니다."}], "recipe": [{"en": "Check syntax and file references, render the PDFs, listen to clips, verify mobile interaction and perform a cold offline restart. These checks answer different questions.", "ko": "문법·파일 연결 검사, PDF 렌더링, 클립 듣기, 모바일 조작, 오프라인 재실행을 각각 수행합니다. 서로 다른 오류를 확인하는 검사입니다."}, {"en": "After deployment completes, open the published URL and confirm the new revision and resource paths. Compare live metadata with the approved source before claiming synchronization.", "ko": "배포 완료 후 공개 URL에서 새 리비전과 자산 경로를 확인합니다. 동기화 완료라고 말하기 전에 실제 메타데이터와 승인본을 대조합니다."}, {"en": "Save a concise handoff with the next safe operation. Include the source files and approved assets needed to rebuild; prompts alone are not a complete source package.", "ko": "다음에 할 수 있는 작업을 적은 인계서를 저장합니다. 재제작에 필요한 소스와 승인 자산을 포함해야 하며 프롬프트만으로는 완전한 소스 패키지가 되지 않습니다."}], "checks": [{"en": "Separate “the assistant reported completion,” “a local file was inspected,” and “the deployed app was verified.” Each supports a different claim.", "ko": "“AI가 완료를 보고함”, “로컬 파일을 확인함”, “배포 앱을 검증함”을 구분합니다. 각각 뒷받침하는 주장이 다릅니다."}], "evidence": [{"messageId": "a4-1624"}, {"messageId": "a4-1624r"}, {"messageId": "a2-304r"}, {"path": "eccr-picture-audio-site/package.json", "section": "", "url": "https://github.com/JiEunJanetSong/eccr-picture-audio-site/blob/3b87245/package.json"}, {"path": "eccr-picture-audio-site/.github/workflows/pages.yml", "section": "", "url": "https://github.com/JiEunJanetSong/eccr-picture-audio-site/blob/3b87245/.github/workflows/pages.yml"}, {"path": "기술인계문서-ECCR/TECHNICAL_HANDOFF_EN.md", "section": "17–22"}], "code": {"language": "text", "caption": {"en": "A release record to complete during reproduction", "ko": "재현하며 작성하는 배포 기록"}, "text": "Source edition / source hashes:\nPDF pages / app page-map:\nAudio items / unresolved recordings:\nCache version / asset list:\nSyntax and reference checks:\nPhone / desktop / offline restart checks:\nDeployed revision / URL:\nTeacher review still needed:\nNext reproducible step:"}}], "criticalDrift": [{"en": "September 5 guides contain pre-review bilingual wording and lower-right-only folios; use later approved corrections and the target edition.", "ko": "9월 5일 지침에는 검토 전 두 언어 본문과 우하단 고정 쪽 번호가 있습니다. 후속 승인 교정과 대상 판본을 기준으로 합니다."}, {"en": "The app-ready no-blank PDFs were prepared but not integrated into the app in the September 15 record. Renumbering audio without PAGE_MAPPING would misroute clips.", "ko": "9월 15일 기록의 빈 면 제거 PDF는 제작되었으나 앱에는 미반영입니다. PAGE_MAPPING 없이 음성 번호를 바꾸면 클립이 잘못 연결됩니다."}, {"en": "Readers A–C and Book 0 remain classroom-review materials; automated audits do not establish validated learning outcomes.", "ko": "Reader A–C와 Book 0는 수업 검토 자료입니다. 자동 검사로 검증된 학습 성과를 주장할 수 없습니다."}]}, "tutorial": {"version": 1, "audience": {"en": "Teachers working with AI; code is optional and expandable.", "ko": "AI와 함께 만드는 교사. 코드는 필요할 때 펼쳐 봅니다."}, "intro": {"en": "Build one representative reader and its talking page, then reuse the method for the larger ECCR kit. The lessons follow artifact dependencies rather than the dates of the collaboration.", "ko": "대표 읽기책 한 권과 소리 나는 페이지를 만들고, 같은 방법을 ECCR 전체 자료로 확장합니다. 협업 날짜 대신 결과물이 만들어지는 순서대로 따라갑니다."}, "promptLabel": {"en": "New reusable prompt template", "ko": "새로 작성한 재사용 프롬프트"}, "evidenceLabel": {"en": "Historical request + response summary", "ko": "실제 요청 원문 + 응답 요약"}, "limits": {"en": "Browser exercises help you design, inspect and export work. Image generation, final PDF building, recording and deployment happen with the corresponding tools. Historical response summaries report what was said then; current files may differ.", "ko": "브라우저 실습에서는 내용을 설계·검토·내보내기 합니다. 이미지 생성·최종 PDF 제작·녹음·배포는 해당 도구에서 진행합니다. 과거 응답 요약은 당시 기록이며 현재 파일과 다를 수 있습니다."}, "workedExample": {"name": "Sam and the Cat — Book 7", "historicalSource": "w268", "historicalPages": 8, "currentPdfPages": 12, "currentSource": "book/output/pdf/최종/ECCR_Book_7.pdf", "historicalReadingText": ["Sam can pat the cat.", "The cat sat on a mat.", "Sam and the cat sat."], "currentReadingText": ["Sam can pat the cat.", "The cat sat on a mat.", "Sam and the cat sat on the mat."], "note": {"en": "The eight-page proposal and the twelve-page final Book 7 are different editions. Select one before reproducing it; keep classroom adaptations as named revisions.", "ko": "8쪽 제안과 최종 12쪽 Book 7은 다른 판본입니다. 재현할 기준을 먼저 고르고 학급용 변형은 별도 수정본으로 남기세요."}}, "lessons": [{"id": "brief", "title": {"en": "Start with one learner and one reading goal", "ko": "학생과 읽기 목표부터 정하기"}, "goal": {"en": "Turn a teaching intention into a brief that another person or AI can act on.", "ko": "수업 의도를 다른 사람이나 AI가 실행할 수 있는 제작 조건으로 바꿉니다."}, "teacherTask": {"en": "Choose the learners, language, sounds already taught and one observable success. Build one short reader first. Keep class observations separate from the manuscript.", "ko": "학습자, 언어, 이미 가르친 음가, 확인할 성취 한 가지를 정하세요. 먼저 짧은 읽기책 한 권을 만듭니다. 학급 관찰 기록과 원고는 구분해 둡니다."}, "inputs": [{"en": "Yaw’s eight-page “Sam and the Cat” proposal; a blank project brief.", "ko": "야우의 8쪽 “Sam and the Cat” 제안과 빈 제작 계획서."}, {"en": "Teacher-confirmed sound inventory, prepared words and a familiar setting.", "ko": "교사가 확인한 음가 목록, 미리 가르칠 단어, 학생에게 친숙한 배경."}], "prompt": {"en": "Help me make a short reader for [learners] in [language]. They already know [sounds]. I will teach [prepared words] before reading. The setting is [local context]. The learning goal is [observable action]. Start from the attached Sam and the Cat outline. Return a one-page brief with learner text, teacher directions, page functions and review questions separated. Identify any missing prerequisites. Do not silently add harder spelling patterns. Keep original source wording separate from proposed adaptations.", "ko": "내 학급 [학습자]를 위한 [언어] 짧은 읽기책을 만들자. 이미 배운 음가는 [목록], 읽기 전에 가르칠 단어는 [목록], 학생에게 친숙한 배경은 [장소]야. 확인할 학습 목표는 [관찰 가능한 행동]이야. 첨부한 Sam and the Cat 구성을 출발점으로 학생용 글, 교사용 지시, 페이지별 역할, 검토 질문을 구분한 한 장짜리 제작 계획서를 만들어줘. 필요한 선행 학습을 찾아주고, 더 어려운 철자 패턴을 임의로 추가하지 마. 원문과 수정 제안은 따로 표시해줘."}, "expected": {"en": "A saved project brief: audience, goal, prerequisites, page plan, source version and review owner.", "ko": "학습자·목표·선행 학습·쪽 구성·원본 버전·검토 담당자를 적은 제작 계획서."}, "checks": [{"en": "The goal describes what the learner will do, not only what the book will contain.", "ko": "책에 들어갈 내용뿐 아니라 학생이 할 행동이 적혀 있다."}, {"en": "Prepared words and sounds to teach first are visible.", "ko": "미리 가르칠 단어와 음가가 명시되어 있다."}, {"en": "The first deliverable is small enough to inspect page by page.", "ko": "첫 결과물은 한 쪽씩 검토할 수 있는 분량이다."}], "challenge": {"symptom": {"en": "“Make an attractive phonics book” produces a large workbook, but you wanted connected reading.", "ko": "“예쁜 파닉스 책을 만들어줘”라고 요청했더니 연결된 이야기 대신 큰 연습책이 나왔습니다."}, "revision": {"en": "Compare the result with the goal. For each requirement, point to the matching page or mark it missing. I need one illustration with connected sentences, not just isolated drills. Propose the smallest revision and preserve the previous file.", "ko": "결과물과 제작 목표를 대조해줘. 조건마다 해당 페이지를 적고, 없으면 누락으로 표시해줘. 한 그림에 연결된 여러 문장이 필요해. 가장 작은 수정안을 제시하고 이전 파일은 보존해줘."}, "lesson": {"en": "An explicit output contract catches a mismatch before producing a whole series.", "ko": "출력 조건을 먼저 정하면 시리즈 전체를 만들기 전에 요구와 결과의 차이를 찾을 수 있습니다."}}, "evidence": ["w268", "a0-0", "a0-0r", "a2-367", "a2-367r", "full-1228"], "transfer": {"en": "Replace the book number with the learner’s readiness. Yaw’s books serve different purposes and are introduced when learners are ready.", "ko": "책 번호 대신 학습자의 준비도를 기준으로 선택하세요. 야우의 교재들은 목적이 서로 다르며 학생이 준비되었을 때 도입합니다."}}, {"id": "manuscript", "title": {"en": "Keep the manuscript editable", "ko": "원고를 수정 가능한 데이터로 만들기"}, "goal": {"en": "Separate reading content from presentation so one correction can feed print, audio and practice.", "ko": "읽기 내용과 디자인을 분리해 한 번의 수정이 인쇄·음성·연습 자료에 이어지게 합니다."}, "teacherTask": {"en": "Enter the title, page roles and sentences. Compare the historical outline with the current edition before choosing a base. Mark words that need prior teaching.", "ko": "제목, 페이지 역할, 문장을 입력하세요. 과거 제작안과 현재 판본을 비교해 기준을 고릅니다. 미리 가르쳐야 할 단어를 표시하세요."}, "inputs": [{"en": "Historical page 4: “Sam can pat the cat. / The cat sat on a mat. / Sam and the cat sat.”", "ko": "과거 원고 4쪽: “Sam can pat the cat. / The cat sat on a mat. / Sam and the cat sat.”"}, {"en": "Current Book 7 PDF page 5 changes the final sentence to “Sam and the cat sat on the mat.”", "ko": "현재 Book 7의 PDF 5쪽에서는 마지막 문장이 “Sam and the cat sat on the mat.”로 수정되었습니다."}], "prompt": {"en": "Convert this approved source into editable page data. Keep page ID, role, title, exact learner sentences, teacher-read questions and illustration brief in separate fields. Do not rewrite text while transcribing it. Produce a separate review table for word length, taught sounds and prepared words. A short word is not automatically decodable; flag uncertain cases for the teacher. Save the source edition and a change log.", "ko": "승인한 원고를 수정 가능한 페이지 데이터로 정리해줘. 페이지 ID, 역할, 제목, 학생이 읽을 정확한 문장, 교사가 읽어줄 질문, 삽화 지시를 각각 다른 필드에 넣어줘. 옮겨 적는 동안 문장을 바꾸지 마. 단어 길이·이미 배운 음가·준비 단어 검토표는 별도로 만들어줘. 짧은 단어가 곧 읽기 가능한 단어라는 뜻은 아니므로 판단이 어려우면 교사 확인으로 표시해줘. 기준 판본과 변경 기록도 남겨줘."}, "expected": {"en": "Editable page data and a teacher review list; both the original and your adaptation remain identifiable.", "ko": "수정 가능한 페이지 데이터와 교사 검토 목록. 원문과 우리 학급용 수정본이 구별됩니다."}, "checks": [{"en": "Every sentence matches the selected source, including punctuation.", "ko": "모든 문장과 문장부호가 선택한 원본과 일치한다."}, {"en": "Teacher directions are not counted as learner decoding text.", "ko": "교사용 지시문을 학생 읽기 본문으로 계산하지 않는다."}, {"en": "Words such as after, to, by, was and glad in the historical story are reviewed against the actual teaching sequence.", "ko": "과거 이야기의 after, to, by, was, glad 등을 실제 교수 순서에 맞춰 검토했다."}], "challenge": {"symptom": {"en": "A word counter accepts “with” because it has four letters.", "ko": "단어 수 검사기가 with를 네 글자라는 이유로 통과시켰습니다."}, "revision": {"en": "List every word’s required sound-spelling knowledge and compare it with my taught inventory. Keep the automatic count as a warning tool. Propose changes separately; I will approve the learner text.", "ko": "각 단어에 필요한 음가·철자 지식을 이미 가르친 목록과 대조해줘. 자동 글자 수 검사는 경고 도구로만 사용하자. 수정안은 따로 제시해줘. 학생용 본문은 내가 승인할게."}, "lesson": {"en": "Counting can find violations of a length rule; teacher review determines teaching suitability.", "ko": "글자 수 검사는 길이 조건 위반을 찾고, 수업 적합성은 교사가 판단합니다."}}, "evidence": ["w268", "a0-0", "a2-367", "a2-367r", "a2-387", "a2-387r"], "transfer": {"en": "Use the same structure for a Twi story, but keep its language-specific review rules and reviewer.", "ko": "같은 구조를 Twi 이야기에도 쓰되 해당 언어의 검토 기준과 검토자를 따로 정하세요."}, "code": {"title": {"en": "Page data example", "ko": "페이지 데이터 예시"}, "language": "json", "text": "{\n  \"source\": \"Yaw historical outline — page 4\",\n  \"role\": \"reading-practice\",\n  \"title\": \"More Reading Practice\",\n  \"sentences\": [\n    \"Sam can pat the cat.\",\n    \"The cat sat on a mat.\",\n    \"Sam and the cat sat.\"\n  ]\n}", "source": "Historical text: w268; field structure: new tutorial example.", "note": {"en": "This compact schema is a new teaching example, not the original app’s runtime schema.", "ko": "이 간단한 형식은 새 실습 예시입니다. 기존 앱의 실행 데이터 형식과는 구분됩니다."}, "caption": {"en": "Page data example", "ko": "페이지 데이터 예시"}, "sourceNote": {"en": "This compact schema is a new teaching example, not the original app’s runtime schema.", "ko": "이 간단한 형식은 새 실습 예시입니다. 기존 앱의 실행 데이터 형식과는 구분됩니다."}}}, {"id": "illustration", "title": {"en": "Generate the picture; typeset the words", "ko": "그림은 생성하고 글자는 따로 조판하기"}, "goal": {"en": "Make illustrations replaceable while preserving exact spelling and readable text.", "ko": "삽화는 바꿀 수 있게 만들고 철자와 본문의 가독성은 정확하게 유지합니다."}, "teacherTask": {"en": "Write one scene brief from the approved sentences. Specify the people, action, objects and empty space. Request an image without letters, then inspect it against the text.", "ko": "승인한 문장으로 한 장면의 지시서를 쓰세요. 인물·행동·사물·여백을 정합니다. 글자 없는 이미지를 요청한 뒤 본문과 맞는지 확인합니다."}, "inputs": [{"en": "Approved More Reading Practice sentences and the historical Book 7 scene prompt.", "ko": "승인한 More Reading Practice 문장과 Book 7의 실제 삽화 프롬프트."}, {"en": "A consistent character reference and the intended image frame.", "ko": "일관된 인물 참조 이미지와 삽화가 들어갈 영역."}], "prompt": {"en": "Create one illustration for the attached reading page: Sam gently pats an orange cat sitting on a woven mat in a Ghanaian schoolyard. Preserve the agreed character design. Keep heads, hands, the cat and the whole mat safely inside the frame. Use an uncluttered warm early-reader style. Include no letters, words, numbers, captions or logos. I will typeset the exact sentences separately. Explain any source-text ambiguity before generating.", "ko": "첨부한 읽기 페이지에 넣을 삽화 한 장을 만들어줘. 가나 학교 마당에서 샘이 짜임 있는 매트에 앉은 주황색 고양이를 부드럽게 쓰다듬고 있어. 합의한 인물 디자인을 유지하고 머리·손·고양이·매트 전체가 프레임 안에 여유 있게 들어가게 해줘. 단정하고 따뜻한 초급 읽기책 분위기로, 글자·단어·숫자·자막·로고는 넣지 마. 정확한 문장은 내가 따로 조판할 거야. 원문이 모호하면 생성 전에 먼저 짚어줘."}, "expected": {"en": "An illustration file, its scene prompt and a record of the manuscript version it illustrates.", "ko": "삽화 파일, 사용한 장면 프롬프트, 기준 원고 버전 기록."}, "checks": [{"en": "The picture matches who does what and where.", "ko": "누가 무엇을 어디에서 하는지 본문과 맞는다."}, {"en": "Important faces and objects are entirely visible.", "ko": "주요 얼굴과 사물이 잘리지 않는다."}, {"en": "Learner text remains separate editable text.", "ko": "학생용 글자는 수정 가능한 별도 텍스트로 남아 있다."}], "challenge": {"symptom": {"en": "The generated picture misspells ɔ/ɛ or depicts the cat away from the mat.", "ko": "생성된 그림 속 ɔ/ɛ가 틀리거나 고양이가 매트와 떨어진 곳에 있습니다."}, "revision": {"en": "Remove all generated text from the artwork. Regenerate only the scene so the cat is visibly sitting on the mat. Keep the approved manuscript unchanged, and typeset it in a font that supports its characters.", "ko": "삽화 안에서 생성한 글자는 모두 없애줘. 고양이가 매트에 앉아 있는 장면만 다시 만들어줘. 승인된 원고는 그대로 두고 해당 문자를 지원하는 글꼴로 따로 조판해줘."}, "lesson": {"en": "Text–image separation makes both language correction and image replacement manageable.", "ko": "글자와 그림을 분리하면 언어 교정과 삽화 교체를 각각 다룰 수 있습니다."}}, "evidence": ["w165", "a0-10", "a0-10r", "a1-10", "a1-10r", "revision-note"], "transfer": {"en": "Ask the local teacher to check clothing, objects, relationships and setting before reusing the image style.", "ko": "같은 그림 스타일을 계속 쓰기 전에 현지 교사에게 의복·사물·관계·배경을 확인받으세요."}, "code": {"title": {"en": "Historical scene prompt", "ko": "실제 사용한 장면 프롬프트"}, "language": "text", "text": "More reading illustration: Sam gently patting the orange cat while the cat sits on a woven mat, no text.", "source": "book/v.0/결과물Yaw_Janet/book_7_8_9_materials/05_prompts/sam_and_cat_imagegen_prompts.md", "note": {"en": "Verbatim scene text from the saved production prompts; the reusable prompt above is newly written.", "ko": "저장된 제작 프롬프트의 장면 원문입니다. 위의 재사용 프롬프트는 새로 작성했습니다."}, "caption": {"en": "Historical scene prompt", "ko": "실제 사용한 장면 프롬프트"}, "sourceNote": {"en": "Verbatim scene text from the saved production prompts; the reusable prompt above is newly written.", "ko": "저장된 제작 프롬프트의 장면 원문입니다. 위의 재사용 프롬프트는 새로 작성했습니다."}}}, {"id": "layout", "title": {"en": "Build one page before a whole book", "ko": "한 페이지를 검토한 뒤 책 전체로 확장하기"}, "goal": {"en": "Learn how image fitting, text size, spacing and page identity affect a usable book.", "ko": "이미지 맞춤, 글자 크기, 간격, 페이지 구분이 사용성에 주는 영향을 익힙니다."}, "teacherTask": {"en": "Combine one approved image and the exact sentences. Adjust the image/text balance in the preview. Inspect the entire image, then export the book and inspect every page.", "ko": "승인한 그림 한 장과 정확한 문장을 합쳐보세요. 미리보기에서 그림과 본문의 비율을 바꿉니다. 그림 전체를 확인한 뒤 책을 내보내고 모든 쪽을 살펴봅니다."}, "inputs": [{"en": "Editable manuscript, separate image and a chosen paper size.", "ko": "수정 가능한 원고, 별도 삽화, 선택한 종이 크기."}, {"en": "A page map that distinguishes PDF page index from printed page number.", "ko": "PDF 쪽 순서와 인쇄된 쪽 번호를 구분한 페이지 표."}], "prompt": {"en": "Lay out the approved manuscript and separate images as a reader. Keep text out of image areas. Fit each illustration without cutting off people or important objects. Use [paper size], readable text and real writing space. Return the editable source, PDF, page previews and page map. Mark app and print editions explicitly. If the page count differs from the historical eight-page "}, "expected": {"en": "A corrected edition, before/after record and a list of dependent items to update.", "ko": "수정 판본, 이전·이후 기록, 함께 고쳐야 할 연결 자료 목록."}, "checks": [{"en": "The correction is applied to the right edition and page.", "ko": "정확한 판본과 페이지를 수정했다."}, {"en": "Special characters, apostrophes and punctuation survive export.", "ko": "특수문자·아포스트로피·문장부호가 내보낸 결과에도 정확하다."}, {"en": "The picture, question, answer and audio still agree with the text.", "ko": "그림·질문·정답·음성이 본문과 일치한다."}], "challenge": {"symptom": {"en": "An English gloss intended for the illustrator appears in the learner’s Twi book.", "ko": "삽화 제작자의 이해를 돕기 위한 영어 번역이 학생용 Twi 책에 들어갔습니다."}, "revision": {"en": "Label each text as learner-facing or production-only. Use Yaw’s final instruction to remove the English gloss from the affected learner pages. Keep it in the production notes. Show the exact pages changed.", "ko": "각 글을 학생용과 제작 참고용으로 구분해줘. 야우의 최종 지시에 따라 해당 학생용 페이지에서 영어 풀이를 제거하고 제작 노트에는 보존해줘. 어느 페이지를 바꿨는지 보여줘."}, "lesson": {"en": "A source can explain the author’s intent without belonging in the finished learner book.", "ko": "원고의 일부는 저자의 의도를 설명하기 위한 자료이며 학생용 책에 들어갈 내용은 아닐 수 있습니다."}}, "evidence": ["w684", "w686", "a2-63", "a2-63r", "w688", "a2-70", "a2-70r", "w857", "a2-277", "a2-277r", "revision-note"], "transfer": {"en": "Use the same correction log for an assessment. Record the skill being checked and teacher-observed difficulty before expanding to a class set.", "ko": "평가 자료에도 같은 수정 기록을 쓰세요. 학급 전체 세트로 확장하기 전에 확인할 기능과 교사가 관찰한 어려움을 적습니다."}}, {"id": "audio", "title": {"en": "Connect a printed sentence to a recording", "ko": "인쇄된 문장과 교사 녹음 연결하기"}, "goal": {"en": "Understand a talking page as image + exact text + touch rectangle + audio file.", "ko": "소리 나는 페이지를 그림·정확한 문장·터치 사각형·음성 파일의 연결로 이해합니다."}, "teacherTask": {"en": "Record or select one approved sentence. Match it by listening, then place a touch area over that printed sentence. Resize the preview and test the same target.", "ko": "승인한 문장 하나를 녹음하 efore batch editing.", "ko": "전체 이미지 크기를 기준으로 영역을 다시 계산하고 화면 크기를 바꿔 확인해줘. 원본 녹음과 잘라낸 파일을 둘 다 들어보자. 음성 자체를 바꾸기 전에 빠진 쉼과 재생 속도를 확인해줘. 원인을 설명하고 한 문장을 확인한 다음 일괄 수정해줘."}, "lesson": {"en": "Audio quality depends on exact matching and timing as well as the voice.", "ko": "음성 품질은 목소리뿐 아니라 정확한 문장 연결과 시간 간격에 달려 있습니다."}}, "evidence": ["a4-476", "a4-476r", "a4-538", "a4-538r", "w605", "a4-1637", "a4-1637r", "a4-1624", "a4-1624r"], "transfer": {"en": "Keep Twi and English clips separate when the printed lines are separate. Re-record changed text before replacing a deployed page.", "ko": "인쇄된 Twi와 영어 줄이 나뉘면 녹음도 따로 연결하세요. 배포된 페이지의 문장을 바꾸면 해당 녹음도 다시 준비합니다."}, "code": {"title": {"en": "The app’s recorded-audio data shape", "ko": "앱의 녹음 연결 데이터 형식"}, "language": "js", "text": "{\n  text: \"Sam has a cap.\",\n  speechText: \"Sam has a cap.\",\n  audioSrc: \"audio/book7/page-04-01.mp3\",\n  box: { x: 47, y: 28, w: 36, h: 8 },\n  lang: \"en\"\n}", "source": "기술인계문서-ECCR/TECHNICAL_HANDOFF_EN.md §5", "note": {"en": "The handoff’s example, not coordinates to reuse blindly. x/y/w/h are percentages; measure your actual final page.", "ko": "인계 문서의 예시입니다. 좌표를 그대로 복사하지 말고 실제 최종 페이지에서 측정하세요. x/y/w/h는 백분율입니다."}, "caption": {"en": "The app’s recorded-audio data shape", "ko": "앱의 녹음 연결 데이터 형식"}, "sourceNote": {"en": "The handoff’s example, not coordinates to reuse blindly. x/y/w/h are percentages; measure your actual final page.", "ko": "인계 문서의 예시입니다. 좌표를 그대로 복사하지 말고 실제 최종 페이지에서 측정하세요. x/y/w/h는 백분율입니다."}}}, {"id": "offline", "title": {"en": "Prove it can reopen without internet", "ko": "인터넷 없이 다시 열리는지 확인하기"}, "goal": {"en": "Distinguish a page still open in memory from a complete offline package.", "ko": "이미 열려 있는 화면과 완전히 저장된 오프라인 패키지를 구별합니다."}, "teacherTask": {"en": "While online, save all book images and recordings. Wait for the ready message. Disconnect, close the app completely and reopen it in the same browser. Test pages and audio.", "ko": "온라인 상태에서 책 그림과 녹음을 모두 저장하세요. 준비 완료 표시를 기다립니다. 연결을 끊고

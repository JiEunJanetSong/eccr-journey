function renderProgress(){const count=DATA.tutorial.lessons.filter(l=>doneCount(l)===l.checks.length).length;$('progressLabel').textContent=lang==='en'?`${count} / ${DATA.tutorial.lessons.length} steps checked`:`${DATA.tutorial.lessons.length}단계 중 ${count}단계 점검`;$('progressMeter').max=DATA.tutorial.lessons.length;$('progressMeter').value=count;}
function renderNav(){const sections=mode==='technical'?DATA.tech.sections:DATA.tutorial.lessons,sel=mode==='technical'?selectedTech:selectedLesson;$('chapterNav').innerHTML=`<p class="nav-label">${t(mode==='technical'?'technicalNav':'tutorialNav')}</p>`+sections.map((s,i)=>`<button data-chapter="${s.id}" class="${s.id===sel?'active':''}" aria-current="${s.id===sel?'step':'false'}"><span class="number">${String(i+1).padStart(2,'0')}</span><span><strong>${esc(tx(s.title))}</strong>${mode==='tutorial'?`<small>${doneCount(s)} / ${s.checks.length} ${t('complete')}</small>`:''}</span></button>`).join('');}
function chapterFooter(section){const sections=mode==='technical'?DATA.tech.sections:DATA.tutorial.lessons,index=sections.indexOf(section);return `<footer class="chapter-footer"><button class="button" data-step="-1" ${index===0?'disabled':''}>${t('prev')}</button><small>${mode==='tutorial'?(lang==='en'?'Your checks save in this browser.':'점검 기록은 브라우저에 저장됩니다.'):(lang==='en'?'Sources and edition limits are linked above.':'판본·근거를 함께 확인하세요.')}</small><button class="button primary" data-step="1" ${index===sections.length-1?'disabled':''}>${t('next')}</button></footer>`}
function renderTechnical(s){return `<div class="chapter-top"><span class="eyebrow">${t('manual')} / ${String(DATA.tech.sections.indexOf(s)+1).padStart(2,'0')}</span><span class="tag">SOURCE: 3b87245 · 2026-10-21</span></div><h2>${esc(tx(s.title))}</h2><p class="chapter-intro">${esc(tx(s.intro))}</p><a class="text-link" href="downloads/technical-manual-${lang}.html" target="_blank" rel="noopener">${lang==='en'?'Open the printable technical manual ↗':'인쇄·보관용 기술문서 열기 ↗'}</a><h3>${t('purpose')}</h3>${list(s.points)}<h3>${t('recipe')}</h3>${list(s.recipe,'ol')}<h3>${t('verify')}</h3>${list(s.checks)}${s.caveat?`<div class="callout">${esc(tx(s.caveat))}</div>`:''}${codeHTML(s.code)}${evidenceLinks(s)}${chapterFooter(s)}`}
function checkHTML(s){return `<div class="checks">${s.checks.map((c,i)=>`<label class="check ${work.checks[s.id+'-'+i]?'checked':''}"><input type="checkbox" data-check="${s.id}-${i}" ${work.checks[s.id+'-'+i]?'checked':''}><span>${esc(tx(c))}</span></label>`).join('')}</div>`}
function renderTutorial(s){return `<div class="chapter-top"><span class="eyebrow">${t('walkthrough')} / ${String(DATA.tutorial.lessons.indexOf(s)+1).padStart(2,'0')}</span><span class="tag">${t('draftLabel')}</span></div><h2>${esc(tx(s.title))}</h2><p class="chapter-intro">${esc(tx(s.goal))}</p><span class="small-label">${t('input')}</span>${list(s.inputs)}<div class="teacher-note"><span class="small-label">${t('task')}</span>${esc(tx(s.teacherTask))}</div>${labHTML(s.id)}<details class="prompt-block"><summary>${t('prompt')}</summary><div class="inner"><p class="prompt-note">${t('newPrompt')}</p><pre id="assembledPrompt" class="prompt-text">${esc(assemblePrompt(s))}</pre><div class="copy-row"><button class="button primary" data-copy-prompt>${t('copy')}</button><small>${lang==='en'?'Paste into the AI tool you use. This page does not call an AI model.':'사용하는 AI 도구에 붙여 넣으세요. 이 페이지는 AI를 호출하지 않습니다.'}</small></div></div></details><h3>${t('expected')}</h3><p class="chapter-intro">${esc(tx(s.expected))}</p><h3>${t('checks')}</h3><p class="prompt-note">${t('checkNote')}</p>${checkHTML(s)}<h3>${t('challenge')}</h3><p class="chapter-intro">${esc(tx(s.challenge.symptom))}</p><details class="prompt-block"><summary>${t('revision')}</summary><div class="inner"><pre class="prompt-text">${esc(tx(s.challenge.revision))}</pre><button class="button" data-copy-revision>${t('copy')}</button><p class="prompt-note">${esc(tx(s.challenge.lesson))}</p></div></details><div class="callout"><strong>${t('transfer')}</strong><br>${esc(tx(s.transfer))}</div>${codeHTML(s.code)}${evidenceLinks(s)}${chapterFooter(s)}`}
function renderChapter(){$('chapter').innerHTML=mode==='technical'?renderTechnical(current()):renderTutorial(current());if(mode==='tutorial')updateLab();}
function renderLanguage(){document.documentElement.lang=lang;document.body.classList.toggle('ko',lang==='ko');document.querySelectorAll('[data-i]').forEach(el=>el.textContent=t(el.dataset.i));document.querySelectorAll('[data-lang]').forEach(b=>{b.classList.toggle('active',b.dataset.lang===lang);b.setAttribute('aria-pressed',b.dataset.lang===lang)});document.querySelectorAll('.modes [data-mode]').forEach(b=>{b.classList.toggle('active',b.dataset.mode===mode);b.setAttribute('aria-pressed',b.dataset.mode===mode)});$('evidenceSearch').placeholder=t('search');renderProgress();renderNav();renderChapter();if($('evidenceDialog').open)renderEvidence();}
function navigate(newMode,id){mode=newMode;if(mode==='technical')selectedTech=id||selectedTech;else selectedLesson=id||selectedLesson;const hash='#'+mode+'/'+(mode==='technical'?selectedTech:selectedLesson);history.replaceState(null,'',hash);renderLanguage();const active=$('chapterNav').querySelector('[aria-current="step"]');if(active&&matchMedia('(max-width:730px)').matches)$('chapterNav').scrollLeft=active.offsetLeft-$('chapterNav').offsetLeft-12;}
function assemblePrompt(s){return tx(s.prompt)+'\n\n'+(lang==='en'?'MY CURRENT WORKING INPUTS (review before sending):':'현재 실습 입력 (전송 전에 검토하세요):')+'\n'+JSON.stringify({brief:work.brief,manuscript:work.manuscript,...(['illustration','layout'].includes(s.id)?{scene:work.scene,character:work.character}:{}),...(s.id==='review'?{before:work.before,after:work.after}:{})},null,2);}
function field(label,key,value,type='text'){return `<label>${label}<input type="${type}" data-field="${key}" value="${esc(value)}"></label>`}
function area(label,key,value){return `<label>${label}<textarea data-field="${key}">${esc(value)}</textarea></label>`}
function labHTML(id){let body='';const L=(en,ko)=>lang==='en'?en:ko;
if(id==='brief'){body=`<div class="two-column">${field(L('Learners','학습자'),'brief.learners',work.brief.learners)}${field(L('Language','언어'),'brief.language',work.brief.language)}${field(L('Known sounds','이미 배운 음가'),'brief.sounds',work.brief.sounds)}${field(L('Prepared words','미리 가르칠 단어'),'brief.prepared',work.brief.prepared)}</div>${field(L('Observable reading goal','관찰할 읽기 목표'),'brief.goal',work.brief.goal)}${field(L('Familiar setting','친숙한 배경'),'brief.setting',work.brief.setting)}<p>${L('These inputs are appended to each lesson’s copyable prompt and included in your exported practice file.','입력 내용은 각 단계의 복사용 프롬프트와 실습 기록 파일에 포함됩니다.')}</p>`;}
if(id==='manuscript'){body=area(L('Edit this historical three-sentence passage','초기 원고의 세 문장을 수정해 보세요'),'manuscript',work.manuscript)+field(L('Your maximum words per sentence','한 문장 최대 단어 수'),'maxWords',work.maxWords,'number')+`<div id="manuscriptReport" class="lab-output" aria-live="polite"></div><p class="prompt-note">${L('This checks word counts and characters only. It cannot judge pronunciation or whether a learner can decode the words.','단어 수와 문자만 검사합니다. 발음의 정확성이나 학생의 해독 가능성을 판정하지 않습니다.')}</p>`;}
if(id==='illustration'){body=area(L('One action in one scene','한 장면의 한 동작'),'scene',work.scene)+area(L('Character continuity note','인물 일관성 메모'),'character',work.character)+`<label>${L('Bring your approved illustration (optional)','검토한 삽화 가져오기 (선택)')}<input id="illustrationFile" type="file" accept="image/png,image/jpeg,image/webp"></label><p>${L('The image stays in this tab and appears in the next layout exercise. To keep it with your book, add it to the starter app and export a backup there.','그림은 이 탭에서만 사용되며 다음 배치 실습에 표시됩니다. 교재에 보존하려면 실습 앱에 넣고 그곳에서 백업을 저장하세요.')}</p><div class="lab-output" id="illustrationReport"></div>`;}
if(id==='layout'){body=`<div class="layout-grid"><div><label>${L('Space for illustration','그림 영역')} <span id="imageShareLabel"></span><input type="range" data-field="imageShare" min="25" max="65" value="${work.imageShare}"></label><label>${L('Text size in this scaled preview','축소 미리보기 글자 크기')} <span id="fontSizeLabel"></span><input type="range" data-field="fontSize" min="10" max="22" value="${work.fontSize}"></label><p>${L('Change the layout without regenerating the text or image. This preview teaches proportions; use the starter app’s print view for your printable reader.','글이나 그림을 다시 생성하지 않고 배치를 바꿔보세요. 비율을 연습하는 축소 미리보기이며, 인쇄할 자료는 실습 앱의 인쇄 화면에서 만듭니다.')}</p></div><div class="page-preview"><div class="illustration-slot" id="illustrationSlot"></div><div class="preview-sentences" id="previewText"></div><div class="preview-folio">PRACTICE · 01</div></div></div><p id="layoutReport" class="diagnostics" aria-live="polite"></p>`;}
if(id==='review'){body=`<div class="review-grid">${area(L('Before','수정 전'),'before',work.before)}${area(L('Teacher-approved correction','교사 검토 후 문구'),'after',work.after)}</div><div id="reviewReport" class="lab-output"></div><p>${L('Keep the original and corrected text together. Record the physical PDF page and printed page separately when reporting a correction.','원문과 교정 문구를 함께 보관하세요. 실제 PDF 쪽과 인쇄 쪽 번호를 구분해서 수정 요청에 적으세요.')}</p>`;}
if(id==='audio'){body=`<p>${L('Use the starter app for actual recording and playback. Here, practise the percentage coordinates used by the original picture-book app.','실제 녹음·재생은 실습 앱에서 합니다. 여기서는 기존 그림책 앱의 퍼센트 좌표 계산을 연습합니다.')}</p><a class="button primary" href="starter/" target="_blank" rel="noopener">${t('openKit')}</a><div class="mini-grid" style="margin-top:16px">${field(L('Image width px','이미지 폭 px'),'hotspot.width',work.hotspot.width,'number')}${field(L('Image height px','이미지 높이 px'),'hotspot.height',work.hotspot.height,'number')}${field('Left px','hotspot.left',work.hotspot.left,'number')}${field('Top px','hotspot.top',work.hotspot.top,'number')}${field(L('Box width px','영역 폭 px'),'hotspot.boxWidth',work.hotspot.boxWidth,'number')}${field(L('Box height px','영역 높이 px'),'hotspot.boxHeight',work.hotspot.boxHeight,'number')}</div><div class="hotspot-stage"><p class="sample-line">Sam can pat the cat.</p><div class="hotspot-target" id="hotspotTarget"></div></div><pre id="hotspotReport"></pre>`;}
if(id==='offline'){body=`<p>${L('The starter has its own service worker. Save it for offline use, wait for the actual completion message, then disconnect and reopen the same URL in the same browser. The manual itself is not an offline app.','실습 앱에는 전용 서비스 워커가 있습니다. 오프라인 저장을 완료한 뒤 연결을 끊고 같은 브라우저에서 같은 주소를 다시 여세요. 이 설명서 자체는 오프라인 앱이 아닙니다.')}</p><a class="button primary" href="starter/" target="_blank" rel="noopener">${t('openKit')}</a>${area(L('Record what you observed (device, browser, close/reopen, page and audio)','시험 기록 (기기·브라우저·재실행·페이지·음성)'),'offlineNote',work.offlineNote)}`;}
if(id==='release'){body=`<div class="code-downloads"><a class="button primary" href="downloads/eccr-starter-kit.zip" download>${t('download')}</a><button class="button" data-export>${t('export')}</button></div><div id="releaseReport" class="lab-output"></div><p>${L('Your practice JSON contains these learning notes and checkmarks. Export the starter app’s own backup separately to include the book, uploaded pictures and recordings.','실습 기록 JSON에는 이 페이지의 입력과 점검 표시가 담깁니다. 교재·업로드한 그림·녹음은 실습 앱에서 별도 백업으로 내보내세요.')}</p>`;}
return `<section class="lab"><div class="lab-heading"><strong>${t('lab')}</strong><span>${t('local')}</span></div>${body}</section>`;}
function updateLab(){const id=selectedLesson,L=(en,ko)=>lang==='en'?en:ko;
if(id==='manuscript'){const rows=work.manuscript.split(/\n+/).filter(s=>s.trim()),cap=Math.max(1,Number(work.maxWords)||8);const stats=rows.map(s=>({text:s,words:s.trim().split(/\s+/).length}));$('manuscriptReport').innerHTML=stats.map((r,i)=>`<p><b>${i+1}.</b> ${esc(r.text)} <span class="${r.words>cap?'warning':'success'}">${r.words} ${L('words','단어')}${r.words>cap?' · '+L('review the length','길이 검토'):''}</span></p>`).join('')||L('Add a sentence to inspect.','검사할 문장을 넣으세요.');}
if(id==='illustration')$('illustrationReport').innerHTML=`<strong>${L('Keep these separate','분리해서 보관하기')}</strong><p>${L('manuscript.json → typeset text\nillustration file → picture only','manuscript.json → 조판할 글\n삽화 파일 → 그림만')}</p><p>${illustrationUrl?L('Illustration loaded for this tab.','이 탭에서 사용할 그림을 불러왔습니다.'):L('No illustration loaded yet.','아직 불러온 그림이 없습니다.')}</p>`;
if(id==='layout'){const slot=$('illustrationSlot');slot.style.height=work.imageShare+'%';slot.style.flex='0 0 '+work.imageShare+'%';slot.innerHTML=illustrationUrl?`<img alt="${L('Your illustration','직접 넣은 삽화')}" src="${illustrationUrl}">`:`${L('Your illustration\n(no text inside the image)','직접 준비한 그림\n(글은 그림과 분리)')}`;$('previewText').textContent=work.manuscript;$('previewText').style.fontSize=work.fontSize+'px';$('imageShareLabel').textContent=work.imageShare+'%';$('fontSizeLabel').textContent=work.fontSize+'px';requestAnimationFrame(()=>{const page=$('previewText')?.closest('.page-preview');if(page&&$('layoutReport'))$('layoutReport').textContent=page.scrollHeight>page.clientHeight+2?L('The content overflows the page. Reduce the image area, text size or sentence count.','내용이 페이지를 넘칩니다. 그림 영역·글자 크기·문장 수를 조절하세요.'):L('The preview fits. Now inspect the printed size, glyphs and finger space.','미리보기에 들어갑니다. 실제 인쇄 크기·글자·터치 여유도 확인하세요.')});}
if(id==='review'){$('reviewReport').innerHTML=`<p>${esc(work.before)} <b>→</b> <span class="change">${esc(work.after)}</span></p><p>${work.before===work.after?L('No text change.','문구 변화가 없습니다.'):L('A specific replacement is recorded. Rebuild the page, inspect glyphs, then update any matching audio.','구체적인 교체 문구가 기록됐습니다. 페이지를 다시 만들고 글자를 확인한 뒤 대응 음성도 점검하세요.')}</p>`;}
if(id==='audio'){const h=work.hotspot,valid=[h.width,h.height,h.boxWidth,h.boxHeight].every(n=>Number.isFinite(Number(n))&&Number(n)>0)&&[h.left,h.top].every(n=>Number.isFinite(Number(n))&&Number(n)>=0);if(!valid){$('hotspotReport').textContent=L('Use positive image and box dimensions; left/top must be zero or greater.','이미지·영역 크기는 양수, 시작 좌표는 0 이상이어야 합니다.');$('hotspotTarget').hidden=true;}else{const box={x:Number(h.left)/Number(h.width)*100,y:Number(h.top)/Number(h.height)*100,w:Number(h.boxWidth)/Number(h.width)*100,h:Number(h.boxHeight)/Number(h.height)*100};$('hotspotReport').textContent=JSON.stringify(Object.fromEntries(Object.entries(box).map(([k,v])=>[k,Number(v.toFixed(2))])),null,2)+(box.x+box.w>100||box.y+box.h>100?'\n'+L('Outside the page: adjust the box.','페이지 밖으로 벗어납니다. 영역을 조절하세요.'):'');$('hotspotTarget').hidden=false;Object.assign($('hotspotTarget').style,{left:box.x+'%',top:box.y+'%',width:box.w+'%',height:box.h+'%'});}}
if(id==='release'){$('releaseReport').innerHTML=DATA.tutorial.lessons.map(s=>`<p>${doneCount(s)===s.checks.length?'✓':'○'} ${esc(tx(s.title))} · ${doneCount(s)}/${s.checks.length}</p>`).join('');}
const prompt=$('assembledPrompt');if(prompt)prompt.textContent=assemblePrompt(current());}
function pairIds(ids){const selected=new Set(ids);for(const id of [...selected]){const m=DATA.history.messages.find(m=>m.id===id);if(m?.kind==='prompt')selected.add(id+'r');if(m?.kind==='response')selected.add(id.slice(0,-1));}return selected;}
function openEvidence(ids,target=null){evidenceIds=ids?.length?pairIds(ids):null;evidenceTarget=target;$('evidenceSearch').value='';renderEvidence();if(!$('evidenceDialog').open)$('evidenceDialog').showModal();requestAnimationFrame(()=>{const node=target?document.getElementById('source-'+target):null;if(node){node.scrollIntoView({block:'start',behavior:'instant'});node.querySelector('summary')?.focus({preventScroll:true})}else $('evidenceBody').scrollTop=0});}
function renderEvidence(){const q=$('evidenceSearch').value.trim().toLocaleLowerCase();let ms=DATA.history.messages.filter(m=>!evidenceIds||evidenceIds.has(m.id));if(q){const hits=pairIds(ms.filter(m=>(m.original+' '+m.summary.en+' '+m.summary.ko).toLocaleLowerCase().includes(q)).map(m=>m.id));ms=ms.filter(m=>hits.has(m.id));}$('evidenceCount').textContent=ms.length+(lang==='en'?' records':'개 기록');$('evidenceBody').innerHTML=ms.map(m=>`<article class="message ${m.role} ${m.id===evidenceTarget?'target':''}" id="source-${m.id}"><div class="message-head"><strong>${m.role==='yaw'?'Yaw':m.role==='janet'?'Janet':m.role==='ai'?(lang==='en'?'AI response':'AI 응답'):(lang==='en'?'Production record':'제작 기록')}</strong><span>${esc(m.date)} ${esc(m.time)}</span></div><div class="bubble"><small>${esc(tx(m.label))} · ${t('summary')}</small><p>${esc(tx(m.summary))}</p><details ${m.id===evidenceTarget?'open':''}><summary>${t(m.kind==='response'?'responseOriginal':'recordOriginal')}</summary><pre>${esc(m.original)}</pre><button class="button" data-copy-original="${m.id}">${t('copy')}</button></details></div><div class="message-source">${esc(m.source)}</div></article>`).join('')||`<p class="prompt-note">${t('empty')}</p>`;}
function openDocument(path){const doc=DATA.documents[path];if(!doc)return;const href=doc.url?`<a href="${esc(doc.url)}" target="_blank" rel="noopener">${lang==='en'?'Open the source snapshot on GitHub ↗':'GitHub 원본 스냅샷 보기 ↗'}</a>`:'';$('evidenceSearch').value='';$('evidenceCount').textContent=t('savedSource');$('evidenceBody').innerHTML=`<article class="source-document"><h3>${esc(path)}</h3><p class="prompt-note">${lang==='en'?'Exact source text. Older instructions may be superseded; read the edition notes in the manual.':'원자료 문구입니다. 오래된 지침은 후속 교정으로 바뀌었을 수 있으므로 기술문서의 판본 설명을 함께 확인하세요.'}</p>${href}<pre>${esc(doc.text)}</pre></article>`;if(!$('evidenceDialog').open)$('evidenceDialog').showModal();$('evidenceBody').scrollTop=0;}
function showAudit(){const s=DATA.tech.verifiedSnapshot;const rows=[['Print PDFs / 인쇄본',lang==='en'?'Final folder contains Books 1–9 and later supplements; earlier manuscripts can differ in text, size and page count.':'최종 폴더에는 Book 1–9와 후속 보조 자료가 있습니다. 초기 원고는 문구·크기·쪽수가 다를 수 있습니다.'],['Production app / 제작 앱',lang==='en'?`${s.books} books · ${s.pages} page images · ${s.uniqueReferencedMp3Files} distinct referenced MP3 files · ${s.explicitlyMissingAudioItems} explicitly missing audio items. Source revision ${s.revision}.`:`${s.books}권 · 페이지 이미지 ${s.pages}개 · 참조 MP3 ${s.uniqueReferencedMp3Files}개 · 녹음 누락 표시 ${s.explicitlyMissingAudioItems}개. 소스 리비전 ${s.revision}.`],['Starter kit / 실습 키트',t('kitScope')]];$('auditBody').innerHTML=`<p>${esc(tx(s.note))}</p><table><thead><tr><th>${lang==='en'?'Output':'자료'}</th><th>${lang==='en'?'Reproduction boundary':'재현 범위'}</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${r[0]}</td><td>${esc(r[1])}</td></tr>`).join('')}</tbody></table><div class="callout">${lang==='en'?'The starter reproduces the workflow, not the exact final illustrations or the entire production app. Original artwork, approved fonts, final page maps and recordings must be retained to reproduce an exact edition.':'실습 키트는 제작 과정을 재현하며, 최종 삽화나 전체 제작 앱을 그대로 복제하지 않습니다. 특정 판본을 정확히 다시 만들려면 원본 그림·승인 글꼴·최종 페이지 대응표·녹음을 함께 보존해야 합니다.'}</div><p><a href="${s.repositoryUrl}" target="_blank" rel="noopener">GitHub · ${s.revision} ↗</a></p><p class="prompt-note">${t('snapshotLabel')}</p>`;$('auditDialog').showModal();}
async function copy(text){try{await navigator.clipboard.writeText(text);toast(t('copyDone'))}catch{toast(lang==='en'?'Select the text and copy it.':'문구를 선택해서 복사하세요.')}}
function exportWork(){const record={format:'eccr-teacher-workbook-v1',exportedAt:new Date().toISOString(),...work};const blob=new Blob([JSON.stringify(record,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='eccr-my-practice.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast(t('exportDone'));}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.lang){lang=b.dataset.lang;try{localStorage.setItem('eccr-build-teach-language',lang)}catch{}renderLanguage();}if(b.dataset.mode){navigate(b.dataset.mode);$('workspace').scrollIntoView({block:'start'});}if(b.dataset.chapter)navigate(mode,b.dataset.chapter);if(b.dataset.step){const sections=mode==='technical'?DATA.tech.sections:DATA.tutorial.lessons,i=sections.indexOf(current())+Number(b.dataset.step);if(sections[i]){navigate(mode,sections[i].id);$('workspace').scrollIntoView({block:'start'});}}if(b.dataset.evidence)openEvidence(refs(current()).filter(r=>r.messageId).map(r=>r.messageId),b.dataset.evidence);if(b.dataset.document)openDocument(b.dataset.document);if(b.hasAttribute('data-copy-prompt'))copy(assemblePrompt(current()));if(b.hasAttribute('data-copy-revision'))copy(tx(current().challenge.revision));if(b.hasAttribute('data-copy-code'))copy(current().code.text||current().code.code||current().code);if(b.dataset.copyOriginal)copy(DATA.history.messages.find(m=>m.id===b.dataset.copyOriginal).original);if(b.hasAttribute('data-export'))exportWork();});
document.addEventListener('input',e=>{const key=e.target.dataset.field;if(!key)return;const num=['maxWords','imageShare','fontSize'].includes(key)||key.startsWith('hotspot.');const value=num?Number(e.target.value):e.target.value;const parts=key.split('.');if(parts.length===2)work[parts[0]][parts[1]]=value;else work[key]=value;save();updateLab();});
document.addEventListener('change',e=>{if(e.target.dataset.check){work.checks[e.target.dataset.check]=e.target.checked;save();e.target.closest('.check').classList.toggle('checked',e.target.checked);renderProgress();renderNav();}if(e.target.id==='illustrationFile'){const file=e.target.files[0];if(!file)return;if(!['image/png','image/jpeg','image/webp'].includes(file.type)||file.size>15*1024*1024){toast(lang==='en'?'Choose a PNG, JPEG or WebP under 15 MB.':'15MB 이하의 PNG·JPEG·WebP를 선택하세요.');return;}if(illustrationUrl)URL.revokeObjectURL(illustrationUrl);illustrationUrl=URL.createObjectURL(file);updateLab();}});
$('exportWork').addEventListener('click',exportWork);$('auditButton').addEventListener('click',showAudit);$('closeAudit').addEventListener('click',()=>$('auditDialog').close());$('evidenceLauncher').addEventListener('click',()=>openEvidence(refs(current()).filter(r=>r.messageId).map(r=>r.messageId)));$('evidenceTop').addEventListener('click',()=>openEvidence(null));$('closeEvidence').addEventListener('click',()=>$('evidenceDialog').close());$('allEvidence').addEventListener('click',()=>openEvidence(null));$('evidenceSearch').addEventListener('input',renderEvidence);
for(const d of [$('auditDialog'),$('evidenceDialog')])d.addEventListener('click',e=>{if(e.target!==d)return;const r=d.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)d.close();});
function readHash(){const [m,id]=location.hash.slice(1).split('/');if(m==='technical'&&DATA.tech.sections.some(s=>s.id===id)){mode=m;selectedTech=id;}if(m==='tutorial'&&DATA.tutorial.lessons.some(s=>s.id===id)){mode=m;selectedLesson=id;}}
window.addEventListener('hashchange',()=>{readHash();renderLanguage()});readHash();renderLanguage();if(location.hash)requestAnimationFrame(()=>$('workspace').scrollIntoView({block:'start'}));
</script></body></html>
